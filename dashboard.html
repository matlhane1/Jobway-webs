<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#11283a;color:white;font-family:Arial;padding:20px}
.top{display:flex;justify-content:space-between;align-items:center}
.card{background:#1e3a4f;border-radius:16px;padding:18px;margin-top:18px}
.btn{background:white;color:#11283a;border:none;padding:10px 14px;border-radius:10px;font-weight:900;cursor:pointer}
</style></head><body>
<div class="top"><h2>JobWay</h2><button class="btn" id="logout">Logout</button></div>
<div class="card"><h3 id="welcome">Loading...</h3><p id="email"></p></div>
<div class="card"><h3>Jobs for you</h3><p style="color:#9cc2d0">Dashboard working! Next we add real jobs.</p></div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
(async()=>{
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){location.href='login.html?v=38';return;}
document.getElementById('welcome').textContent='Welcome, '+(session.user.user_metadata.full_name||'User')+' 👋';
document.getElementById('email').textContent=session.user.email;
})();
document.getElementById('logout').onclick=async()=>{await supabaseClient.auth.signOut();location.href='login.html?v=38';};
</script></body></html>
