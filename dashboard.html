<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11283a;font-family:Inter,Arial,sans-serif}
.box{text-align:center;color:white}
.spinner{width:46px;height:46px;border:4px solid rgba(1,249,198,0.2);border-top-color:#01F9C6;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
@keyframes spin{to{transform:rotate(360deg)}}
h2{margin:0;font-size:22px;font-weight:800} p{color:#9cc2d0;margin-top:8px;font-size:14px}
</style></head><body>
<div class="box">
<div class="spinner"></div>
<h2>Loading your dashboard...</h2>
<p>Please wait</p>
</div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0eHhSNLK7hv1iEg_oYIr1M3");
(async()=>{
const {data:{session}}=await supabaseClient.auth.getSession();
if(!session){location.href="login.html?v=31";return;}
const {data:profile,error}=await supabaseClient.from('profiles').select('role').eq('id',session.user.id).single();
if(error || !profile){console.log(error);location.href="login.html?v=31";return;}
if(profile.role==='employer'){location.href="employer-dashboard.html?v=31";}
else{location.href="seeker-dashboard.html?v=31";}
})();
</script></body></html>
