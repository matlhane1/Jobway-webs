<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Applications - JobWay.co.za</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11283a;color:#fff;font-family:Arial,sans-serif}.header{background:#0d1f2d;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid #1e3a4a}.logo{color:#01F9C6;font-weight:900;font-size:20px}.btn{border:0;border-radius:20px;padding:9px 14px;font-weight:800;font-size:13px}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a}.container{max-width:480px;margin:0 auto;padding:14px}.card{background:#1a3446;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #1e3a4a}.meta{color:#8fb3c1;font-size:12px;margin:6px 0;line-height:1.5}.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin:2px}.s-active{background:#01F9C6;color:#11283a}.s-pending{background:#2a4a5c;color:#8fb3c1}.s-done{background:#143e4a;color:#01F9C6}.interview-box{background:#2a2410;border:1px solid #ffb020;border-radius:12px;padding:12px;margin-top:10px;font-size:13px}.hired-box{background:#0a3a2a;border:1px solid #01F9C6;border-radius:12px;padding:12px;margin-top:10px}.wa-btn{display:inline-block;background:#25D366;color:#fff;padding:9px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none;margin-top:10px}.ext-link{display:inline-block;background:#01F9C6;color:#11283a;padding:9px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none;margin-top:10px;margin-left:6px}.cv-link{display:inline-block;background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:7px 11px;border-radius:20px;font-weight:700;font-size:12px;text-decoration:none;margin-top:8px}.notif{padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;text-align:center;font-weight:700}</style></head>
<body>
<div class="header"><div class="logo" onclick="location.href='index.html'">JobWay</div><div><button class="btn btn-white" onclick="location.href='jobs.html'">← Jobs</button><button class="btn btn-green" style="margin-left:6px" onclick="location.href='notifications.html'">🔔 Bell</button></div></div>
<div class="container">
<h2>📊 My Applications <span id="count" style="color:#01F9C6"></span></h2>
<div id="banner"></div>
<div id="list"><p class="meta">Loading...</p></div>
</div>
<script>
var SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';

function fmtDate(d){ try{ if(!d) return ''; var dt = new Date(d); if(isNaN(dt)) return d; return dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()] + ' ' + dt.getFullYear(); }catch(e){ return d; } }
function formatPhone(p){ if(!p) return ''; var c = p.toString().replace(/[^0-9]/g, ''); if(c.charAt(0) === '0') c = '27' + c.slice(1); return c; }
function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('jobway_user') || localStorage.getItem('user') || 'null'); }catch(e){ return null; } }
function getCVUrl(a){
  var raw = a.cv_url || '';
  if(!raw) return null;
  if(raw.indexOf('http') === 0 || raw.indexOf('data:') === 0) return raw;
  return SUPABASE_URL + '/storage/v1/object/public/cvs/' + raw;
}
function getApplyUrl(job){
  if(!job) return 'https://www.careers24.com';
  if(job.apply_url && job.apply_url.indexOf('http') === 0) return job.apply_url;
  if(job.description){ var m = job.description.match(/https?:\/\/[^\s\)]+/); if(m) return m[0].replace(/[.,]$/, ''); }
  return 'https://www.careers24.com';
}
function xhrGet(url, cb){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.timeout = 8000;
  xhr.onreadystatechange = function(){ if(xhr.readyState === 4){ if(xhr.status === 200){ try{ cb(JSON.parse(xhr.responseText)); }catch(e){ cb([]); } } else cb([]); } };
  xhr.onerror = function(){ cb([]); };
  xhr.ontimeout = function(){ cb([]); };
  try{ xhr.send(); }catch(e){ cb([]); }
}

function load(){
  var user = getCurrentUser();
  if(!user || (!user.id && !user.email)){
    document.getElementById('list').innerHTML = '<div class="card" style="text-align:center"><p>Please log in to track applications</p><button class="btn btn-green" onclick="location.href=\'login.html\'">Log In</button></div>';
    return;
  }
  var applicantId = user.id;
  if(!applicantId || applicantId.length < 20){
    // Try find by email
    if(user.email){
      xhrGet(SUPABASE_URL + '/rest/v1/profiles?select=id&email=eq.' + encodeURIComponent(user.email), function(profs){
        if(profs && profs.length > 0) fetchApps(profs[0].id);
        else render([]);
      });
    } else render([]);
    return;
  }
  fetchApps(applicantId);
}

function fetchApps(applicantId){
  xhrGet(SUPABASE_URL + '/rest/v1/applications?select=*&applicant_id=eq.' + applicantId + '&order=created_at.desc', function(apps){
    if(!apps || apps.length === 0){ render([]); return; }
    // Fetch jobs one by one (simple, works on old phones)
    var done = 0;
    var clean = [];
    if(apps.length === 0){ render([]); return; }
    for(var i=0;i<apps.length;i++){
      (function(app){
        if(!app.job_id){ done++; if(done === apps.length) render(clean); return; }
        xhrGet(SUPABASE_URL + '/rest/v1/jobs?select=*&id=eq.' + app.job_id, function(jobs){
          if(jobs && jobs.length > 0) app.jobs = jobs[0];
          if(app.jobs) clean.push(app);
          done++;
          if(done === apps.length) render(clean);
        });
      })(apps[i]);
    }
  });
}

function render(all){
  document.getElementById('count').innerHTML = '(' + all.length + ')';
  var shortlisted = 0, interviews = 0, hired = 0;
  for(var i=0;i<all.length;i++){ var s = (all[i].status || '').toLowerCase(); if(s.indexOf('shortlist') !== -1) shortlisted++; if(s.indexOf('interview') !== -1 || all[i].interview_date) interviews++; if(s.indexOf('hired') !== -1 || all[i].status === 'Approved') hired++; }
  var banner = '';
  if(hired) banner = '<div class="notif" style="background:#0a3a2a;color:#01F9C6">🎉 You are Hired for ' + hired + ' job(s)!</div>';
  else if(interviews) banner = '<div class="notif" style="background:#2a2410;color:#FFB020">📅 ' + interviews + ' Interview Scheduled — check below</div>';
  else if(shortlisted) banner = '<div class="notif" style="background:#0a3a2a;color:#01F9C6">⭐ Shortlisted for ' + shortlisted + ' job(s)!</div>';
  document.getElementById('banner').innerHTML = banner;
  if(all.length === 0){
    document.getElementById('list').innerHTML = '<div class="card" style="text-align:center"><p>No applications yet</p><p class="meta">Go apply for Cashier/General Worker first</p><button class="btn btn-green" onclick="location.href=\'jobs.html\'">Go Apply</button></div>';
    return;
  }
  var html = '';
  for(var k=0;k<all.length;k++){
    var app = all[k];
    var title = (app.jobs && app.jobs.title) || 'Job';
    var comp = (app.jobs && (app.jobs.company_name || app.jobs.company)) || '';
    var status = app.status || 'Application Received';
    if(status === 'Applied') status = 'Application Received';
    if(status === 'Approved') status = 'Hired';
    if(status === 'shortlisted') status = 'Shortlisted';
    if(status === 'interview') status = 'Interview Scheduled';
    var steps = ['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired'];
    var idx = steps.indexOf(status);
    if((status === 'Not Selected' || status === 'Rejected')) idx = -1;
    if(idx === -1 && status !== 'Not Selected' && status !== 'Rejected') idx = 0;
    var badges = '';
    for(var b=0;b<steps.length;b++){ var cls = b < idx ? 's-done' : (b === idx ? 's-active' : 's-pending'); var icon = b < idx ? '✅' : (b === idx ? '👁️' : ''); badges += '<span class="badge ' + cls + '">' + icon + ' ' + steps[b] + '</span>'; }
    var interview = '';
    if(app.interview_date || status === 'Interview Scheduled'){
      interview = '<div class="interview-box">📅 <b>INTERVIEW SCHEDULED</b><br>Date: <b>' + (app.interview_date || 'To be confirmed') + '</b><br>Time: <b>' + (app.interview_time || '') + '</b><br>Location: <b>' + (app.interview_location || 'Thohoyandou Office') + '</b><br>' + (app.interview_note || 'Bring ID & CV') + '</div>';
    }
    var hiredBox = status === 'Hired' ? '<div class="hired-box">🎉 <b>CONGRATULATIONS — YOU ARE HIRED!</b><br><span style="font-size:12px">' + comp + ' will contact you.</span></div>' : '';
    var rejected = (status === 'Not Selected' || status === 'Rejected') ? '<div style="color:#ff8a8a;margin-top:8px;font-size:13px">❌ Not Selected. Keep applying — new jobs every week.</div>' : '';
    var empPhone = formatPhone((app.jobs && app.jobs.whatsapp_number) || '0790608952');
    var myName = (getCurrentUser() && getCurrentUser().full_name) || 'Applicant';
    var msg = 'Hi ' + comp + ', I\'m ' + myName + '. I applied for ' + title + ' on JobWay. Status: ' + status;
    var waBtn = '<a href="https://wa.me/' + empPhone + '?text=' + encodeURIComponent(msg) + '" target="_blank" class="wa-btn">💬 Message Employer</a>';
    var salaryText = (app.jobs && app.jobs.salary_min) ? 'R' + app.jobs.salary_min + (app.jobs.salary_max ? ' - R' + app.jobs.salary_max : '+') : '';
    var extBtn = '<a href="' + getApplyUrl(app.jobs) + '" target="_blank" class="ext-link">Apply on Original Site ↗</a>';
    var cvUrl = getCVUrl(app);
    var cvBtn = cvUrl ? '<br><a href="' + cvUrl + '" target="_blank" class="cv-link">📄 View My Submitted CV</a>' : '';
    html += '<div class="card"><h3 style="margin:0 0 6px">' + title + ' - ' + comp + '</h3><div class="meta">Applied: ' + fmtDate(app.created_at) + ' • ' + ((app.jobs && app.jobs.location) || '') + ' ' + salaryText + '</div><div>' + badges + '</div><div class="meta"><b>Status:</b> ' + status + '</div>' + interview + hiredBox + rejected + cvBtn + '<br>' + waBtn + extBtn + '</div>';
  }
  document.getElementById('list').innerHTML = html;
}
load();
</script></body></html>
