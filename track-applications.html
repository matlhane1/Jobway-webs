<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Track Applications - JobWay.co.za</title>
<style>*{box-sizing:border-box}body{margin:0;background:#11283a;color:#fff;font-family:Arial,sans-serif}.header{background:#0d1f2d;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;border-bottom:1px solid #1e3a4a}.logo{color:#01F9C6;font-weight:900;font-size:20px}.btn{border:0;border-radius:20px;padding:9px 14px;font-weight:800;font-size:13px}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a}.container{max-width:480px;margin:0 auto;padding:14px}.card{background:#1a3446;border-radius:16px;padding:16px;margin-bottom:12px;border:1px solid #1e3a4a}.meta{color:#8fb3c1;font-size:12px;margin:6px 0;line-height:1.5}.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin:2px}.s-active{background:#01F9C6;color:#11283a}.s-pending{background:#2a4a5c;color:#8fb3c1}.s-done{background:#143e4a;color:#01F9C6}.interview-box{background:#2a2410;border:1px solid #ffb020;border-radius:12px;padding:12px;margin-top:10px;font-size:13px}.hired-box{background:#0a3a2a;border:1px solid #01F9C6;border-radius:12px;padding:12px;margin-top:10px}.wa-btn{display:inline-block;background:#25D366;color:#fff;padding:9px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none;margin-top:10px}.ext-link{display:inline-block;background:#01F9C6;color:#11283a;padding:9px 14px;border-radius:20px;font-weight:800;font-size:12px;text-decoration:none;margin-top:10px;margin-left:6px}.cv-link{display:inline-block;background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:7px 11px;border-radius:20px;font-weight:700;font-size:12px;text-decoration:none;margin-top:8px;cursor:pointer}.notif{padding:10px;border-radius:10px;font-size:12px;margin-bottom:12px;text-align:center;font-weight:700}</style></head>
<body>
<div class="header"><div class="logo" onclick="location.href='index.html'">JobWay</div><div><button class="btn btn-white" onclick="location.href='jobs.html'">← Jobs</button><button class="btn btn-green" style="margin-left:6px" onclick="location.href='notifications.html'">🔔 Bell</button></div></div>
<div class="container">
<h2>📊 My Applications <span id="count" style="color:#01F9C6"></span></h2>
<div id="banner"></div>
<div id="list"><p class="meta">Loading...</p></div>
</div>
<script>
var SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';

function fmtDate(d){ try{ if(!d) return ''; var dt = new Date(d); if(isNaN(dt)) return d; return dt.getDate() + ' ' + ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()] + ' ' + dt.getFullYear(); }catch(e){ return d; } }
function formatPhone(p){ if(!p) return ''; var c = p.toString().replace(/[^0-9]/g, ''); if(c.charAt(0) === '0') c = '27' + c.slice(1); return c; }
// FIXED: Check ALL keys jobs.html / login uses, not just jobway_user
function getCurrentUser(){
  var keys = ['jobway_user','jobway_profile','jobway_jobseeker','user','jobway_logged_in_user'];
  for(var i=0;i<keys.length;i++){
    try{ var u = JSON.parse(localStorage.getItem(keys[i]) || 'null'); if(u && (u.id || u.email || u.phone || u.fullName || u.full_name)) return u; }catch(e){}
  }
  // jobway_profile stores fullName / phoneClean / whatsapp differently
  try{ var p = JSON.parse(localStorage.getItem('jobway_profile') || '{}'); if(p && (p.fullName || p.phoneClean)) return { id: p.id || p.user_id || '', full_name: p.fullName || '', fullName: p.fullName || '', phone: p.phoneClean || p.whatsapp || '', email: p.email || '', cv_url: p.cv_url || '' }; }catch(e){}
  return null;
}
function getMyPhone(){
  var u = getCurrentUser() || {};
  return u.phoneClean || u.phone || u.whatsapp || u.whatsapp_number || localStorage.getItem('phone') || localStorage.getItem('jobway_whatsapp') || '';
}
function getMyName(){
  var u = getCurrentUser() || {};
  return u.fullName || u.full_name || u.name || 'Applicant';
}
// FIXED: Read local save from jobs.html FIRST - this is what makes Track show (1) instantly
function getLocalApps(){
  try{ var a = JSON.parse(localStorage.getItem('jobway_applications') || '[]'); if(Array.isArray(a)) return a; }catch(e){}
  return [];
}
function getCvPath(a){
  var raw = a.cv_path || a.cv_url || '';
  if(!raw){
    try{ var p = JSON.parse(localStorage.getItem('jobway_profile') || '{}'); raw = p.cv_url || ''; }catch(e){}
  }
  if(!raw) return null;
  if(raw.indexOf('http') !== -1){
    var m = raw.split('/cvs/');
    if(m[1]) return m[1].split('?')[0];
    return raw.split('/').pop();
  }
  return raw.replace(/^cvs\//,'').trim();
}
function downloadMyCV(cvPath, btn){
  if(!cvPath){ alert('No CV found for this application'); return; }
  btn.innerHTML = '⏳ Generating secure link...';
  btn.disabled = true;
  var xhr = new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL + '/functions/v1/get-cv-link', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onreadystatechange = function(){
    if(xhr.readyState === 4){
      if(xhr.status === 200){
        try{
          var res = JSON.parse(xhr.responseText);
          if(res.signedUrl){ window.open(res.signedUrl, '_blank'); btn.innerHTML = '✅ Opened (valid 60min)'; }
          else { btn.innerHTML = '🔒 Private CV — contact support'; }
        }catch(e){ btn.innerHTML = '❌ Failed, try again'; }
      } else {
        btn.innerHTML = '🔒 CV is private (deploy get-cv-link function)';
        alert('Edge function not deployed yet. Deploy get-cv-link to enable temporary downloads. CV is safe and private.');
      }
      setTimeout(function(){ btn.innerHTML = '📄 View My Submitted CV (60min link)'; btn.disabled=false; }, 3000);
    }
  };
  xhr.send(JSON.stringify({ cv_path: cvPath, mode: 'applicant' }));
}
// FIXED: Never default to Careers24
function getApplyUrl(job){
  if(!job) return '';
  if(job.apply_url && job.apply_url.indexOf('http') === 0) return job.apply_url;
  if(job.application_url && job.application_url.indexOf('http') === 0) return job.application_url;
  if(job.url && job.url.indexOf('http') === 0) return job.url;
  if(job.description){ var m = job.description.match(/https?:\/\/[^\s\)]+/); if(m) return m[0].replace(/[.,]$/, ''); }
  return '';
}
function xhrGet(url, cb){
  var xhr = new XMLHttpRequest();
  xhr.open('GET', url, true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization', 'Bearer ' + SUPABASE_KEY);
  xhr.timeout = 8000;
  xhr.onreadystatechange = function(){ if(xhr.readyState === 4){ if(xhr.status === 200){ try{ cb(JSON.parse(xhr.responseText)); }catch(e){ cb([]); } } else cb([]); } };
  xhr.onerror = function(){ cb([]); };
  xhr.ontimeout = function(){ cb([]); };
  try{ xhr.send(); }catch(e){ cb([]); }
}
function load(){
  var user = getCurrentUser();
  var local = getLocalApps();
  // Show local instantly so user never sees (0) after applying
  if(local.length){
    // Convert local shape to track shape, then enrich with job details
    var converted = local.map(function(a){ return { jobId: a.jobId, job_id: a.jobId, title: a.title, created_at: a.date, status: a.status || 'Application Received', cv_url: a.cv_url || '', _isLocal: true }; });
    enrichWithJobs(converted, function(enriched){
      render(enriched);
      // Then also try Supabase in background to get employer status updates
      fetchFromSupabase(function(remote){
        if(remote && remote.length){
          var merged = mergeApps(enriched, remote);
          enrichWithJobs(merged, function(finalList){ render(finalList); });
        }
      });
    });
    return;
  }
  // No local - try Supabase
  fetchFromSupabase(function(remote){
    if(!remote || !remote.length){ render([]); return; }
    enrichWithJobs(remote, function(enriched){ render(enriched); });
  });
}
function mergeApps(localList, remoteList){
  var seen = {};
  var out = [];
  // Remote (Supabase) is truth - it has employer status
  for(var i=0;i<remoteList.length;i++){ var r = remoteList[i]; var k = String(r.job_id || r.jobId || ''); if(k && !seen[k]){ seen[k]=1; out.push(r); } }
  for(var j=0;j<localList.length;j++){ var l = localList[j]; var k2 = String(l.job_id || l.jobId || ''); if(k2 && !seen[k2]){ seen[k2]=1; out.push(l); } }
  return out;
}
function fetchFromSupabase(cb){
  var user = getCurrentUser();
  var applicantId = user ? (user.id || user.user_id || '') : '';
  var phone = getMyPhone();
  var phoneClean = phone ? phone.replace(/[^0-9]/g,'') : '';
  var phoneVariants = [];
  if(phoneClean){
    phoneVariants.push(phoneClean);
    if(phoneClean.charAt(0)==='0') phoneVariants.push('27'+phoneClean.slice(1));
    if(phoneClean.indexOf('27')===0) phoneVariants.push('0'+phoneClean.slice(2));
    phoneVariants.push(formatPhone(phoneClean));
  }
  var done = false;
  function finish(apps){ if(done) return; done=true; cb(apps||[]); }
  // 1. Try by applicant_id (new jobs.html sends this)
  if(applicantId && String(applicantId).length >= 10){
    xhrGet(SUPABASE_URL + '/rest/v1/applications?select=*&applicant_id=eq.' + encodeURIComponent(applicantId) + '&order=created_at.desc', function(apps){
      if(apps && apps.length){ finish(apps); return; }
      // 2. Fallback: try by phone (old jobs.html only sent phone)
      tryByPhone();
    });
  } else {
    tryByPhone();
  }
  function tryByPhone(){
    if(!phoneVariants.length){ finish([]); return; }
    // Try first phone variant, then others if needed
    var tried = 0;
    function tryOne(){
      if(tried >= phoneVariants.length){ finish([]); return; }
      var ph = phoneVariants[tried]; tried++;
      xhrGet(SUPABASE_URL + '/rest/v1/applications?select=*&phone=eq.' + encodeURIComponent(ph) + '&order=created_at.desc', function(apps){
        if(apps && apps.length){ finish(apps); return; }
        tryOne();
      });
    }
    tryOne();
  }
}
function enrichWithJobs(apps, cb){
  if(!apps || !apps.length){ cb([]); return; }
  var done = 0; var clean = [];
  for(var i=0;i<apps.length;i++){
    (function(app){
      var jobId = app.job_id || app.jobId;
      if(!jobId){ done++; if(done === apps.length) cb(clean); return; }
      // If local already has title, keep it even if job fetch fails
      xhrGet(SUPABASE_URL + '/rest/v1/jobs?select=*&id=eq.' + encodeURIComponent(jobId), function(jobs){
        if(jobs && jobs.length > 0) app.jobs = jobs[0];
        // Keep local apps even if job was deleted
        clean.push(app);
        done++;
        if(done === apps.length) cb(clean);
      });
    })(apps[i]);
  }
}
function render(all){
  document.getElementById('count').innerHTML = '(' + all.length + ')';
  var shortlisted = 0, interviews = 0, hired = 0;
  for(var i=0;i<all.length;i++){ var s = (all[i].status || '').toLowerCase(); if(s.indexOf('shortlist') !== -1) shortlisted++; if(s.indexOf('interview') !== -1 || all[i].interview_date) interviews++; if(s.indexOf('hired') !== -1 || all[i].status === 'Approved') hired++; }
  var banner = '';
  if(hired) banner = '<div class="notif" style="background:#0a3a2a;color:#01F9C6">🎉 You are Hired for ' + hired + ' job(s)!</div>';
  else if(interviews) banner = '<div class="notif" style="background:#2a2410;color:#FFB020">📅 ' + interviews + ' Interview Scheduled — check below</div>';
  else if(shortlisted) banner = '<div class="notif" style="background:#0a3a2a;color:#01F9C6">⭐ Shortlisted for ' + shortlisted + ' job(s)!</div>';
  document.getElementById('banner').innerHTML = banner;
  if(all.length === 0){
    document.getElementById('list').innerHTML = '<div class="card" style="text-align:center"><p>No applications yet</p><p class="meta">Go apply for Cashier/General Worker first</p><button class="btn btn-green" onclick="location.href=\'jobs.html\'">Go Apply</button></div>';
    return;
  }
  var html = '';
  for(var k=0;k<all.length;k++){
    var app = all[k];
    var title = (app.jobs && app.jobs.title) || app.title || 'Job';
    var comp = (app.jobs && (app.jobs.company_name || app.jobs.company)) || '';
    var status = app.status || 'Application Received';
    if(status === 'Applied') status = 'Application Received';
    if(status === 'Approved') status = 'Hired';
    if(status === 'shortlisted') status = 'Shortlisted';
    if(status === 'interview') status = 'Interview Scheduled';
    var steps = ['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired'];
    var idx = steps.indexOf(status);
    if((status === 'Not Selected' || status === 'Rejected')) idx = -1;
    if(idx === -1 && status !== 'Not Selected' && status !== 'Rejected') idx = 0;
    var badges = '';
    for(var b=0;b<steps.length;b++){ var cls = b < idx ? 's-done' : (b === idx ? 's-active' : 's-pending'); var icon = b < idx ? '✅' : (b === idx ? '👁️' : ''); badges += '<span class="badge ' + cls + '">' + icon + ' ' + steps[b] + '</span>'; }
    var interview = '';
    if(app.interview_date || status === 'Interview Scheduled'){
      interview = '<div class="interview-box">📅 <b>INTERVIEW SCHEDULED</b><br>Date: <b>' + (app.interview_date || 'To be confirmed') + '</b><br>Time: <b>' + (app.interview_time || '') + '</b><br>Location: <b>' + (app.interview_location || 'Thohoyandou Office') + '</b><br>' + (app.interview_note || 'Bring ID & CV') + '</div>';
    }
    var hiredBox = status === 'Hired' ? '<div class="hired-box">🎉 <b>CONGRATULATIONS — YOU ARE HIRED!</b><br><span style="font-size:12px">' + comp + ' will contact you.</span></div>' : '';
    var rejected = (status === 'Not Selected' || status === 'Rejected') ? '<div style="color:#ff8a8a;margin-top:8px;font-size:13px">❌ Not Selected. Keep applying — new jobs every week.</div>' : '';
    var empPhone = formatPhone((app.jobs && (app.jobs.whatsapp_number_for_applicants || app.jobs.whatsapp_number)) || '0790608952');
    var myName = getMyName();
    var msg = 'Hi ' + comp + ', I\'m ' + myName + '. I applied for ' + title + ' on JobWay. Status: ' + status;
    var waBtn = '<a href="https://wa.me/' + empPhone + '?text=' + encodeURIComponent(msg) + '" target="_blank" class="wa-btn">💬 Message Employer</a>';
    var salaryText = (app.jobs && app.jobs.salary_min) ? 'R' + app.jobs.salary_min + (app.jobs.salary_max ? ' - R' + app.jobs.salary_max : '+') : '';
    var applyUrl = getApplyUrl(app.jobs);
    // FIXED: Only show external link if job is scraped (has real link). Paid jobs have no external link.
    var extBtn = applyUrl ? '<a href="' + applyUrl + '" target="_blank" class="ext-link">Apply on Original Site ↗</a>' : '';
    var cvPath = getCvPath(app);
    var cvBtn = cvPath ? '<br><button class="cv-link" onclick="downloadMyCV(\''+cvPath+'\', this)">📄 View My Submitted CV (60min link)</button>' : '<br><span class="meta">🔒 No CV attached to this application</span>';
    html += '<div class="card"><h3 style="margin:0 0 6px">' + title + ' - ' + comp + '</h3><div class="meta">Applied: ' + fmtDate(app.created_at) + ' • ' + ((app.jobs && app.jobs.location) || '') + ' ' + salaryText + '</div><div>' + badges + '</div><div class="meta"><b>Status:</b> ' + status + '</div>' + interview + hiredBox + rejected + cvBtn + '<br>' + waBtn + extBtn + '</div>';
  }
  document.getElementById('list').innerHTML = html;
}
load();
</script></body></html>
