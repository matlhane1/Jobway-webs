<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Employer — JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>:root{--navy:#20576E;--bright:#01F9C6;--deep:#11283A}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--deep);color:#fff;display:grid;place-items:center;height:100vh}.box{text-align:center}.box h1{font-family:'Space Grotesk',sans-serif;font-size:32px}.box p{opacity:0.7;margin:12px 0 20px}.btn{padding:12px 24px;border-radius:999px;border:0;background:var(--bright);color:var(--navy);font-weight:900;cursor:pointer}</style>
</head><body>
<div class="box"><h1>Redirecting...</h1><p>Taking you to employer dashboard</p><button class="btn" onclick="go()">Go to Dashboard</button></div>
<script>
function go(){
  const logged = localStorage.getItem('jobway_logged_in');
  if(logged){ location.href='employer-dashboard.html'; }
  else { location.href='login.html'; }
}
go();
</script>
</body></html>
