<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:28px;max-width:400px;width:100%;text-align:center}
.logo{font-weight:900;color:#01F9C6;font-size:24px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.sub{color:#8DB0BF;font-size:12px;margin-bottom:20px}
.input{width:100%;background:#0F2230;border:1px solid #25475A;border-radius:999px;padding:14px 16px;color:white;margin-bottom:12px;font-size:14px;outline:none}
.input:focus{border-color:#01F9C6}
.btn{width:100%;border:none;border-radius:999px;padding:14px;font-weight:900;cursor:pointer;font-size:14px}
.btn-green{background:#01F9C6;color:#08231C}
.btn-dark{background:#2A3F4E;color:white;margin-top:8px}
.msg{margin-top:12px;font-size:12px;font-weight:700;min-height:18px}
.badge{display:inline-block;background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;margin-bottom:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">JobWay</div>
<div class="badge">SECURE RESET</div>
<h3 style="margin-bottom:6px">Reset Password</h3>
<p class="sub" id="subText">Enter your new password below</p>

<input type="password" id="newPass" class="input" placeholder="New password (min 6 characters)">
<input type="password" id="confirmPass" class="input" placeholder="Confirm new password">
<button class="btn btn-green" onclick="doReset()">Update Password</button>
<button class="btn btn-dark" onclick="location.href='login.html'">Back to Login</button>
<div id="msg" class="msg"></div>
</div>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
const msgEl = document.getElementById('msg');
const subText = document.getElementById('subText');

let resets = JSON.parse(localStorage.getItem('jobway_password_resets')||'{}');
let users = JSON.parse(localStorage.getItem('jobway_users')||'[]');

function showError(t){
  msgEl.innerText = t;
  msgEl.style.color = '#ff8a8a';
  subText.innerText = '❌ Invalid or expired link';
}

(function validateToken(){
  if(!token ||!resets[token]){
    showError('⛔ Invalid reset link. Request a new one in login.');
    document.getElementById('newPass').disabled = true;
    document.getElementById('confirmPass').disabled = true;
    return;
  }
  const data = resets[token];
  const oneHour = 60*60*1000;
  if(Date.now() - data.time > oneHour){
    delete resets[token];
    localStorage.setItem('jobway_password_resets', JSON.stringify(resets));
    showError('⏰ Link expired (1 hour). Request new one.');
    return;
  }
  subText.innerText = `🔒 Reset for ${data.email}`;
})();

function doReset(){
  const np = document.getElementById('newPass').value.trim();
  const cp = document.getElementById('confirmPass').value.trim();

  if(np.length < 6){ msgEl.innerText='⚠️ Password must be 6+ chars'; msgEl.style.color='#ff8a8a'; return; }
  if(np!== cp){ msgEl.innerText='⚠️ Passwords do not match'; msgEl.style.color='#ff8a8a'; return; }
  if(!token ||!resets[token]){ showError('Invalid token'); return; }

  const email = resets[token].email.toLowerCase();
  let found = false;

  // update in jobway_users
  users = users.map(u => {
    if(u.email && u.email.toLowerCase() === email){
      u.password = np;
      found = true;
    }
    return u;
  });

  // also support old keys if you used different storage
  let simpleUsers = JSON.parse(localStorage.getItem('jobway_all_users')||'[]');
  simpleUsers = simpleUsers.map(u => {
    if(u.email && u.email.toLowerCase() === email){
      u.password = np;
      found = true;
    }
    return u;
  });

  if(!found){
    // create if not exist (first time)
    users.push({email: email, password: np, role: 'candidate'});
  }

  localStorage.setItem('jobway_users', JSON.stringify(users));
  localStorage.setItem('jobway_all_users', JSON.stringify(simpleUsers));

  // delete token after use
  delete resets[token];
  localStorage.setItem('jobway_password_resets', JSON.stringify(resets));

  msgEl.innerText = '✅ Password updated! Redirecting to login...';
  msgEl.style.color = '#01F9C6';
  setTimeout(()=> location.href='login.html', 1500);
}
</script>
</body>
</html>
