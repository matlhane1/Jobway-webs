<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:28px;max-width:400px;width:100%;text-align:center}
.logo{font-weight:900;color:#01F9C6;font-size:24px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.sub{color:#8DB0BF;font-size:12px;margin-bottom:20px;line-height:1.5}
.input{width:100%;background:#0F2230;border:1px solid #25475A;border-radius:12px;padding:14px 16px;color:white;margin-bottom:12px;font-size:14px;outline:none}
.input:focus{border-color:#01F9C6}
.btn{width:100%;border:none;border-radius:999px;padding:14px;font-weight:900;cursor:pointer;font-size:14px}
.btn-green{background:#01F9C6;color:#08231C}
.btn-dark{background:#2A3F4E;color:white;margin-top:8px}
.msg{margin-top:12px;font-size:12px;font-weight:700;min-height:18px}
.pw-wrap{position:relative}
.pw-toggle{position:absolute;right:12px;top:12px;background:none;border:none;color:#8DB0BF;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="card">
<div class="logo">JobWay</div>
<h3>Reset Password</h3>
<p class="sub" id="subText">Enter your new password below</p>
<div class="pw-wrap">
<input type="password" id="newPass" class="input" placeholder="New password (min 6 characters)">
<button type="button" class="pw-toggle" id="pwToggle" onclick="togglePw()">👁️ Show</button>
</div>
<input type="password" id="confirmPass" class="input" placeholder="Confirm new password">
<button class="btn btn-green" id="resetBtn" onclick="doReset()">Update Password</button>
<button class="btn btn-dark" onclick="location.href='login.html'">Back to Login</button>
<div id="msg" class="msg"></div>
</div>

<script>
const supa = window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");

function togglePw(){
  const pw=document.getElementById("newPass");
  const btn=document.getElementById("pwToggle");
  if(pw.type==="password"){ pw.type="text"; btn.textContent="🙈 Hide"; }
  else{ pw.type="password"; btn.textContent="👁️ Show"; }
}

// IMPORTANT: Check if user came from email link
window.addEventListener('load', async ()=>{
  const hash = window.location.hash;
  if(hash && hash.includes('access_token')){
    // Supabase will auto-parse the token from URL
    const { data, error } = await supa.auth.getSession();
    if(error) document.getElementById('msg').innerText = '❌ Link expired, request new reset';
    else document.getElementById('subText').innerText = 'Link verified ✅ Enter new password';
  } else {
    // No token - check if already logged in
    const { data } = await supa.auth.getSession();
    if(!data.session) document.getElementById('msg').innerText = '⚠️ Invalid or expired link. Please request a new reset from forgot-password.html';
  }
});

async function doReset(){
  const np=document.getElementById('newPass').value.trim();
  const cp=document.getElementById('confirmPass').value.trim();
  const msg=document.getElementById('msg');
  if(np.length<6){msg.innerText='⚠️ Password must be 6+ chars';msg.style.color='#ff8a8a';return;}
  if(np!==cp){msg.innerText='⚠️ Passwords do not match';msg.style.color='#ff8a8a';return;}
  const btn=document.getElementById('resetBtn'); btn.textContent='Updating...'; btn.disabled=true;
  const {error}=await supa.auth.updateUser({password:np});
  if(error){msg.innerText='❌ '+error.message;msg.style.color='#ff8a8a'; btn.textContent='Update Password'; btn.disabled=false;}
  else{msg.innerText='✅ Password updated! Redirecting...';msg.style.color='#01F9C6';setTimeout(()=>location.href='login.html',1500);}
}
</script>
</body>
</html>
