<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh;display:flex;flex-direction:column}
.header{background:#11283A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E3A4A}
.logo{font-weight:900;color:#01F9C6;font-size:20px}.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#2A3F4E;color:white}.container{max-width:420px;margin:40px auto;padding:16px;width:100%}
.card{background:#1A3341;border:1px solid #25475A;border-radius:20px;padding:22px}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:14px;border-radius:12px;margin-top:10px}
.btn-submit{width:100%;background:#01F9C6;color:#08231C;border:none;border-radius:999px;padding:14px;font-weight:900;margin-top:16px;cursor:pointer}
</style></head><body>
<div class="header"><div class="logo">JobWay</div><div><button class="btn btn-dark" onclick="location.href='login.html'">Log In</button></div></div>
<div class="container"><div class="card"><h2>Set New Password</h2><input class="input" id="newPass" type="password" placeholder="New password (6+ chars)"><button class="btn-submit" onclick="updatePass()">Update Password</button><div id="msg" style="margin-top:12px;font-size:12px;text-align:center"></div></div></div>
<script>
const supabaseClient = window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
async function updatePass(){
  const p = document.getElementById('newPass').value;
  if(p.length<6){ alert('Min 6 chars'); return; }
  const { error } = await supabaseClient.auth.updateUser({ password: p });
  if(error){ document.getElementById('msg').innerText='❌ '+error.message; return; }
  alert('✅ Password updated! Login now'); location.href='login.html';
}
</script></body></html>
