<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:28px;max-width:400px;width:100%;text-align:center}
.logo{font-weight:900;color:#01F9C6;font-size:24px;margin-bottom:6px;font-family:'Space Grotesk',sans-serif}
.sub{color:#8DB0BF;font-size:12px;margin-bottom:20px;line-height:1.5}
.input{width:100%;background:#0F2230;border:1px solid #25475A;border-radius:999px;padding:14px 16px;color:white;margin-bottom:12px;font-size:14px;outline:none}
.input:focus{border-color:#01F9C6}
.btn{width:100%;border:none;border-radius:999px;padding:14px;font-weight:900;cursor:pointer;font-size:14px}
.btn-green{background:#01F9C6;color:#08231C}
.btn-dark{background:#2A3F4E;color:white;margin-top:8px}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{margin-top:12px;font-size:12px;font-weight:700;min-height:18px;white-space:pre-line;line-height:1.5}
.badge{display:inline-block;background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:900;margin-bottom:12px}
.divider{margin:18px 0;border:none;border-top:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="card">
<div class="logo">JobWay</div>
<div class="badge">SECURE RESET</div>
<h3 style="margin-bottom:6px" id="title">Reset Password</h3>
<p class="sub" id="subText">Enter your new password below</p>
<div id="requestSection" style="display:none">
<input type="email" id="requestEmail" class="input" placeholder="you@gmail.com">
<button class="btn btn-green" id="requestBtn" onclick="requestNewLink()">Send New Reset Link</button>
<div id="requestMsg" class="msg"></div>
<hr class="divider">
</div>
<div id="resetSection">
<input type="email" id="resetEmailField" class="input" placeholder="Confirm your email" style="display:none">
<input type="password" id="newPass" class="input" placeholder="New password (min 6 characters)">
<input type="password" id="confirmPass" class="input" placeholder="Confirm new password">
<button class="btn btn-green" id="updateBtn" onclick="doReset()">Update Password</button>
</div>
<button class="btn btn-dark" onclick="location.href='login.html'">Back to Login</button>
<div id="msg" class="msg"></div>
</div>
<script>
const SUPABASE_ANON_KEY = "sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";
const HYPER_WORKER = "https://dmxumcjeetphwzvgzzuk.supabase.co/functions/v1/hyper-worker";
const params = new URLSearchParams(location.search);
const token = params.get('token');
const msgEl = document.getElementById('msg');
const subText = document.getElementById('subText');
const titleEl = document.getElementById('title');
const emailField = document.getElementById('resetEmailField');
const requestSection = document.getElementById('requestSection');
const resetSection = document.getElementById('resetSection');
const requestEmail = document.getElementById('requestEmail');
const requestMsg = document.getElementById('requestMsg');
let resets = JSON.parse(localStorage.getItem('jobway_password_resets')||'{}');
let users = JSON.parse(localStorage.getItem('jobway_users')||'[]');
let tokenEmail = null;

function showError(t){ msgEl.innerText = t; msgEl.style.color = '#ff8a8a'; }
function showRequestMode(reason){
  titleEl.innerText = "Request New Link";
  subText.innerText = reason;
  requestSection.style.display = 'block';
  resetSection.style.display = 'none';
  msgEl.innerText = '';
  if(tokenEmail) requestEmail.value = tokenEmail;
}

(function validateToken(){
  if(!token){ showRequestMode("No reset token found. Enter email to get a new link."); return; }
  if(!resets[token]){
    emailField.style.display='block';
    requestSection.style.display='block';
    subText.innerText = 'Link opened on different device. Confirm email or request new link.';
    return;
  }
  const data = resets[token];
  const oneHour = 60*60*1000;
  if(Date.now() - data.time > oneHour){
    delete resets[token];
    localStorage.setItem('jobway_password_resets', JSON.stringify(resets));
    showRequestMode('⏰ Link expired (1 hour). Enter email to get a fresh link.');
    return;
  }
  tokenEmail = data.email;
  subText.innerText = `🔒 Reset for ${data.email}`;
})();

async function requestNewLink(){
  const e = requestEmail.value.trim().toLowerCase();
  const btn = document.getElementById('requestBtn');
  if(!e){ requestMsg.innerText='⚠️ Enter email'; requestMsg.style.color='#ff8a8a'; return; }
  requestMsg.style.color='#A8C8D0';
  requestMsg.innerText='⏳ Sending...';
  btn.disabled = true;
  btn.textContent = 'Sending...';
  const newToken = Math.random().toString(36).substring(2,15) + Date.now().toString(36);
  let allResets = JSON.parse(localStorage.getItem('jobway_password_resets')||'{}');
  allResets[newToken] = { email: e, time: Date.now() };
  localStorage.setItem('jobway_password_resets', JSON.stringify(allResets));
  const resetLink = 'https://jobway.co.za/reset-password.html?token=' + newToken;
  try{
    const res = await fetch(HYPER_WORKER,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey': SUPABASE_ANON_KEY,
        'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ to: e, resetLink: resetLink })
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { data = { raw: text }; }
    if(res.ok){
      requestMsg.style.color='#01F9C6';
      requestMsg.innerHTML = `✅ New link sent to ${e}<br><span style="color:#A8C8D0">Check inbox & SPAM</span>`;
      btn.textContent = 'Sent! ✓';
    } else {
      throw new Error(data.error||data.message||text);
    }
  }catch(err){
    requestMsg.style.color='#ff8a8a';
    requestMsg.innerText='❌ '+err.message;
    btn.disabled=false;
    btn.textContent='Send New Reset Link';
    delete allResets[newToken];
    localStorage.setItem('jobway_password_resets', JSON.stringify(allResets));
  }
}

function doReset(){
  const np = document.getElementById('newPass').value.trim();
  const cp = document.getElementById('confirmPass').value.trim();
  let email = tokenEmail;
  if(emailField.style.display!== 'none'){
    email = emailField.value.trim().toLowerCase() || requestEmail.value.trim().toLowerCase();
  }
  if(!email){ showError('⚠️ Enter your email'); return; }
  if(np.length < 6){ showError('⚠️ Password must be 6+ chars'); return; }
  if(np!== cp){ showError('⚠️ Passwords do not match'); return; }
  email = email.toLowerCase();
  let found = false;
  users = users.map(u => {
    if(u.email && u.email.toLowerCase() === email){
      u.password = np; found = true;
    }
    return u;
  });
  let simpleUsers = JSON.parse(localStorage.getItem('jobway_all_users')||'[]');
  simpleUsers = simpleUsers.map(u => {
    if(u.email && u.email.toLowerCase() === email){
      u.password = np; found = true;
    }
    return u;
  });
  if(!found){
    users.push({email: email, password: np, role: email.includes('employer')||email.includes('@jobway.co.za')?'employer':'candidate'});
  }
  localStorage.setItem('jobway_users', JSON.stringify(users));
  localStorage.setItem('jobway_all_users', JSON.stringify(simpleUsers));
  if(token && resets[token]){
    delete resets[token];
    localStorage.setItem('jobway_password_resets', JSON.stringify(resets));
  }
  msgEl.innerText = '✅ Password updated! Redirecting to login...';
  msgEl.style.color = '#01F9C6';
  setTimeout(()=> location.href='login.html', 1500);
}
</script>
</body>
</html>
