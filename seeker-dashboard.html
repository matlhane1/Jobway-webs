<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Applications | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script>
(function(){
  const logged = localStorage.getItem('jobway_logged_in');
  const role = localStorage.getItem('user_role');
  if(!logged || role !== 'candidate'){
    location.href = 'login.html';
  }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{max-width:700px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);position:sticky;top:0;background:#0A1F2E;z-index:10}
.logo{font-family:'Space Grotesk';font-weight:800;color:#01F9C6;font-size:20px;cursor:pointer}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.container{max-width:700px;margin:0 auto;padding:16px}
.notice{background:rgba(1,249,198,0.08);border:1px solid rgba(1,249,198,0.15);border-radius:12px;padding:10px 14px;font-size:12px;color:#A8C8D0;text-align:center;margin-bottom:14px}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin-bottom:12px}
.status-bar{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.dot{width:100%;height:4px;background:#0F2230;border-radius:999px;margin:8px 0;overflow:hidden}
.dot-fill{height:100%;background:#01F9C6;transition:width 0.3s}
.pill{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.06);color:#A8C8D0;border:1px solid rgba(255,255,255,0.08)}
.pill.active{background:rgba(1,249,198,0.15);color:#01F9C6;border-color:rgba(1,249,198,0.25)}
.pill.done{background:#1A3E52;color:#8DB0BF}
.interview{background:#0F2230;border:1px solid rgba(1,249,198,0.18);border-radius:12px;padding:12px;margin-top:10px}
</style>
</head>
<body>
<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='jobs.html'">Find jobs</button>
<button class="btn btn-dark" onclick="location.href='profile.html'">My CV</button>
<button class="btn btn-green" onclick="logout()">Log out</button>
</div>
</div>

<div class="container">
<div class="notice">All applications free • Updates sent from <b style="color:#01F9C6">079 060 8952</b> on WhatsApp • <span id="email" style="font-size:11px"></span></div>
<div id="list"></div>
</div>

<script>
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Hired","Not Selected"];
function logout(){ localStorage.clear(); location.href='index.html'; }
function getApps(){return JSON.parse(localStorage.getItem('jobway_all_applications')||'[]')}
function progressFor(status){let i=STATUSES.indexOf(status); if(i<0) i=0; return ((i+1)/STATUSES.length)*100;}

function render(){
 let apps=getApps();
 document.getElementById('email').innerText = localStorage.getItem('jobway_user_email')||'';
 if(apps.length==0){
   document.getElementById('list').innerHTML=`<div class="card" style="text-align:center;padding:28px"><div style="font-size:18px;font-weight:800">No applications yet</div><div style="font-size:13px;color:#8DB0BF;margin:8px 0">When you apply for a job, it will show here. You can track status and interview details.</div><button class="btn btn-green" onclick="location.href='jobs.html'" style="margin-top:10px">Browse jobs</button></div>`;
   return;
 }
 document.getElementById('list').innerHTML=apps.map(a=>{
  let pct=progressFor(a.status||'Application Received');
  let isInterview = (a.status||'').includes('Interview');
  let interviewBox = a.interviewDate ? `<div class="interview"><div style="font-weight:800;color:#01F9C6;font-size:12px;margin-bottom:6px">INTERVIEW DETAILS</div><div style="font-size:13px">Date: ${a.interviewDate}</div><div style="font-size:13px">Time: ${a.interviewTime||'TBC'}</div><div style="font-size:13px">Format: ${a.interviewFormat||'In person'}</div></div>` : (isInterview ? `<div class="interview"><div style="font-size:13px">Employer will send interview time soon on WhatsApp from 079 060 8952</div></div>` : '');
  return `<div class="card">
    <div style="display:flex;justify-content:space-between;gap:10px"><div><b style="font-size:15px">${a.job_title}</b><div style="font-size:12px;color:#8DB0BF;margin-top:2px">${a.company} • Applied ${new Date(a.date).toLocaleDateString('en-ZA')}</div></div><span class="pill active">${a.status||'Received'}</span></div>
    <div class="dot"><div class="dot-fill" style="width:${pct}%"></div></div>
    <div class="status-bar">${STATUSES.map(s=>`<span class="pill ${a.status===s?'active':STATUSES.indexOf(a.status)>STATUSES.indexOf(s)?'done':''}">${s}</span>`).join('')}</div>
    ${interviewBox}
    <div style="margin-top:10px;display:flex;gap:8px"><button class="btn btn-dark" style="flex:1" onclick="location.href='jobs.html'">Find more jobs</button></div>
  </div>`;
 }).join('');
}
render();
setInterval(render,3000);
</script>
</body>
</html>
