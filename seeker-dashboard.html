<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Track Applications | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script>
// === POPIA - CANDIDATE ONLY - 100% SEPARATE ===
(function(){
  const logged = localStorage.getItem('jobway_logged_in');
  const role = localStorage.getItem('user_role');
  if(!logged || role!== 'candidate'){
    alert('⛔ Access denied: Candidate login required.');
    localStorage.clear();
    location.href = 'login.html';
  }
})();
</script>
<script>
// === NUCLEAR: DELETE PRICING FOR CANDIDATES FOREVER ===
(function(){
  const killPricing = () => {
    document.querySelectorAll('a[href*="pricing"], button[onclick*="pricing"], [id*="pricing"], [class*="pricing"]').forEach(el=>{
      // Keep employer dashboard safe - this file is candidate only, so delete everything with pricing
      if(el.textContent.toLowerCase().includes('pricing') || el.href?.includes('pricing')){
        el.remove();
      }
    });
  };
  document.addEventListener('DOMContentLoaded', killPricing);
  setInterval(killPricing, 500); // kills even if injected later
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh}
.header{background:#11283A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E3A4A;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:20px;display:flex;align-items:center;gap:8px}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-dark{background:#2A3F4E;color:white}
.btn-green{background:#01F9C6;color:#08231C}
.nav-cta{display:flex;flex-direction:row;gap:8px;align-items:center}
.container{max-width:600px;margin:0 auto;padding:16px}
.banner{background:linear-gradient(135deg,#01F9C6,#30BA8F);color:#08231C;border-radius:16px;padding:12px;font-weight:900;font-size:12px;text-align:center;margin-bottom:12px}
.banner span{display:block;font-size:16px;margin-top:2px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:20px;padding:18px;margin-bottom:14px}
.status-steps{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.step{padding:6px 10px;border-radius:20px;font-size:11px;font-weight:800;border:1px solid #25475A;color:#8DB0BF}
.step.active{background:#01F9C6;color:#08231C;border-color:#01F9C6;box-shadow:0 0 10px rgba(1,249,198,0.4)}
.step.done{background:#143E4A;color:#01F9C6}
.interview-box{background:#0F2230;border:1px solid #01F9C6;border-radius:16px;padding:14px;margin-top:12px}
.interview-box h4{color:#01F9C6;margin-bottom:8px}
.detail{font-size:13px;margin:4px 0;color:#E6F2F5}
.notif{background:rgba(1,249,198,0.1);border:1px solid rgba(1,249,198,0.2);border-radius:12px;padding:10px;margin-top:8px;font-size:12px}
.auto-badge{background:#01F9C6;color:#08231C;padding:3px 8px;border-radius:8px;font-size:10px;font-weight:900;margin-left:6px}
</style>
</head>
<body>
<div class="header">
<div class="logo">JobWay <span style="font-size:10px;background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:3px 8px;border-radius:999px">CANDIDATE ONLY</span></div>
<div class="nav-cta">
<button class="btn btn-dark" onclick="location.href='jobs.html'">💼 Jobs</button>
<button class="btn btn-green" onclick="logout()">Log Out</button>
</div>
</div>

<div class="container">
<div class="banner">📱 Official WhatsApp: <span>079 060 8952</span>AUTOMATIC alerts on every status + interview<br><small id="candEmail" style="font-size:11px;opacity:0.8"></small></div>
<div id="list"></div>
</div>

<script src="notifications.js"></script>
<script>
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Interview Completed","Assessment","Offer Made","Hired","Not Selected"];
const OFFICIAL_NUMBER="079 060 8952";
function logout(){ localStorage.clear(); location.href='index.html'; }
function getApps(){return JSON.parse(localStorage.getItem('jobway_all_applications')||'[]')}
function render(){
 let apps=getApps();
 document.getElementById('candEmail').innerText = '🔒 ' + (localStorage.getItem('jobway_user_email') || '');
 if(apps.length==0){
   document.getElementById('list').innerHTML=`<div class="card" style="text-align:center">No applications yet<br><small style="color:#8DB0BF">Apply for a job first — It's FREE</small><br><br><button class="btn btn-green" style="border-radius:999px" onclick="location.href='jobs.html'">Find Jobs</button></div>`;
   return;
 }
 document.getElementById('list').innerHTML=apps.map(a=>{
  let idx=STATUSES.indexOf(a.status||'Application Received');
  let steps=STATUSES.map((s,i)=>`<div class="step ${i==idx?'active':i<idx?'done':''}">${s}</div>`).join('');
  let interview = a.interviewDate ? `<div class="interview-box"><h4>📅 Interview Details <span class="auto-badge">AUTO SENT</span></h4><div class="detail">📅 Interview Date: ${a.interviewDate}</div><div class="detail">⏰ Interview Time: ${a.interviewTime}</div><div class="detail">📍 Format: ${a.interviewFormat}</div></div>`:'';
  return `<div class="card"><div style="display:flex;justify-content:space-between"><b>${a.job_title}</b><span style="color:#01F9C6;font-size:12px;font-weight:800">${a.status||'Under Review'}</span></div><div style="color:#8DB0BF;font-size:12px;margin:6px 0">${a.company} • Applied ${new Date(a.date).toLocaleDateString()}</div><div class="status-steps">${steps}</div>${interview}</div>`;
 }).join('');
}
render();
setInterval(render,2000);
</script>
</body>
</html>
