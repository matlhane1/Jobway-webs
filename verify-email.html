<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email — JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#0A1F2E;color:white;font-family:'Plus Jakarta Sans',sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{max-width:400px;width:100%;background:#1A3341;border:1px solid rgba(1,249,198,0.3);border-radius:22px;padding:26px;text-align:center}
input{width:100%;padding:14px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:#0f2332;color:white;font-size:20px;text-align:center;letter-spacing:8px;margin:16px 0}
button{width:100%;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer}
</style></head><body>
<div class="card">
<h2>Enter OTP Code</h2>
<p style="color:#8DB0BF;font-size:13px" id="msg">Code sent to <span id="em"></span></p>
<input id="otp" maxlength="6" placeholder="000000">
<button onclick="verify()">Verify & Create Account →</button>
<p style="font-size:11px;color:#8DB0BF;margin-top:12px" onclick="resend()" style="cursor:pointer">Resend code</p>
</div>
<script>
const SUPABASE_URL="https://bzbsqouohsylnhrsjhhy.supabase.co";
const SUPABASE_ANON="sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
const email = new URLSearchParams(location.search).get('email') || localStorage.getItem('jobway_otp_email');
document.getElementById('em').innerText=email;

async function verify(){
  const code=document.getElementById('otp').value.trim();
  const pending=JSON.parse(localStorage.getItem('jobway_pending_signup')||'null');
  if(!pending){alert('Session expired, signup again');location.href='signup.html';return;}

  // Check OTP from our table
  const {data} = await supabase.from('email_otps').select('*').eq('email', email).single();
  if(!data || data.otp!==code){alert('❌ Wrong code. Try again');return;}
  if(new Date(data.expires_at) < new Date()){alert('Code expired, resend');return;}

  // OTP CORRECT → CREATE ACCOUNT
  const {error} = await supabase.auth.signUp({
    email: pending.email,
    password: pending.password,
    options:{data:{full_name:pending.full_name, role:pending.role}}
  });
  if(error && !error.message.includes('already registered')){
    alert(error.message);return;
  }
  // Auto login
  const {error: loginErr} = await supabase.auth.signInWithPassword({email:pending.email, password:pending.password});
  if(loginErr){alert('Verified! Now login');location.href='login.html';return;}

  localStorage.setItem('jobway_user_email', pending.email);
  localStorage.setItem('user_role', pending.role==='employer'?'employer':'candidate');
  localStorage.removeItem('jobway_pending_signup');
  await supabase.from('email_otps').delete().eq('email', email);

  alert('✅ Verified! Account created');
  location.href='employer-dashboard.html';
}
async function resend(){
  const otp=Math.floor(100000+Math.random()*900000).toString();
  await supabase.from('email_otps').delete().eq('email', email);
  await supabase.from('email_otps').insert({email, otp, expires_at: new Date(Date.now()+10*60*1000).toISOString()});
  await supabase.auth.signInWithOtp({email});
  alert('New code sent! (Testing: '+otp+')');
}
</script></body></html>
