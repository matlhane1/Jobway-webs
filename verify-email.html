<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#06151d;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;display:flex;justify-content:center;padding:40px 20px}
.card{width:100%;max-width:420px;background:#0a202a;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:28px;text-align:center}
.otp{width:100%;height:56px;background:#06151d;border:1px solid rgba(255,255,255,.15);border-radius:12px;color:#fff;font-size:26px;letter-spacing:8px;text-align:center;margin:20px 0;outline:none}
.otp:focus{border-color:#01F9C6}.btn{width:100%;height:48px;border:none;border-radius:10px;background:#01F9C6;color:#06151d;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5}
.status{margin-top:12px;padding:10px;border-radius:8px;font-size:12px;display:none}.status.show{display:block}.status.error{background:rgba(255,70,70,.1);color:#ffb5b5}.status.ok{background:rgba(1,249,198,.08);color:#01F9C6}
</style>
</head>
<body>
<div class="card">
<h2 style="font-family:'Space Grotesk'">Check your email</h2>
<p id="emailDisplay" style="color:#01F9C6;margin:8px 0;font-size:13px">loading...</p>
<input id="otp" class="otp" maxlength="6" placeholder="••••••" inputmode="numeric">
<button id="verifyBtn" class="btn">Verify Email →</button>
<div id="status" class="status"></div>
<p style="margin-top:14px"><a href="signup.html" style="color:#8FB3C1;font-size:12px">← Change email</a></p>
</div>
<script>
const supabaseClient = supabase.createClient("https://bzbsqouohsylnhrsjhhy.supabase.co","sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2");
function showStatus(m,t){const s=document.getElementById("status");s.textContent=m;s.className="status show "+t;}
const params=new URLSearchParams(location.search);
const email=params.get("email")||localStorage.getItem("jobway_signup_email")||"";
document.getElementById("emailDisplay").textContent=email||"Email not found";
document.getElementById("verifyBtn").addEventListener("click",async()=>{
 let code=document.getElementById("otp").value.replace(/\s/g,"").trim();
 if(!/^\d{6}$/.test(code)){showStatus("Enter 6-digit code","error");return;}
 const btn=document.getElementById("verifyBtn");btn.disabled=true;btn.textContent="Verifying...";
 try{
  const {error}=await supabaseClient.auth.verifyOtp({email,token:code,type:"signup"});
  if(error) throw error;
  showStatus("Verified! Redirecting...","ok");
  setTimeout(()=>{location.href="candidate-dashboard.html";},800);
 }catch(err){showStatus(err.message,"error");btn.disabled=false;btn.textContent="Verify Email →";}
});
</script>
</body>
</html>
