<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify — JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#0A1F2E;color:white;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{max-width:400px;width:100%;background:#1A3341;border:2px solid #01F9C6;border-radius:22px;padding:26px;text-align:center}
input{width:100%;padding:16px;border-radius:12px;background:#0f2332;color:white;font-size:24px;text-align:center;letter-spacing:6px;margin:16px 0;border:1px solid #01F9C6}
button{width:100%;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;font-size:16px;cursor:pointer}
</style></head><body>
<div class="card">
<h2>Enter OTP Code</h2>
<p style="color:#8DB0BF">Code sent to <b id="em" style="color:#01F9C6"></b></p>
<div style="background:#0f2332;padding:10px;border-radius:8px;margin:10px 0">Your Code: <b id="showCode" style="color:#01F9C6;font-size:18px"></b></div>
<input id="otp" maxlength="6" placeholder="000000" type="tel">
<button onclick="verify()">Verify & Create Account →</button>
<p id="msg" style="color:#FF9B9B;font-size:13px;margin-top:12px"></p>
<p style="font-size:11px;color:#8DB0BF;margin-top:12px;cursor:pointer" onclick="resend()">Resend code</p>
</div>
<script>
const supabase = window.supabase.createClient("https://bzbsqouohsylnhrsjhhy.supabase.co","sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2");
const email = localStorage.getItem('jobway_otp_email') || new URLSearchParams(location.search).get('email');
const savedCode = localStorage.getItem('jobway_otp_code') || new URLSearchParams(location.search).get('code');
document.getElementById('em').innerText = email || '';
document.getElementById('showCode').innerText = savedCode || 'check alert';
document.getElementById('otp').value = savedCode || '781129';

async function verify(){
  const input = document.getElementById('otp').value.trim();
  const realCode = localStorage.getItem('jobway_otp_code');
  const msg = document.getElementById('msg');
  if(input !== realCode){ msg.innerText = '❌ Wrong code. Correct is: '+realCode; return; }
  
  const pending = JSON.parse(localStorage.getItem('jobway_pending_signup'));
  msg.innerText = '✅ Correct! Creating account...';
  
  try{
    const {data, error} = await supabase.auth.signUp({
      email: pending.email,
      password: pending.password,
      options:{data:{full_name: pending.full_name, role: pending.role}}
    });
    if(error && !error.message.includes('already')) throw error;
    
    await supabase.auth.signInWithPassword({email: pending.email, password: pending.password});
    localStorage.setItem('jobway_user_email', pending.email);
    localStorage.setItem('user_role', pending.role);
    msg.innerText = '✅ Success! Logging in...';
    setTimeout(()=>location.href='login.html',1200);
  }catch(e){
    msg.innerText = 'Error: '+e.message;
  }
}
function resend(){
  const newCode = Math.floor(100000+Math.random()*900000).toString();
  localStorage.setItem('jobway_otp_code', newCode);
  document.getElementById('showCode').innerText = newCode;
  document.getElementById('otp').value = newCode;
  alert('New code: '+newCode);
}
</script></body></html>
