VERIFY YOUR EMAIL
 Check your email
 We've sent a 6-digit verification code to the email address below. Enter the code to finish creating your JobWay account. 
<div class="email-box">
  Verification code sent to
  <strong id="emailDisplay">Loading...</strong>
</div>


<label class="otp-label" for="otp">
  Enter 6-digit verification code
</label>

<input
  id="otp"
  class="otp"
  type="text"
  inputmode="numeric"
  autocomplete="one-time-code"
  maxlength="6"
  placeholder="••••••"
  aria-label="6-digit verification code"
>


<button
  class="verify-btn"
  id="verifyBtn"
  type="button">
  Verify Email →
</button>


<div class="timer" id="timer">
  Code expires in
  <strong id="countdown">10:00</strong>
</div>


<button
  class="resend"
  id="resendBtn"
  type="button"
  disabled>
  Resend verification code
</button>


<div
  id="status"
  class="status">
</div>


<a
  href="signup.html"
  class="change-email">
  ← Change email / start again
</a>
