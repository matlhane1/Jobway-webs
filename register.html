<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>JobWay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11283a;font-family:Arial;padding:20px}.card{background:#1e3a4f;border-radius:20px;padding:24px;width:100%;max-width:380px}h1{color:white;text-align:center;font-size:26px}label{color:#9cc2d0;display:block;margin:10px 0 5px}input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #334;box-sizing:border-box;background:#0f2332;color:white}.pw{position:relative}.eye{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#ffffff1a;border:none;border-radius:6px;padding:5px 8px;color:#9cc2d0;font-size:11px;font-weight:700;cursor:pointer}button{width:100%;padding:13px;border-radius:12px;border:none;font-weight:900;margin-top:18px;cursor:pointer;background:white}</style></head><body>
<div class="card"><h1>Create JobWay Account</h1>
<label>Full Name</label><input id="fn">
<label>Email</label><input id="em" type="email">
<label>Password</label><div class="pw"><input id="pw" type="password"><button class="eye" onclick="const i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'SHOW':'HIDE'">SHOW</button></div>
<label>I want to join as:</label><select id="role"><option value="seeker">Job Seeker</option><option value="employer">Employer</option></select>
<button id="btn">Register</button></div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
document.getElementById('btn').onclick=async()=>{
const full_name=document.getElementById('fn').value.trim();
const email=document.getElementById('em').value.trim();
const password=document.getElementById('pw').value;
const role=document.getElementById('role').value;
if(!full_name||!email||!password){alert('Fill all');return;}
const b=document.getElementById('btn');b.textContent='Creating...';b.disabled=true;
try{
const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name,role}}});
if(error) throw error;
alert('Success! Now login');location.href='login.html?v=37';
}catch(e){alert('Error: '+e.message);b.textContent='Register';b.disabled=false;}
};
</script></body></html>
