<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Create Account</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11283a;font-family:Inter,sans-serif;padding:20px}
.card{background:linear-gradient(180deg,#1e3a4f,#152c3f);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:28px 24px;width:100%;max-width:400px}
h1{color:white;text-align:center;font-size:28px;font-weight:900;margin:0 0 20px}
label{color:#9cc2d0;font-size:14px;margin:12px 0 6px;display:block}
input,select{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:#0f2332;color:white;outline:none;box-sizing:border-box}
.pw-wrap{position:relative} .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:rgba(255,255,255,0.1);border:none;border-radius:8px;padding:6px 9px;color:#9cc2d0;font-weight:700;cursor:pointer}
.reg-btn{width:100%;margin-top:20px;background:white;color:#11283a;border:none;padding:14px;border-radius:14px;font-weight:900;cursor:pointer}
</style></head><body>
<div class="card">
<h1>Create JobWay<br>Account</h1>
<label>Full Name</label><input id="fullName">
<label>Email</label><input id="email" type="email">
<label>Password</label>
<div class="pw-wrap"><input id="password" type="password"><button class="eye" onclick="const i=document.getElementById('password');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'SHOW':'HIDE'">SHOW</button></div>
<label>I want to join as:</label><select id="role"><option value="seeker">Job Seeker</option><option value="employer">Employer</option></select>
<button class="reg-btn" id="registerBtn">Register</button>
</div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
document.getElementById('registerBtn').addEventListener('click',async()=>{
try{
const fn=document.getElementById('fullName').value.trim();
const em=document.getElementById('email').value.trim();
const pw=document.getElementById('password').value;
if(!fn||!em||!pw){alert("Fill all fields");return;}
const b=document.getElementById('registerBtn');b.textContent="Creating...";b.disabled=true;
const {data,error}=await supabaseClient.auth.signUp({email:em,password:pw,options:{data:{full_name:fn,role:document.getElementById('role').value}}});
if(error) throw error;
alert("Success! Now login");location.href="login.html?v=35";
}catch(e){alert("Error: "+e.message);document.getElementById('registerBtn').textContent="Register";document.getElementById('registerBtn').disabled=false;}
});
</script></body></html>
