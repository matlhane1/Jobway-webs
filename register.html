<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobWay - Register</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: Arial, sans-serif; background: linear-gradient(180deg, #0d233a 0%, #1a365d 100%); color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); padding: 30px; border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        h2 { text-align: center; margin-bottom: 24px; }
        .input-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; opacity: 0.9; }
        input, select { width: 100%; padding: 12px; border: 1px solid #20576E; border-radius: 8px; background: white; color: #20576E; font-size: 16px; }
        input:focus, select:focus { border-color: #01F9C6; outline: none; box-shadow: 0 0 0 3px rgba(1,249,198,0.3); }
        .btn { width: 100%; padding: 14px; background: #20576E; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn:hover { background: #30BA8F; }
        .btn:disabled { opacity: 0.7; cursor: not-allowed; }
        .toggle-field { display: none; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
    <div class="form-container">
        <h2>Create JobWay Account</h2>
        <form id="registerForm">
            <div class="input-group"><label for="fullName">Full Name</label><input type="text" id="fullName" required placeholder="John Doe"></div>
            <div class="input-group"><label for="email">Email</label><input type="email" id="email" required placeholder="name@example.com"></div>
            <div class="input-group"><label for="password">Password</label><input type="password" id="password" required minlength="6" placeholder="••••••••"></div>
            <div class="input-group"><label for="userRole">I want to join as:</label><select id="userRole" required><option value="job_seeker">Job Seeker</option><option value="employer">Employer</option></select></div>
            <div class="input-group toggle-field" id="companyGroup"><label for="companyName">Company Name</label><input type="text" id="companyName" placeholder="Your Company Ltd"></div>
            <button type="submit" id="btnSubmit" class="btn">Register</button>
        </form>
    </div>
    <script>
        const SUPABASE_URL = "https://dmxumcjeetphwzvgzzuk.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const userRole = document.getElementById("userRole");
        const companyGroup = document.getElementById("companyGroup");
        const companyName = document.getElementById("companyName");
        userRole.addEventListener("change", function () {
            if (userRole.value === "employer") {
                companyGroup.style.display = "block";
                companyName.required = true;
            } else {
                companyGroup.style.display = "none";
                companyName.required = false;
                companyName.value = "";
            }
        });

        const registerForm = document.getElementById("registerForm");
        const submitButton = document.getElementById("btnSubmit");
        registerForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            const fullName = document.getElementById("fullName").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const role = userRole.value;
            const company = companyName.value.trim();
            submitButton.disabled = true;
            submitButton.textContent = "Creating...";
            try {
                const { data, error } = await supabaseClient.auth.signUp({
                    email: email,
                    password: password,
                    options: { data: { full_name: fullName, role: role, company_name: role === "employer" ? company : null } }
                });
                if (error) throw error;
                console.log("Account created:", data);
                alert("Account created successfully! Check your email to confirm.");
                window.location.href = "login.html";
            } catch (error) {
                console.error("Registration error:", error);
                let errorMessage = "Registration failed. Please try again.";
                if (error && error.message) errorMessage = error.message;
                alert("Error: " + errorMessage);
                submitButton.disabled = false;
                submitButton.textContent = "Register";
            }
        });
    </script>
</body>
</html>
