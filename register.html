<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Create Account</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11283a;font-family:Inter,Arial,sans-serif;padding:20px}
.card{background:linear-gradient(180deg,#1e3a4f,#152c3f);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:26px 22px;width:100%;max-width:380px}
h1{color:white;text-align:center;font-size:26px;font-weight:900;margin:0 0 18px}
label{color:#9cc2d0;font-size:13px;margin:12px 0 6px;display:block}
input,select{width:100%;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,0.12);background:#0f2332;color:white;font-size:15px;outline:none;box-sizing:border-box}
.wrap{position:relative}
.wrap input{padding-right:70px}
.eye{position:absolute;right:6px;top:6px;bottom:6px;width:58px;border:none;border-radius:9px;background:rgba(255,255,255,0.12);color:#cfe8ef;font-weight:800;font-size:11px;cursor:pointer}
.btn{width:100%;margin-top:18px;background:white;color:#11283a;border:none;padding:13px;border-radius:12px;font-weight:900;font-size:15px;cursor:pointer}
</style></head><body>
<div class="card">
<h1>Create JobWay Account</h1>
<label>Full Name</label><input id="fn" placeholder="Your name">
<label>Email</label><input id="em" type="email" placeholder="you@email.com">
<label>Password</label>
<div class="wrap">
<input id="pw" type="password" placeholder="Create password">
<button class="eye" type="button" onclick="let i=document.getElementById('pw');i.type=i.type==='password'?'text':'password';this.textContent=i.type==='password'?'SHOW':'HIDE'">SHOW</button>
</div>
<label>I want to join as:</label>
<select id="role"><option value="seeker">Job Seeker</option><option value="employer">Employer</option></select>
<button class="btn" id="btn">Register</button>
</div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
document.getElementById('btn').onclick=async()=>{
const full_name=document.getElementById('fn').value.trim();
const email=document.getElementById('em').value.trim();
const password=document.getElementById('pw').value;
if(!full_name||!email||!password){alert('Fill all fields');return;}
const b=document.getElementById('btn');b.textContent='Creating...';b.disabled=true;
try{
const {error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name,role:document.getElementById('role').value}}});
if(error) throw error;
alert('Account created! Now login');location.href='login.html?v=38';
}catch(e){alert('Error: '+e.message);b.textContent='Register';b.disabled=false;}
};
</script></body></html>
