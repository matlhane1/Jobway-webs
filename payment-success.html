<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success | JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0F2230;color:white;font-family:'Plus Jakarta Sans',sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{max-width:460px;width:100%;background:#1A3341;border:1px solid rgba(1,249,198,0.3);border-radius:22px;padding:26px;text-align:center}</style>
</head><body>
<div class="card">
<div style="width:60px;height:60px;background:#01F9C6;border-radius:999px;display:grid;place-items:center;margin:0 auto 14px;font-size:30px">✓</div>
<h2 style="font-family:'Space Grotesk';font-size:24px" id="title">Verifying Payment...</h2>
<p style="color:#8DB0BF;font-size:13px;margin:10px 0" id="msg">Checking PayFast secure server (ITN)...</p>
<div id="details" style="background:#0F2230;border-radius:12px;padding:12px;font-size:11px;color:#8DB0BF;margin:12px 0;text-align:left"></div>
<button id="btn" style="width:100%;margin-top:14px;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;display:none" onclick="location.href='employer-dashboard.html'">Go to Dashboard →</button>
</div>
<script>
const SUPABASE_URL="https://bzbsqouohsylnhrsjhhy.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
(async()=>{
  let pending = JSON.parse(localStorage.getItem('jobway_pending_payment')||'null');
  let email = (pending?.email || localStorage.getItem('jobway_user_email') || "").toLowerCase();
  document.getElementById('details').innerHTML=`Email: ${email}<br>Item: ${pending?.item||''}<br>Amount: R${pending?.amount||''}<br>Status: Waiting for ITN...`;
  if(!email){ document.getElementById('title').innerText="Payment Received"; document.getElementById('msg').innerText="Login with employer email to see credits"; document.getElementById('btn').style.display="block"; return; }
  let tries=0;
  let iv=setInterval(async()=>{
    tries++; let {data} = await supabase.from('employer_credits').select('*').eq('email', email).single();
    if(data && data.paid){
      clearInterval(iv); document.getElementById('title').innerText="Payment Successful!";
      document.getElementById('msg').innerHTML=`✅ ${data.job_credits} Job Credits + ${data.cv_credits} CV Credits unlocked<br>Post Job now unlocked`;
      document.getElementById('details').innerHTML+=`<br><b style="color:#01F9C6">Verified by PayFast ITN — Secure</b>`;
      document.getElementById('btn').style.display="block"; localStorage.removeItem('jobway_pending_payment');
      setTimeout(()=>location.href='employer-dashboard.html',1200);
    } else if(tries>30){
      clearInterval(iv); document.getElementById('title').innerText="Processing..."; document.getElementById('msg').innerText="Still verifying (1-2 mins). Check dashboard shortly. WhatsApp 079 060 8952"; document.getElementById('btn').style.display="block";
    }
  },2000);
})();
</script>
</body></html>
