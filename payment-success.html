<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Success | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Space+Grotesk:wght@800&display=swap" rel="stylesheet">
<style>body{margin:0;background:#0F2230;color:white;font-family:'Plus Jakarta Sans',sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{max-width:420px;width:100%;background:#1A3341;border:1px solid rgba(1,249,198,0.3);border-radius:22px;padding:26px;text-align:center}</style>
</head><body>
<div class="card">
<div style="width:60px;height:60px;background:#01F9C6;border-radius:999px;display:grid;place-items:center;margin:0 auto 14px;font-size:30px">✓</div>
<h2 style="font-family:'Space Grotesk';font-size:24px">Payment Successful!</h2>
<p style="color:#8DB0BF;font-size:13px;margin:10px 0" id="msg">Unlocking your Employer Dashboard...</p>
<button style="width:100%;margin-top:14px;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900" onclick="goDash()">Go to Employer Dashboard →</button>
</div>
<script>
(function(){
  let pending = JSON.parse(localStorage.getItem('jobway_pending_payment')||'null');
  let email = (pending && pending.email) || localStorage.getItem('jobway_user_email') || '';
  let item = (pending && pending.item) || '';
  let amount = (pending && pending.amount) || '';

  // Calculate credits based on what they bought
  let credits = 1;
  if(item.toLowerCase().includes('single')) credits=1;
  else if(item.toLowerCase().includes('5 posts')||item.includes('Starter')) credits=5;
  else if(item.toLowerCase().includes('15 posts')||item.includes('Growth')) credits=15;
  else if(item.toLowerCase().includes('30 posts')||item.includes('Pro')) credits=30;
  else if(item.toLowerCase().includes('70 posts')||item.includes('Business')) credits=70;
  else if(item.includes('50') && item.toLowerCase().includes('credit')) credits=50;
  else if(item.includes('100')) credits=100;
  else if(item.includes('150')) credits=150;
  else if(item.includes('200')) credits=200;
  else if(item.includes('250')) credits=250;
  else if(item.toLowerCase().includes('cv')) credits=0; // CV unlocks separate

  // UNLOCK
  if(email){
    localStorage.setItem('employer_paid_'+email, 'true');
    localStorage.setItem('jobway_paid', 'true');
    let cur = parseInt(localStorage.getItem('employer_credits_'+email)||'0');
    localStorage.setItem('employer_credits_'+email, String(cur+credits));
    localStorage.setItem('employer_credits', String(cur+credits));
    if(item.toLowerCase().includes('cv')){
      let cvCur = parseInt(localStorage.getItem('employer_cv_credits_'+email)||'0');
      localStorage.setItem('employer_cv_credits_'+email, String(cvCur+credits||10));
    }
  }
  localStorage.setItem('jobway_last_payment', JSON.stringify({email,item,amount,credits,date:new Date().toISOString()}));
  localStorage.removeItem('jobway_pending_payment');

  document.getElementById('msg').innerHTML = `✅ ${item} — ${amount}<br><br>Email: ${email}<br>Credits added: ${credits}<br><br>Your Post Job page from screenshot is now unlocked.`;

  window.goDash = ()=>{ location.href='employer-dashboard.html'; }
  setTimeout(()=>{ location.href='employer-dashboard.html'; }, 2500);
})();
</script>
</body></html>
