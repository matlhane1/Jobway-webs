<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script>
(function(){
  const logged = localStorage.getItem('jobway_logged_in');
  const role = localStorage.getItem('user_role');
  if(!logged || role !== 'employer'){ location.href='login.html'; }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:18px;font-family:'Space Grotesk',sans-serif;cursor:pointer}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.container{max-width:720px;margin:0 auto;padding:16px}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px;margin-bottom:14px}
.meta{color:#8DB0BF;font-size:12px;margin:6px 0;line-height:1.5}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.b-green{background:#01F9C6;color:#0A1F2E}
.b-grey{background:rgba(255,255,255,0.1);color:#A8C8D0}
.select{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:12px;border-radius:10px;margin-top:8px;font-size:13px}
.stat{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-family:'Space Grotesk'}
.stat span{font-size:11px;color:#8DB0BF}
</style>
</head>
<body>

<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay • Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='post-job.html'">+ Post Job</button>
<button class="btn btn-dark" onclick="location.href='jobs.html'">View jobs</button>
<button class="btn btn-dark" onclick="logout()">Log out</button>
</div>
</div>

<div class="container">
<h3 style="font-family:'Space Grotesk';font-size:18px;margin:10px 0">Dashboard <span id="count" style="color:#01F9C6;font-size:14px"></span></h3>

<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
<div class="stat"><b id="jobCount">0</b><span>My Jobs</span></div>
<div class="stat"><b id="appCount">0</b><span>Applications</span></div>
</div>

<h4 style="margin:16px 0 10px;font-size:14px">Applicants — People who applied to your jobs</h4>
<div id="list"></div>
<div id="empty" style="display:none;text-align:center;padding:30px;color:#8DB0BF">No applications yet. Share your job link to get applicants.</div>

<h4 style="margin:20px 0 10px;font-size:14px">My Posted Jobs</h4>
<div id="jobsList"></div>
</div>

<script>
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Hired","Not Selected"];
function logout(){ localStorage.removeItem('jobway_logged_in'); localStorage.removeItem('user_role'); location.href='index.html'; }

function fmt(d){ try{ if(!d) return ''; return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}) }catch(e){ return d||'' } }

function getApps(){
  let a1 = JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');
  let a2 = JSON.parse(localStorage.getItem('jobway_applied')||'[]');
  return a1.length ? a1 : a2;
}
function saveApps(a){ localStorage.setItem('jobway_all_applications', JSON.stringify(a)); localStorage.setItem('jobway_applied', JSON.stringify(a)); }
function getJobs(){ return JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]') }

function load(){
  let apps = getApps();
  let jobs = getJobs();
  document.getElementById('appCount').innerText = apps.length;
  document.getElementById('jobCount').innerText = jobs.length;
  document.getElementById('count').innerText = `(${apps.length} applicants)`;

  if(!apps.length){ document.getElementById('empty').style.display='block'; document.getElementById('list').innerHTML=''; }
  else{
    document.getElementById('empty').style.display='none';
    document.getElementById('list').innerHTML = apps.map((a,i)=>{
      let name = a.name || a.fullName || 'Applicant';
      let title = a.job_title || a.title || 'Job';
      let cvInfo = a.hasCV || a.cvName ? `CV: ${a.cvName||'Attached'} • ` : 'No CV • ';
      let cvBtn = a.cvData ? `<button class="btn btn-green" style="padding:8px 12px;font-size:11px" onclick="downloadCV(${i})">Download CV</button>` : '';
      return `<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><b>${name}</b><span class="badge ${a.status=='Shortlisted'?'b-green':'b-grey'}">${a.status||'Application Received'}</span></div>
        <div class="meta">Applied for: <b style="color:#fff">${title} — ${a.company||''}</b></div>
        <div class="meta">Date: ${fmt(a.date)} • ${a.email||''} • ${a.whatsapp||''}<br>${cvInfo} ${a.cvSize||''}</div>
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-green" onclick="updateStatus(${i},'Shortlisted')">Shortlist</button>
          <button class="btn btn-dark" onclick="updateStatus(${i},'Approved')">Approve</button>
          <button class="btn btn-dark" style="background:#3a1a1a;color:#ff9a9a" onclick="updateStatus(${i},'Rejected')">Reject</button>
          ${cvBtn}
        </div>
        <select class="select" onchange="updateStatus(${i},this.value)">${STATUSES.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`;
    }).join('');
  }

  document.getElementById('jobsList').innerHTML = jobs.length ? jobs.map(j=>`
    <div class="card"><b>${j.title} • ${j.company}</b><br><span style="color:#8DB0BF;font-size:12px">${j.location||j.city||''} • ${j.salaryText||j.salary||''} • Closing: ${fmt(j.closing_date)||j.closingDate||''}</span></div>`).join('') : `<div class="card" style="text-align:center;color:#8DB0BF;font-size:13px">No jobs yet. Click + Post Job.</div>`;
}

function updateStatus(i, newStatus){
  let apps = getApps();
  apps[i].status = newStatus;
  saveApps(apps);
  alert(`Applicant ${newStatus}`);
  load();
}
function downloadCV(i){
  let app = getApps()[i];
  if(!app?.cvData){ alert('No CV data'); return; }
  let a=document.createElement('a'); a.href=app.cvData; a.download=app.cvName||'CV.pdf'; a.click();
}
load();
setInterval(load, 2000);
</script>
</body>
</html>
