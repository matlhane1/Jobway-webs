<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Employer Dashboard | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;gap:10px}
.logo{font-weight:900;color:#01F9C6;font-size:18px;font-family:'Space Grotesk',sans-serif;cursor:pointer;white-space:nowrap}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px;font-family:inherit}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.btn-whats{background:#25D366;color:#fff}
.btn-cv{background:#01F9C6;color:#0A1F2E;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;border:0}
.container{max-width:900px;margin:0 auto;padding:16px}
.card{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:14px;overflow-wrap:anywhere}
.meta{color:#8DB0BF;font-size:12px;margin:6px 0;line-height:1.8}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.b-green{background:#01F9C6;color:#0A1F2E}
.b-grey{background:rgba(255,255,255,.1);color:#A8C8D0}
.b-orange{background:#FFB020;color:#000}
.b-red{background:#3a1a1a;color:#ff9a9a}
.select,.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:12px;border-radius:10px;margin-top:8px;font-size:13px;font-family:inherit}
.stat{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-family:'Space Grotesk'}
.stat span{font-size:11px;color:#8DB0BF}
.progress{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.p-badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
.p-done{background:rgba(1,249,198,.15);color:#01F9C6}
.p-active{background:#01F9C6;color:#0A1F2E}
.p-pending{background:rgba(255,255,255,.08);color:#8DB0BF;border:1px solid #2a4a5c}
.interview-box{background:#0F2230;border:1px solid rgba(1,249,198,.25);border-radius:14px;padding:14px;margin-top:12px;font-size:13px;line-height:1.8}
.label{font-size:11px;color:#8DB0BF;font-weight:700;margin-top:10px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.modal-card{background:#11283A;width:100%;max-width:500px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
.message{padding:14px;border-radius:12px;background:#11283A;color:#8DB0BF;font-size:13px;margin-bottom:12px}
.message.error{color:#ff9a9a;border:1px solid #6b3030}
.message.success{color:#01F9C6}
.loading{text-align:center;padding:25px;color:#8DB0BF;font-size:13px}
.empty{text-align:center;padding:30px;color:#8DB0BF;font-size:13px}
@media(max-width:600px){.header{align-items:flex-start;flex-direction:column}.header-actions{width:100%;justify-content:flex-start}.header-actions .btn{font-size:11px;padding:9px 12px}.container{padding:12px}.card{padding:14px}}
</style>
</head>
<body>
<div class="header">
<div class="logo" id="homeBtn">JobWay • Employer</div>
<div class="header-actions">
<button class="btn btn-dark" id="postJobBtn">+ Post Job</button>
<button class="btn btn-dark" id="viewJobsBtn">View Jobs</button>
<button class="btn btn-dark" id="logoutBtn">Log Out</button>
</div>
</div>
<div class="container">
<h3 style="font-family:'Space Grotesk';font-size:18px;margin:10px 0">Dashboard <span id="count" style="color:#01F9C6;font-size:14px"></span></h3>
<div id="dashboardMessage"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
<div class="stat"><b id="jobCount">0</b><span>My Jobs</span></div>
<div class="stat"><b id="appCount">0</b><span>Applications</span></div>
</div>
<h4 style="margin:16px 0 10px;font-size:14px">Applicants — People who applied to your jobs</h4>
<div id="list"><div class="loading">Loading applications...</div></div>
<div id="empty" class="empty" style="display:none">No applications yet. Share your job link to get applicants.</div>
<h4 style="margin:20px 0 10px;font-size:14px">My Posted Jobs</h4>
<div id="jobsList"></div>
</div>
<div class="modal" id="interviewModal">
<div class="modal-card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>📅 Schedule Interview</h3><button class="btn btn-dark" id="closeInterviewBtn">✕</button></div>
<p id="interviewFor" style="color:#8DB0BF;font-size:13px;margin:8px 0"></p>
<label class="label">INTERVIEW DATE</label><input type="date" id="intDate" class="input">
<label class="label">TIME</label><input type="time" id="intTime" class="input" value="09:00">
<label class="label">LOCATION / LINK</label><input id="intLoc" class="input" placeholder="Office address or online meeting link" value="Thohoyandou Office">
<label class="label">MESSAGE TO CANDIDATE</label><input id="intMsg" class="input" placeholder="Bring ID, CV...">
<button class="btn btn-green" id="confirmInterviewBtn" style="width:100%;padding:14px;margin-top:14px">Confirm & Send WhatsApp →</button>
</div>
</div>
<script>
const SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES = ['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired','Not Selected'];
let currentInterviewId = null;
let currentApps = [];
let currentJobs = [];
let loadingDashboard = false;
let realtimeChannel = null;
function esc(value){ return String(value ?? '').replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
document.getElementById('homeBtn').addEventListener('click',()=>{ location.href='index.html'; });
document.getElementById('postJobBtn').addEventListener('click',()=>{ location.href='post-job.html'; });
document.getElementById('viewJobsBtn').addEventListener('click',()=>{ location.href='jobs.html'; });
document.getElementById('logoutBtn').addEventListener('click',logout);
function logout(){ localStorage.removeItem('jobway_logged_in'); localStorage.removeItem('user_role'); localStorage.removeItem('jobway_user'); try{ localStorage.removeItem('user'); }catch(e){} location.href='index.html'; }
function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('jobway_user') || localStorage.getItem('user') || 'null'); }catch(e){ return null; } }
function fmt(d){ if(!d) return ''; try{ return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}); }catch(e){ return String(d); } }
function formatPhone(p){ if(!p) return ''; let c=String(p).replace(/[^0-9]/g,''); if(c.startsWith('0')) c='27'+c.slice(1); return c; }
function showMessage(message,type=''){ const el=document.getElementById('dashboardMessage'); el.innerHTML=message ? `<div class="message ${esc(type)}">${esc(message)}</div>` : ''; }
function cleanCvPath(raw){
  if(!raw) return null;
  raw=String(raw).trim();
  if(!raw) return null;
  try{
    if(/^https?:\/\//i.test(raw)){
      const url=new URL(raw);
      const markers=['/storage/v1/object/public/cvs/','/storage/v1/object/sign/cvs/','/storage/v1/object/authenticated/cvs/','/cvs/'];
      for(const marker of markers){ const index=url.pathname.indexOf(marker); if(index!==-1){ return decodeURIComponent(url.pathname.substring(index+marker.length)).replace(/^\/+/,''); } }
      return decodeURIComponent(url.pathname.split('/').pop());
    }
  }catch(e){ console.warn('CV path parsing:',e); }
  return decodeURIComponent(raw).replace(/^cvs\//,'').replace(/^\/+/,'').split('?')[0].trim();
}
function getCvPath(a){ return cleanCvPath(a._cv_path || a.cv_path || a.cv_url || a.profiles?.cv_path || a.profiles?.cv_url || ''); }
function getCvName(a){
  if(a._cv_name) return a._cv_name;
  if(a.profiles?.cv_name) return a.profiles.cv_name;
  if(a.cv_name) return a.cv_name;
  let p=getCvPath(a);
  if(!p) return 'CV';
  return decodeURIComponent(p.split('/').pop());
}
async function openSecureCV(cvPath,appId,btn){
  const clean=cleanCvPath(cvPath);
  if(!clean){ alert('No CV found for this candidate.'); return; }
  const original=btn ? btn.innerHTML : '';
  if(btn){ btn.disabled=true; btn.innerHTML='⏳ Creating secure link...'; }
  try{
    const {data,error}=await supabaseClient.storage.from('cvs').createSignedUrl(clean,3600);
    if(error) throw error;
    if(!data?.signedUrl) throw new Error('No signed URL returned.');
    try{
      const user=getCurrentUser();
      const {error:logError}=await supabaseClient.from('cv_access_log').insert([{application_id:appId,cv_path:clean,accessed_by:user?.id || null}]);
      if(logError) console.warn('CV access log failed:',logError.message);
    }catch(logErr){ console.warn('CV logging unavailable:',logErr); }
    const opened=window.open(data.signedUrl,'_blank');
    if(!opened) alert('Your browser blocked the CV window. Please allow popups for JobWay.');
    if(btn) btn.innerHTML='✅ CV link created';
  }catch(e){
    console.error('CV error:',e);
    alert('Could not open CV: '+e.message+'\n\nCheck that the CV exists in the private cvs bucket and that your Supabase Storage policies authorize this employer.');
    if(btn) btn.innerHTML='❌ Try again';
  }finally{
    if(btn) setTimeout(()=>{ btn.disabled=false; btn.innerHTML=original; },3000);
  }
}
function progressHTML(status){
  const steps=['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired'];
  if(status==='Not Selected'){ return `<div class="progress"><span class="p-badge" style="background:#3a1a1a;color:#ff9a9a">❌ Not Selected</span></div>`; }
  let idx=steps.indexOf(status);
  if(idx===-1) idx=0;
  return `<div class="progress">${steps.map((s,i)=>{ let cls=i<idx?'p-done':i===idx?'p-active':'p-pending'; let icon=i<idx?'✅':i===idx?'👁️':''; return `<span class="p-badge ${cls}">${icon} ${esc(s)}</span>`; }).join('')}</div>`;
}
function buildWhatsAppMessage(app,newStatus){
  const phone=formatPhone(app.profiles?.phone || app.phone || app._phone || '');
  const jobTitle=app.jobs?.title || 'Job';
  const company=app.jobs?.company || 'JobWay';
  const name=app.profiles?.full_name || app._full_name || 'Applicant';
  let msg='';
  if(newStatus==='Shortlisted'){ msg=`Hi ${name} 👋 Great news!\n\nYou have been SHORTLISTED for ${jobTitle} at ${company} on JobWay.\n\nWe will contact you regarding the next steps.\n\nTrack your application:\nhttps://jobway.co.za/track-applications.html`; }
  else if(newStatus==='Interview Scheduled'){ msg=`Hi ${name} 📅\n\nYour interview for ${jobTitle} at ${company} has been scheduled.\n\nDate: ${app.interview_date || ''}\nTime: ${app.interview_time || ''}\nLocation: ${app.interview_location || ''}\n\nNote: ${app.interview_note || 'Bring your ID and CV.'}\n\nPlease reply YES to confirm.\n\n- ${company} via JobWay`; }
  else if(newStatus==='Hired'){ msg=`Hi ${name} 🎉\n\nCongratulations!\n\nYou have been HIRED for ${jobTitle} at ${company}.\n\nThank you for using JobWay.`; }
  else if(newStatus==='Under Review'){ msg=`Hi ${name},\n\nYour application for ${jobTitle} at ${company} is now Under Review.\n\nWe will update you soon.\n\n- JobWay`; }
  else if(newStatus==='Not Selected'){ msg=`Hi ${name},\n\nThank you for applying for ${jobTitle} at ${company}.\n\nUnfortunately, you were not selected this time.\n\nWe encourage you to continue applying for opportunities on JobWay.\n\nThank you.`; }
  else { msg=`Hi ${name},\n\nYour application for ${jobTitle} at ${company} has been updated to: ${newStatus}.\n\nTrack your application:\nhttps://jobway.co.za/track-applications.html\n\n- JobWay`; }
  return {phone,msg};
}
function sendWhatsApp(app,newStatus){
  const {phone,msg}=buildWhatsAppMessage(app,newStatus);
  if(!phone){ alert('No WhatsApp number is available for this candidate.'); return; }
  const url='https://api.whatsapp.com/send?phone='+encodeURIComponent(phone)+'&text='+encodeURIComponent(msg);
  const popup=window.open(url,'_blank');
  if(!popup) alert('WhatsApp popup blocked. Allow popups and try again.');
  if(app.applicant_id){ supabaseClient.from('notifications').insert([{user_id:app.applicant_id,title:`Status: ${newStatus}`,message:msg}]).then(({error})=>{ if(error) console.warn('Notification error:',error); }); }
}
async function enrichAppsWithCv(apps){
  for(const a of apps){
    if(a.cv_url || a.cv_path){ a._cv_path=cleanCvPath(a.cv_url || a.cv_path); a._cv_name=a.cv_name || null; continue; }
    let found=null;
    if(a.applicant_id){
      const {data,error}=await supabaseClient.from('candidate_cvs').select('cv_url,cv_name,full_name,phone').eq('user_id',a.applicant_id).order('created_at',{ascending:false}).limit(1).maybeSingle();
      if(error) console.warn('Candidate CV lookup:',error.message);
      if(data) found=data;
    }
    if(!found){
      let phones=[];
      if(a.phone) phones.push(a.phone,formatPhone(a.phone));
      if(a.profiles?.phone) phones.push(a.profiles.phone,formatPhone(a.profiles.phone));
      phones=[...new Set(phones.filter(Boolean))];
      for(const ph of phones){
        const {data,error}=await supabaseClient.from('candidate_cvs').select('cv_url,cv_name,full_name,phone').eq('phone',ph).order('created_at',{ascending:false}).limit(1).maybeSingle();
        if(error) console.warn('Phone CV lookup:',error.message);
        if(data){ found=data; break; }
        if(ph.startsWith('27')){
          const zero='0'+ph.slice(2);
          const {data:data2}=await supabaseClient.from('candidate_cvs').select('cv_url,cv_name,full_name,phone').eq('phone',zero).order('created_at',{ascending:false}).limit(1).maybeSingle();
          if(data2){ found=data2; break; }
        }
      }
    }
    if(found){ a._cv_path=cleanCvPath(found.cv_url); a._cv_name=found.cv_name || null; a._full_name=found.full_name || a.profiles?.full_name; a._phone=found.phone || a.profiles?.phone || a.phone; }
    else { a._cv_path=cleanCvPath(a.profiles?.cv_url || a.profiles?.cv_path || ''); a._cv_name=a.profiles?.cv_name || null; }
  }
  return apps;
}
async function load(){
  if(loadingDashboard) return;
  loadingDashboard=true;
  const list=document.getElementById('list');
  try{
    const user=getCurrentUser();
    if(!user || !user.id){ list.innerHTML=`<div class="card">Please log in as an employer to view your dashboard.</div>`; document.getElementById('empty').style.display='none'; return; }
    let {data:jobs,error:jErr}=await supabaseClient.from('jobs').select('*').eq('employer_id',user.id).order('created_at',{ascending:false});
    if(jErr){ console.error('Jobs error:',jErr); throw new Error('Could not load your jobs: '+jErr.message); }
    if((!jobs || jobs.length===0) && user.email){
      const result=await supabaseClient.from('jobs').select('*').eq('employer_email',user.email).order('created_at',{ascending:false});
      if(result.error) console.warn('Email job lookup:',result.error.message);
      else if(result.data?.length) jobs=result.data;
    }
    currentJobs=jobs || [];
    const myJobIds=currentJobs.map(j=>j.id);
    let apps=[];
    if(myJobIds.length){
      const result=await supabaseClient.from('applications').select('*, jobs(title, company, location, salary)').in('job_id',myJobIds).order('created_at',{ascending:false});
      if(result.error){ console.error('Application loading error:',result.error); throw new Error('Could not load applications: '+result.error.message); }
      apps=result.data || [];
      if(apps.length){
        const applicantIds=[...new Set(apps.map(a=>a.applicant_id).filter(Boolean))];
        if(applicantIds.length){
          // FIXED: profiles has NO cv_path column - only cv_url + cv_name
          const {data:profs,error:pErr}=await supabaseClient.from('profiles').select('id,full_name,email,phone,cv_url,cv_name').in('id',applicantIds);
          if(pErr) console.warn('Profiles error:',pErr.message);
          const map={};
          (profs || []).forEach(p=>{ map[p.id]=p; });
          apps.forEach(a=>{ a.profiles=map[a.applicant_id] || null; });
        }
        apps=await enrichAppsWithCv(apps);
      }
    }
    currentApps=apps;
    document.getElementById('appCount').innerText=currentApps.length;
    document.getElementById('jobCount').innerText=currentJobs.length;
    document.getElementById('count').innerText=`(${currentApps.length} applicants)`;
    if(!currentApps.length){ document.getElementById('empty').style.display='block'; list.innerHTML=''; }
    else{
      document.getElementById('empty').style.display='none';
      list.innerHTML=currentApps.map(a=>{
        const name=a.profiles?.full_name || a._full_name || 'Applicant';
        const email=a.profiles?.email || '';
        const phone=a.profiles?.phone || a._phone || a.phone || '';
        const title=a.jobs?.title || 'Job';
        const comp=a.jobs?.company || '';
        const cvPath=getCvPath(a);
        const cvName=getCvName(a);
        const status=a.status || 'Application Received';
        const badgeClass=status==='Shortlisted'?'b-green':status==='Hired'?'b-orange':status==='Not Selected'?'b-red':status==='Interview Scheduled'?'b-green':'b-grey';
        const cvHTML=cvPath ? `<button class="btn-cv" data-action="cv" data-id="${esc(a.id)}">🔒 View CV — ${esc(cvName)}</button>` : `<span style="color:#FF8A9D;font-size:12px">No CV uploaded</span>`;
        const interviewBox=a.interview_date ? `<div class="interview-box">📅 <b>Interview:</b> ${esc(a.interview_date)} at ${esc(a.interview_time || '')}<br>📍 ${esc(a.interview_location || '')}<br><span style="font-size:11px;color:#8DB0BF">${esc(a.interview_note || '')}</span></div>` : '';
        return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap"><b>${esc(name)}</b><span class="badge ${badgeClass}">${esc(status)}</span></div><div class="meta">Applied for: <b style="color:#fff">${esc(title)} — ${esc(comp)}</b><br>Date: ${esc(fmt(a.created_at))}<br>Email: ${esc(email)}<br>WhatsApp: ${esc(phone || 'No number')}</div>${progressHTML(status)}${interviewBox}<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><button class="btn btn-green" data-action="status" data-id="${esc(a.id)}" data-status="Shortlisted">✓ Shortlist</button><button class="btn" style="background:#FFB020;color:#000;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer" data-action="interview" data-id="${esc(a.id)}">📅 Schedule Interview</button><button class="btn btn-dark" style="background:#1a3a2a;color:#01F9C6" data-action="status" data-id="${esc(a.id)}" data-status="Hired">🎉 Hire</button><button class="btn btn-dark" style="background:#3a1a1a;color:#ff9a9a" data-action="status" data-id="${esc(a.id)}" data-status="Not Selected">Reject</button></div><div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${cvHTML}<button class="btn btn-whats" style="padding:10px 14px;font-size:12px" data-action="whatsapp" data-id="${esc(a.id)}">💬 WhatsApp Candidate</button></div><div style="margin-top:8px;font-size:10px;color:#8DB0BF">🔒 CV access requires private Storage authorization.</div><label style="font-size:11px;color:#8DB0BF;margin-top:12px;display:block">CHANGE STATUS</label><select class="select" data-action="select-status" data-id="${esc(a.id)}">${STATUSES.map(s=>`<option value="${esc(s)}" ${status===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`;
      }).join('');
    }
    document.getElementById('jobsList').innerHTML=currentJobs.length ? currentJobs.map(j=>`<div class="card"><b>${esc(j.title)} • ${esc(j.company)}</b><br><span style="color:#8DB0BF;font-size:12px">${esc(j.location || '')} • ${esc(j.salary || '')} • ${currentApps.filter(a=>a.job_id===j.id).length} applicants</span></div>`).join('') : `<div class="card" style="text-align:center;color:#8DB0BF;font-size:13px">No jobs yet. <a href="post-job.html" style="color:#01F9C6">Post a job →</a></div>`;
    showMessage('');
  }catch(e){
    console.error('Dashboard error:',e);
    showMessage(e.message || 'Something went wrong loading the dashboard.','error');
    list.innerHTML=`<div class="card">Unable to load dashboard information.<br><br><button class="btn btn-green" id="retryBtn">Try Again</button></div>`;
    const retry=document.getElementById('retryBtn');
    if(retry) retry.addEventListener('click',load);
  }finally{ loadingDashboard=false; }
}
async function updateStatus(id,newStatus,sendWA=true){
  if(!STATUSES.includes(newStatus)){ alert('Invalid application status.'); return; }
  const app=currentApps.find(x=>String(x.id)===String(id));
  if(!app){ alert('Application not found.'); return; }
  let waWindow=null;
  if(sendWA){ const {phone}=buildWhatsAppMessage(app,newStatus); if(phone) waWindow=window.open('about:blank','_blank'); }
  const {error}=await supabaseClient.from('applications').update({status:newStatus}).eq('id',id);
  if(error){ if(waWindow) waWindow.close(); alert('Status update failed: '+error.message); return; }
  app.status=newStatus;
  if(sendWA){
    const {phone,msg}=buildWhatsAppMessage(app,newStatus);
    if(phone){
      const url='https://api.whatsapp.com/send?phone='+encodeURIComponent(phone)+'&text='+encodeURIComponent(msg);
      if(waWindow) waWindow.location.href=url; else alert('WhatsApp could not open. Please allow popups.');
      if(app.applicant_id) supabaseClient.from('notifications').insert([{user_id:app.applicant_id,title:`Status: ${newStatus}`,message:msg}]).then(({error})=>{ if(error) console.warn(error); });
    } else alert('Status saved, but the candidate has no WhatsApp number.');
  }
  await load();
}
async function changeStatusOnly(id,newStatus){
  const app=currentApps.find(x=>String(x.id)===String(id));
  if(!app) return;
  if(!STATUSES.includes(newStatus)){ alert('Invalid status.'); return; }
  const previousStatus=app.status || 'Application Received';
  if(newStatus===previousStatus) return;
  const shouldSend=confirm(`Status changed to ${newStatus}.\n\nWould you like to open WhatsApp for this candidate?`);
  let waWindow=null;
  if(shouldSend){ const {phone}=buildWhatsAppMessage(app,newStatus); if(phone) waWindow=window.open('about:blank','_blank'); }
  const {error}=await supabaseClient.from('applications').update({status:newStatus}).eq('id',id);
  if(error){ if(waWindow) waWindow.close(); alert('Status update failed: '+error.message); await load(); return; }
  app.status=newStatus;
  if(shouldSend){
    const {phone,msg}=buildWhatsAppMessage(app,newStatus);
    if(phone && waWindow){
      waWindow.location.href='https://api.whatsapp.com/send?phone='+encodeURIComponent(phone)+'&text='+encodeURIComponent(msg);
      if(app.applicant_id) supabaseClient.from('notifications').insert([{user_id:app.applicant_id,title:`Status: ${newStatus}`,message:msg}]).then(({error})=>{ if(error) console.warn(error); });
    } else if(!phone) alert('Status saved. No WhatsApp number is available.');
  }
  await load();
}
function manualWhatsApp(id){ const app=currentApps.find(x=>String(x.id)===String(id)); if(!app) return; sendWhatsApp(app,app.status || 'Application Received'); }
function openInterview(id){
  const app=currentApps.find(x=>String(x.id)===String(id));
  if(!app) return;
  currentInterviewId=id;
  const title=app.jobs?.title || '';
  document.getElementById('interviewFor').innerText=`For: ${app.profiles?.full_name || app._full_name || 'Applicant'} — ${title}`;
  let tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  const localDate=[tomorrow.getFullYear(),String(tomorrow.getMonth()+1).padStart(2,'0'),String(tomorrow.getDate()).padStart(2,'0')].join('-');
  document.getElementById('intDate').value=localDate;
  document.getElementById('intTime').value='09:00';
  document.getElementById('intLoc').value='Thohoyandou Office';
  document.getElementById('intMsg').value='';
  document.getElementById('interviewModal').classList.add('open');
}
function closeInterview(){ document.getElementById('interviewModal').classList.remove('open'); currentInterviewId=null; }
document.getElementById('closeInterviewBtn').addEventListener('click',closeInterview);
async function confirmInterview(){
  if(!currentInterviewId) return;
  const date=document.getElementById('intDate').value;
  const time=document.getElementById('intTime').value;
  const loc=document.getElementById('intLoc').value.trim();
  const note=document.getElementById('intMsg').value.trim();
  if(!date){ alert('Please choose an interview date.'); return; }
  if(!time){ alert('Please choose an interview time.'); return; }
  const app=currentApps.find(x=>String(x.id)===String(currentInterviewId));
  if(!app){ alert('Application not found.'); return; }
  const updates={status:'Interview Scheduled',interview_date:date,interview_time:time,interview_location:loc,interview_note:note};
  const {phone}=buildWhatsAppMessage({...app,...updates},'Interview Scheduled');
  let waWindow=null;
  if(phone) waWindow=window.open('about:blank','_blank');
  const btn=document.getElementById('confirmInterviewBtn');
  btn.disabled=true; btn.innerText='Saving interview...';
  try{
    const {error}=await supabaseClient.from('applications').update(updates).eq('id',currentInterviewId);
    if(error){ if(waWindow) waWindow.close(); throw error; }
    Object.assign(app,updates);
    closeInterview();
    const {msg}=buildWhatsAppMessage(app,'Interview Scheduled');
    if(phone && waWindow) waWindow.location.href='https://api.whatsapp.com/send?phone='+encodeURIComponent(phone)+'&text='+encodeURIComponent(msg);
    else alert('Interview saved, but no WhatsApp number is available.');
    if(app.applicant_id) supabaseClient.from('notifications').insert([{user_id:app.applicant_id,title:'Interview Scheduled',message:msg}]).then(({error})=>{ if(error) console.warn(error); });
    await load();
  }catch(e){ console.error('Interview error:',e); alert('Interview save failed: '+e.message); }
  finally{ btn.disabled=false; btn.innerText='Confirm & Send WhatsApp →'; }
}
document.getElementById('confirmInterviewBtn').addEventListener('click',confirmInterview);
document.getElementById('list').addEventListener('click',function(e){
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  const action=btn.dataset.action;
  const id=btn.dataset.id;
  if(action==='status') updateStatus(id,btn.dataset.status,true);
  if(action==='interview') openInterview(id);
  if(action==='whatsapp') manualWhatsApp(id);
  if(action==='cv'){ const app=currentApps.find(x=>String(x.id)===String(id)); if(app) openSecureCV(getCvPath(app),id,btn); }
});
document.getElementById('list').addEventListener('change',function(e){
  const el=e.target;
  if(el.dataset.action==='select-status') changeStatusOnly(el.dataset.id,el.value);
});
load();
const user=getCurrentUser();
if(user?.id){
  realtimeChannel=supabaseClient.channel('emp-apps-'+user.id).on('postgres_changes',{event:'*',schema:'public',table:'applications'},()=>{ load(); }).subscribe((status)=>{ console.log('JobWay realtime status:',status); });
}
</script>
