<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh}
.header{background:#11283A;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E3A4A;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:20px}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#2A3F4E;color:white}
.btn-green{background:#01F9C6;color:#08231C}
.container{max-width:700px;margin:0 auto;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:20px;padding:18px;margin-bottom:14px}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:12px;border-radius:12px;margin-top:8px}
.label{font-size:12px;color:#8DB0BF;margin-top:12px;display:block;font-weight:700}
.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin:2px}
.badge-teal{background:#143E4A;color:#01F9C6}
.badge-cv{background:#01F9C6;color:#08231C}
.badge-auto{background:#FFD700;color:#000}
.status-select{background:#0F2230;border:1px solid #01F9C6;color:#01F9C6;padding:12px;border-radius:12px;width:100%;font-weight:800;margin-top:8px}
.cv-box{background:#0F2230;border:1px dashed #01F9C6;border-radius:12px;padding:12px;margin-top:10px;display:flex;justify-content:space-between;align-items:center}
.banner{background:linear-gradient(135deg,#01F9C6,#30BA8F);color:#08231C;border-radius:12px;padding:10px;font-weight:900;font-size:12px;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo">JobWay — Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='jobs.html'">Jobs</button>
<button class="btn btn-dark" onclick="location.href='profile.html'">Profile</button>
</div>
</div>

<div class="container">
<div class="banner">📱 Notifications from 079 060 8952 | 1-Click CV Auto-Attached</div>

<h3 style="margin:12px 0">📥 Applications (<span id="count">0</span>)</h3>
<div id="appsList"></div>

<h3 style="margin:20px 0 10px">➕ Post Job</h3>
<div class="card">
<label class="label">Title</label><input class="input" id="jobTitle" placeholder="Cashier">
<label class="label">Company</label><input class="input" id="jobCompany" placeholder="Shoprite">
<label class="label">Location</label><input class="input" id="jobLocation" placeholder="Johannesburg, Gauteng">
<button class="btn btn-green" style="width:100%;margin-top:12px;padding:14px" onclick="postJob()">Post Job</button>
</div>
</div>

<script>
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Interview Completed","Assessment","Offer Made","Hired","Not Selected"];
const OFFICIAL_NUMBER="079 060 8952";
function getApps(){return JSON.parse(localStorage.getItem('jobway_all_applications')||'[]')}
function saveApps(a){localStorage.setItem('jobway_all_applications',JSON.stringify(a))}
function render(){
 let apps=getApps();
 document.getElementById('count').innerText=apps.length;
 if(apps.length==0){
   document.getElementById('appsList').innerHTML=`<div class="card" style="text-align:center;color:#8DB0BF">No applications yet. Candidate must save CV in Profile then 1-Click Apply.</div>`;
   return;
 }
 document.getElementById('appsList').innerHTML=apps.map(app=>{
  let cvBox = app.hasCV? `
   <div class="cv-box">
    <div><span class="badge badge-cv">📄 CV</span> ${app.autoApplied?'<span class="badge badge-auto">⚡ 1-Click</span>':''}<br>
    <span style="font-size:13px;font-weight:800">${app.cvName}</span><br>
    <span style="font-size:11px;color:#8DB0BF">${app.cvSize} • ${app.cvType||'PDF'}</span></div>
    <div style="display:flex;flex-direction:column;gap:6px">
      <button class="btn btn-green" style="padding:8px 12px;font-size:11px" onclick="downloadCV('${app.id}')">⬇️ Download</button>
      <button class="btn btn-dark" style="padding:8px 12px;font-size:11px" onclick="viewCV('${app.id}')">👁️ View</button>
    </div>
   </div>` : `<div style="color:#FF8A9D;font-size:12px;margin-top:8px">⚠️ No CV (old app)</div>`;
  return `<div class="card">
   <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px"><b>${app.job_title} @ ${app.company}</b><span class="badge badge-teal">${app.status}</span></div>
   <div style="color:#8DB0BF;font-size:12px;margin:6px 0">👤 ${app.name} • 📧 ${app.email} • 📱 ${app.whatsapp}<br>📅 ${new Date(app.date).toLocaleString()}</div>
   ${cvBox}
   <label class="label">Update Status → Auto Email + WhatsApp ${OFFICIAL_NUMBER}</label>
   <select class="status-select" onchange="changeStatus('${app.id}',this.value)">${STATUSES.map(s=>`<option ${app.status==s?'selected':''}>${s}</option>`).join('')}</select>
   <div id="interview-${app.id}" style="${app.status=='Interview Scheduled'?'':'display:none'}">
     <label class="label">Date</label><input class="input" type="date" id="date-${app.id}" value="${app.interviewDate||''}" onchange="saveInterview('${app.id}')">
     <label class="label">Time</label><input class="input" type="time" id="time-${app.id}" value="${app.interviewTime||''}" onchange="saveInterview('${app.id}')">
     <label class="label">Format</label><select class="input" id="format-${app.id}" onchange="saveInterview('${app.id}')"><option>In-Person</option><option>Online</option></select>
   </div>
  </div>`;
 }).join('');
}
function downloadCV(id){
 let app=getApps().find(a=>a.id==id);
 if(!app||!app.cvData){alert('No CV');return;}
 let a=document.createElement('a'); a.href=app.cvData; a.download=app.cvName||'CV.pdf'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function viewCV(id){
 let app=getApps().find(a=>a.id==id);
 if(!app||!app.cvData){alert('No CV');return;}
 let win=window.open(); win.document.write(`<html><body style="margin:0"><iframe src="${app.cvData}" style="width:100%;height:100vh;border:none"></iframe></body></html>`);
}
function changeStatus(id,newStatus){
 let apps=getApps(); let app=apps.find(a=>a.id==id); let old=app.status; app.status=newStatus;
 if(newStatus=='Interview Scheduled') document.getElementById('interview-'+id).style.display='block'; else document.getElementById('interview-'+id).style.display='none';
 saveApps(apps);
 let logs=JSON.parse(localStorage.getItem('jobway_notifications')||'[]');
 logs.unshift({appId:id,text:`${old} → ${newStatus} for ${app.job_title}`,channel:`AUTO ${app.email} + WhatsApp ${OFFICIAL_NUMBER}`,time:Date.now(),auto:true});
 localStorage.setItem('jobway_notifications',JSON.stringify(logs));
 alert(`✅ ${newStatus}\n📧 Auto Email to ${app.email}\n💬 WhatsApp from ${OFFICIAL_NUMBER} to ${app.whatsapp}\n📄 CV: ${app.cvName}`);
 render();
}
function saveInterview(id){
 let apps=getApps(); let app=apps.find(a=>a.id==id);
 app.interviewDate=document.getElementById('date-'+id).value; app.interviewTime=document.getElementById('time-'+id).value; app.interviewFormat=document.getElementById('format-'+id).value;
 saveApps(apps);
 alert(`📅 Interview ${app.interviewDate} ${app.interviewTime} saved + Auto notif from ${OFFICIAL_NUMBER}`);
}
function postJob(){
 let t=document.getElementById('jobTitle').value; let c=document.getElementById('jobCompany').value; let l=document.getElementById('jobLocation').value;
 if(!t||!c){alert('Fill title & company');return;}
 let jobs=JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]');
 jobs.unshift({title:t,company:c,location:l,city:l.split(',')[0]||'Gauteng',type:'Full-time',remote:'Onsite',level:'Entry Level',salary:'R5000',salaryText:'R5,000',desc:'New opening',required:['Customer'],duration:'Permanent',postedAt:Date.now(),closingDate:'30 Sept 2026'});
 localStorage.setItem('jobway_employer_jobs',JSON.stringify(jobs));
 alert('✅ Job posted'); location.href='jobs.html';
}
render();
</script>
</body>
</html>
