<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(1,249,198,0.15);position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:20px;font-family:'Space Grotesk',sans-serif}
.btn{border:none;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.container{max-width:700px;margin:0 auto;padding:16px}
.stat{display:flex;gap:12px}
.stat-card{flex:1;background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;text-align:center}
.stat-num{font-size:26px;font-weight:900}
.stat-label{font-size:12px;color:#8DB0BF}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:16px;margin:12px 0}
.pill{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:700;background:rgba(255,255,255,0.06)}
select{width:100%;background:#0F2230;color:white;padding:10px;border:1px solid #25475A;border-radius:10px;margin-top:8px}
</style>
</head>
<body>
<div class="header">
<div class="logo">JobWay • Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='post-job.html'">+ Post Job</button>
<button class="btn btn-dark" onclick="location.href='jobs.html'">View jobs</button>
<button class="btn btn-green" onclick="logout()">Log out</button>
</div>
</div>
<div class="container">
<h2 style="font-family:'Space Grotesk'">Dashboard</h2>
<div class="stat" style="margin-top:12px">
<div class="stat-card"><div class="stat-num" id="jobCount">0</div><div class="stat-label">My Jobs</div></div>
<div class="stat-card"><div class="stat-num" id="appCount">0</div><div class="stat-label">Applications</div></div>
</div>
<h3 style="margin-top:20px">Applicants — People who applied to your jobs</h3>
<div id="appsList" style="color:#8DB0BF;font-size:13px;margin-top:8px">Loading from Supabase...</div>
<h3 style="margin-top:20px">My Posted Jobs</h3>
<div id="jobsList" style="margin-top:8px"></div>
</div>
<script>
const supabaseClient = window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
function logout(){ localStorage.clear(); location.href='index.html'; }
function getUser(){ try{ return JSON.parse(localStorage.getItem('jobway_user')||localStorage.getItem('user')||'null'); }catch(e){return null;} }
function getEmail(){ return localStorage.getItem('jobway_user_email') || getUser()?.email || ''; }

// FIXED CV DOWNLOAD - handles 404 NoSuchKey
async function downloadCV(app){
  let url = app.cv_url || app.cvUrl || '';
  let path = app.cv_path || app.cv_filename || '';
  // If url is just filename, build public URL
  if(url && !url.startsWith('http')){
    let { data } = supabaseClient.storage.from('cvs').getPublicUrl(url);
    url = data.publicUrl;
  }
  if(!url && path){
    let { data } = supabaseClient.storage.from('cvs').getPublicUrl(path);
    url = data.publicUrl;
  }
  if(!url){ alert('No CV uploaded for this candidate'); return; }
  // Test if file exists first
  try{
    let res = await fetch(url, {method:'HEAD'});
    if(!res.ok){
      // Try listing bucket to find similar file
      let { data: files } = await supabaseClient.storage.from('cvs').list('', {limit:100});
      let found = files?.find(f=> f.name.includes(app.jobseeker_name?.split(' ')[0]) || f.name.includes(path));
      if(found){
        let { data } = supabaseClient.storage.from('cvs').getPublicUrl(found.name);
        url = data.publicUrl;
      } else {
        alert('CV file not found in cvs bucket (404 NoSuchKey). Candidate uploaded: '+(path||url)+'\n\nAsk candidate to re-upload CV in profile.html. The old file was deleted or name mismatched.');
        return;
      }
    }
  }catch(e){}
  window.open(url, '_blank');
}

async function load(){
  let email = getEmail();
  // 1. JOBS - try filtered, if 0 then show ALL (fixes 0 Jobs bug)
  let { data: jobs, error: jErr } = await supabaseClient.from('jobs').select('*').order('created_at',{ascending:false}).limit(100);
  if(jErr){ document.getElementById('jobsList').innerHTML = 'Error: '+jErr.message; }
  let myJobs = jobs || [];
  // Try filter by email/company but fallback to all
  if(email && myJobs.length>0){
    let filtered = myJobs.filter(j=> (j.employer_email===email || j.email===email || j.company_email===email));
    if(filtered.length>0) myJobs = filtered;
    // If still 0 filtered, show ALL (employer can see all during testing)
  }
  document.getElementById('jobCount').innerText = myJobs.length;
  document.getElementById('jobsList').innerHTML = myJobs.length? myJobs.map(j=>`<div class="card"><b>${j.title}</b><div style="font-size:12px;color:#8DB0BF">${j.company} • ${j.location||''} • ${j.type||''}</div><div style="font-size:12px;margin-top:6px;color:#C8DDE3">${(j.description||'').substring(0,120)}</div></div>`).join('') : '<div class="card" style="text-align:center;color:#8DB0BF">No jobs posted yet. Click + Post Job.</div>';

  // 2. APPLICATIONS - show ALL for now, filter later
  let { data: apps, error: aErr } = await supabaseClient.from('applications').select('*').order('created_at',{ascending:false}).limit(100);
  if(aErr){ document.getElementById('appsList').innerHTML = 'Error loading: '+aErr.message; return; }
  // Filter to my jobs if we have job titles
  let myTitles = new Set(myJobs.map(j=>j.title+'|'+j.company));
  let myApps = apps || [];
  // If we have myJobs and titles match, filter, else show all
  if(myJobs.length>0 && myTitles.size>0){
    let filteredApps = myApps.filter(a=> myTitles.has(a.job_title+'|'+a.company));
    if(filteredApps.length>0) myApps = filteredApps;
  }
  document.getElementById('appCount').innerText = myApps.length;
  if(myApps.length===0){
    document.getElementById('appsList').innerHTML = `<div class="card" style="text-align:center;color:#8DB0BF">No applications yet for your jobs.<br><span style="font-size:11px">Showing all: ${apps?.length||0} total in DB. If you posted as different email, we still show all.</span></div>`;
    return;
  }
  document.getElementById('appsList').innerHTML = myApps.map(a=>{
    let cvLabel = a.cv_filename || a.cv_url?.split('/').pop() || 'No CV';
    return `<div class="card">
      <div style="display:flex;justify-content:space-between"><b>${a.jobseeker_name||a.jobseeker_email||'Applicant'}</b><span class="pill">${a.status||'Application Received'}</span></div>
      <div style="font-size:12px;color:#8DB0BF;margin-top:4px">${a.job_title} at ${a.company} • ${a.jobseeker_email||''} • ${a.phone||''}</div>
      <div style="font-size:11px;color:#01F9C6;margin-top:6px">📄 CV: ${cvLabel}</div>
      <div style="display:flex;gap:8px;margin-top:10px">
        <button class="btn btn-green" style="flex:1" onclick='downloadCV(${JSON.stringify({cv_url:a.cv_url, cv_filename:a.cv_filename, cv_path:a.cv_path, jobseeker_name:a.jobseeker_name})})'>📥 Download CV</button>
        <button class="btn btn-dark" style="flex:1" onclick="window.open('https://wa.me/${(a.phone||'').replace(/[^0-9]/g,'')}', '_blank')">WhatsApp</button>
      </div>
      <select onchange="updateStatus('${a.id}', this.value)">
        <option ${a.status==='Application Received'?'selected':''}>Application Received</option>
        <option ${a.status==='Under Review'?'selected':''}>Under Review</option>
        <option ${a.status==='Shortlisted'?'selected':''}>Shortlisted</option>
        <option ${a.status==='Interview Scheduled'?'selected':''}>Interview Scheduled</option>
        <option ${a.status==='Hired'?'selected':''}>Hired</option>
        <option ${a.status==='Not Selected'?'selected':''}>Not Selected</option>
      </select>
    </div>`;
  }).join('');
}
async function updateStatus(id, status){
  await supabaseClient.from('applications').update({status}).eq('id', id);
  alert('Status updated to '+status);
}
load();
setTimeout(()=>{ if(document.getElementById('appsList').innerText.includes('Loading')) document.getElementById('appsList').innerHTML='Timeout - check Supabase RLS. Go to Supabase Dashboard → Authentication → Policies → jobs & applications → disable RLS or set to public.'; }, 8000);
</script>
</body>
</html>
