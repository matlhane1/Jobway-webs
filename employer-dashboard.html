<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script>
(function(){
  const logged = localStorage.getItem('jobway_logged_in');
  const role = localStorage.getItem('user_role');
  if(!logged || role !== 'employer'){ location.href='login.html'; }
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:18px;font-family:'Space Grotesk',sans-serif;cursor:pointer}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.btn-whats{background:#25D366;color:#fff}
.container{max-width:720px;margin:0 auto;padding:16px}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px;margin-bottom:14px}
.meta{color:#8DB0BF;font-size:12px;margin:6px 0;line-height:1.5}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.b-green{background:#01F9C6;color:#0A1F2E}
.b-grey{background:rgba(255,255,255,0.1);color:#A8C8D0}
.b-orange{background:#FFB020;color:#000}
.b-red{background:#3a1a1a;color:#ff9a9a}
.select,.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:12px;border-radius:10px;margin-top:8px;font-size:13px;font-family:inherit}
.stat{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-family:'Space Grotesk'}
.stat span{font-size:11px;color:#8DB0BF}
.progress{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.p-badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
.p-done{background:rgba(1,249,198,.15);color:#01F9C6}
.p-active{background:#01F9C6;color:#0A1F2E}
.p-pending{background:rgba(255,255,255,.08);color:#8DB0BF;border:1px solid #2a4a5c}
.interview-box{background:#0F2230;border:1px solid rgba(1,249,198,.25);border-radius:14px;padding:14px;margin-top:12px}
.label{font-size:11px;color:#8DB0BF;font-weight:700;margin-top:10px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.modal-card{background:#11283A;width:100%;max-width:500px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay • Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='post-job.html'">+ Post Job</button>
<button class="btn btn-dark" onclick="location.href='jobs.html'">View jobs</button>
<button class="btn btn-dark" onclick="logout()">Log out</button>
</div>
</div>
<div class="container">
<h3 style="font-family:'Space Grotesk';font-size:18px;margin:10px 0">Dashboard <span id="count" style="color:#01F9C6;font-size:14px"></span></h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
<div class="stat"><b id="jobCount">0</b><span>My Jobs</span></div>
<div class="stat"><b id="appCount">0</b><span>Applications</span></div>
</div>
<h4 style="margin:16px 0 10px;font-size:14px">Applicants — People who applied to your jobs</h4>
<div id="list"></div>
<div id="empty" style="display:none;text-align:center;padding:30px;color:#8DB0BF">No applications yet. Share your job link to get applicants.</div>
<h4 style="margin:20px 0 10px;font-size:14px">My Posted Jobs</h4>
<div id="jobsList"></div>
</div>
<div class="modal" id="interviewModal">
<div class="modal-card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>📅 Schedule Interview</h3><button class="btn btn-dark" onclick="closeInterview()">✕</button></div>
<p id="interviewFor" style="color:#8DB0BF;font-size:13px;margin:8px 0"></p>
<label class="label">INTERVIEW DATE</label><input type="date" id="intDate" class="input">
<label class="label">TIME</label><input type="time" id="intTime" class="input" value="09:00">
<label class="label">LOCATION / LINK</label><input id="intLoc" class="input" placeholder="e.g. Thohoyandou Office, Shoprite, or WhatsApp Video" value="Thohoyandou Office">
<label class="label">MESSAGE TO CANDIDATE</label><input id="intMsg" class="input" placeholder="Bring ID, CV...">
<button class="btn btn-green" style="width:100%;padding:14px;margin-top:14px" onclick="confirmInterview()">Confirm & Send WhatsApp →</button>
</div>
</div>
<script>
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Hired","Not Selected"];
let currentInterviewIndex = null;
function logout(){ localStorage.removeItem('jobway_logged_in'); localStorage.removeItem('user_role'); location.href='index.html'; }
function fmt(d){ try{ if(!d) return ''; return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}) }catch(e){ return d||'' } }
function getApps(){ let a1=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]'); let a2=JSON.parse(localStorage.getItem('jobway_applied')||'[]'); return a1.length?a1:a2; }
function saveApps(a){ try{ localStorage.setItem('jobway_all_applications',JSON.stringify(a)); localStorage.setItem('jobway_applied',JSON.stringify(a)); }catch(e){ alert('Storage full - CV too large. Old CVs will be cleared.'); let cleaned=a.map(x=>({...x, cvData:null})); localStorage.setItem('jobway_all_applications',JSON.stringify(cleaned)); localStorage.setItem('jobway_applied',JSON.stringify(cleaned)); } }
function getJobs(){ return JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]') }
function formatPhone(p){
  if(!p) return '';
  let c=p.replace(/[^0-9]/g,'');
  if(c.startsWith('0')) c='27'+c.slice(1);
  if(c.startsWith('27') && c.length===11) return c;
  return c;
}
function progressHTML(status){
  let steps=['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired'];
  let idx=steps.indexOf(status); if(idx==-1) idx=0;
  if(status==='Not Selected') return `<div class="progress"><span class="p-badge" style="background:#3a1a1a;color:#ff9a9a">❌ Not Selected</span></div>`;
  return `<div class="progress">${steps.map((s,i)=>{
    let cls = i<idx?'p-done':i==idx?'p-active':'p-pending';
    let icon = i<idx?'✅':i==idx?'👁️':'';
    return `<span class="p-badge ${cls}">${icon} ${s}</span>`;
  }).join('')}</div>`;
}
function sendWhatsApp(app, newStatus, skipConfirm){
  let phone=formatPhone(app.whatsapp||app.phone||'');
  if(!phone){ alert(`Status saved as ${newStatus} but no WhatsApp number for ${app.name}. Ask candidate to add it.`); return; }
  let jobTitle = app.job_title||app.title||'Job';
  let msg='';
  let notifText='';
  if(newStatus==='Shortlisted'){ msg=`Hi ${app.name} 👋 Great news! You have been SHORTLISTED for ${jobTitle} at ${app.company} on JobWay. We will contact you for next steps. Track: https://jobway.co.za/track-applications.html`; notifText=`Hi ${app.name} 👋 Great news! You have been SHORTLISTED for ${jobTitle} at ${app.company} on JobWay. We will contact you for next steps.`; }
  else if(newStatus==='Interview Scheduled'){ msg=`Hi ${app.name} 📅 Interview Scheduled for ${jobTitle} at ${app.company} on JobWay.\n\n📅 Date: ${app.interview_date||''}\n🕐 Time: ${app.interview_time||''}\n📍 Location: ${app.interview_location||''}\n📝 Note: ${app.interview_note||'Bring ID & CV'}\n\nPlease reply YES to confirm. Track: https://jobway.co.za/track-applications.html`; notifText=`Hi ${app.name} 📅 Interview Scheduled for ${jobTitle} at ${app.company} on JobWay.\n\n📅 Date: ${app.interview_date||''}\n🕐 Time: ${app.interview_time||''}\n📍 Location: ${app.interview_location||''}`; }
  else if(newStatus==='Hired'){ msg=`Hi ${app.name} 🎉 Congratulations! You are HIRED for ${jobTitle} at ${app.company} on JobWay. Please check your Track page and reply.`; notifText=msg; }
  else if(newStatus==='Under Review'){ msg=`Hi ${app.name}, update: Your application for ${jobTitle} at ${app.company} is now Under Review. We'll update you soon. - JobWay`; notifText=msg; }
  else if(newStatus==='Not Selected'){ msg=`Hi ${app.name}, thank you for applying for ${jobTitle} at ${app.company}. Unfortunately you were not selected this time. Keep applying on JobWay.`; notifText=msg; }
  else { msg=`Hi ${app.name}, JobWay update: Your application for ${jobTitle} at ${app.company} is now: ${newStatus}. Track: https://jobway.co.za/track-applications.html`; notifText=`Hi ${app.name}, JobWay update: Your application for ${jobTitle} at ${app.company} is now: ${newStatus}.`; }

  // FIXED: Prevent duplicate notifications - check if same status already exists
  let notifs=JSON.parse(localStorage.getItem('jobway_notifications')||'[]');
  let notifTitle=`Status: ${newStatus} - ${jobTitle}`;
  let alreadyExists = notifs.some(n=> n.title===notifTitle && n.text===notifText);
  if(!alreadyExists){
    notifs.unshift({id:Date.now(), title:notifTitle, text:notifText, date:new Date().toISOString(), read:false, job:jobTitle});
    // keep max 20 notifications to avoid storage bloat
    if(notifs.length>20) notifs = notifs.slice(0,20);
    localStorage.setItem('jobway_notifications', JSON.stringify(notifs));
  }
  window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`, '_blank');
}
function load(){
  let apps=getApps(); let jobs=getJobs();
  document.getElementById('appCount').innerText=apps.length;
  document.getElementById('jobCount').innerText=jobs.length;
  document.getElementById('count').innerText=`(${apps.length} applicants)`;
  if(!apps.length){ document.getElementById('empty').style.display='block'; document.getElementById('list').innerHTML=''; }
  else{
    document.getElementById('empty').style.display='none';
    document.getElementById('list').innerHTML=apps.map((a,i)=>{
      let name=a.name||a.fullName||'Applicant';
      let title=a.job_title||a.title||'Job';
      let cvHTML='';
      if(a.cvData){ cvHTML=`<button class="btn btn-dark" style="padding:8px 12px;font-size:11px" onclick="downloadCV(${i})">📄 ${a.cvName||'Download CV'}</button>`; }
      else if(a.cvName){ cvHTML=`<span style="color:#FFB020;font-size:11px">📄 ${a.cvName} <br><span style="color:#8DB0BF">File too large - Ask via WhatsApp</span></span>`; }
      else { cvHTML=`<span style="color:#FF8A9D;font-size:12px">No CV uploaded</span>`; }
      let interviewBox=a.interview_date?`<div class="interview-box">📅 <b>Interview:</b> ${a.interview_date} at ${a.interview_time} • ${a.interview_location}<br><span style="font-size:11px;color:#8DB0BF">${a.interview_note||''}</span></div>`:'';
      let badgeClass = a.status=='Shortlisted'?'b-green':a.status=='Hired'?'b-orange':a.status=='Not Selected'?'b-red':a.status=='Interview Scheduled'?'b-green':'b-grey';
      return `<div class="card">
        <div style="display:flex;justify-content:space-between"><b>${name}</b><span class="badge ${badgeClass}">${a.status||'Application Received'}</span></div>
        <div class="meta">Applied for: <b style="color:#fff">${title} — ${a.company||''}</b><br>Date: ${fmt(a.date)} • ${a.email||''} • WhatsApp: ${a.whatsapp||a.phone||'No number'}<br>CV: ${a.cvName||'No CV'}</div>
        ${progressHTML(a.status||'Application Received')}
        ${interviewBox}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-green" onclick="updateStatus(${i},'Shortlisted',true)">✓ Shortlist + WhatsApp</button>
          <button class="btn btn-green" style="background:#FFB020" onclick="openInterview(${i})">📅 Schedule Interview</button>
          <button class="btn btn-dark" style="background:#1a3a2a;color:#01F9C6" onclick="updateStatus(${i},'Hired',true)">🎉 Hire + WhatsApp</button>
          <button class="btn btn-dark" style="background:#3a1a1a;color:#ff9a9a" onclick="updateStatus(${i},'Not Selected',true)">Reject</button>
        </div>
        <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${cvHTML}<button class="btn btn-whats" style="padding:8px 12px;font-size:11px" onclick="manualWhatsApp(${i})">💬 WhatsApp Candidate</button></div>
        <label style="font-size:11px;color:#8DB0BF;margin-top:12px;display:block">CHANGE STATUS (only changes status, no WhatsApp unless you choose)</label>
        <select class="select" onchange="changeStatusOnly(${i},this.value)">${STATUSES.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`;
    }).join('');
  }
  document.getElementById('jobsList').innerHTML=jobs.length?jobs.map(j=>`<div class="card"><b>${j.title} • ${j.company}</b><br><span style="color:#8DB0BF;font-size:12px">${j.location||''} • ${j.salaryText||j.salary||''}</span></div>`).join(''):`<div class="card" style="text-align:center;color:#8DB0BF;font-size:13px">No jobs yet.</div>`;
}
function manualWhatsApp(i){ let app=getApps()[i]; sendWhatsApp(app, app.status||'Application Received'); }
function updateStatus(i,newStatus, sendWA){
  let apps=getApps(); let app=apps[i];
  apps[i].status=newStatus; saveApps(apps);
  if(sendWA){ sendWhatsApp(app, newStatus); }
  load();
}
function changeStatusOnly(i,newStatus){
  let apps=getApps();
  apps[i].status=newStatus; saveApps(apps);
  if(confirm(`Status changed to ${newStatus}. Send WhatsApp to candidate?`)){ sendWhatsApp(apps[i], newStatus); }
  load();
}
function openInterview(i){
  currentInterviewIndex=i;
  let app=getApps()[i];
  document.getElementById('interviewFor').innerText=`For: ${app.name} — ${app.job_title||app.title}`;
  let tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('intDate').value=tomorrow.toISOString().split('T')[0];
  document.getElementById('interviewModal').classList.add('open');
}
function closeInterview(){ document.getElementById('interviewModal').classList.remove('open'); }
function confirmInterview(){
  let apps=getApps(); let app=apps[currentInterviewIndex];
  let date=document.getElementById('intDate').value;
  let time=document.getElementById('intTime').value;
  let loc=document.getElementById('intLoc').value;
  let note=document.getElementById('intMsg').value;
  if(!date){ alert('Please choose a date'); return; }
  apps[currentInterviewIndex].status='Interview Scheduled';
  apps[currentInterviewIndex].interview_date=date;
  apps[currentInterviewIndex].interview_time=time;
  apps[currentInterviewIndex].interview_location=loc;
  apps[currentInterviewIndex].interview_note=note;
  saveApps(apps);
  closeInterview();
  sendWhatsApp(apps[currentInterviewIndex], 'Interview Scheduled');
  load();
}
function downloadCV(i){ let app=getApps()[i]; if(!app?.cvData){ alert('No CV file - Ask candidate to send via WhatsApp. File name was: '+(app.cvName||'')); return;} let a=document.createElement('a'); a.href=app.cvData; a.download=app.cvName||'CV.pdf'; a.click(); }
load();
</script>
</body>
</html>
