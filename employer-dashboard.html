<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Employer Dashboard | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:18px;font-family:'Space Grotesk',sans-serif;cursor:pointer}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.btn-whats{background:#25D366;color:#fff}
.btn-cv{background:#01F9C6;color:#0A1F2E;text-decoration:none;display:inline-flex;align-items:center;gap:6px;padding:10px 14px;border-radius:999px;font-weight:800;font-size:12px;cursor:pointer;border:0}
.container{max-width:720px;margin:0 auto;padding:16px}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:18px;margin-bottom:14px}
.meta{color:#8DB0BF;font-size:12px;margin:6px 0;line-height:1.6}
.badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800;display:inline-block}
.b-green{background:#01F9C6;color:#0A1F2E}
.b-grey{background:rgba(255,255,255,0.1);color:#A8C8D0}
.b-orange{background:#FFB020;color:#000}
.b-red{background:#3a1a1a;color:#ff9a9a}
.select,.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:12px;border-radius:10px;margin-top:8px;font-size:13px;font-family:inherit}
.stat{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:14px;text-align:center}
.stat b{font-size:22px;display:block;font-family:'Space Grotesk'}
.stat span{font-size:11px;color:#8DB0BF}
.progress{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.p-badge{padding:5px 10px;border-radius:999px;font-size:11px;font-weight:800}
.p-done{background:rgba(1,249,198,.15);color:#01F9C6}
.p-active{background:#01F9C6;color:#0A1F2E}
.p-pending{background:rgba(255,255,255,.08);color:#8DB0BF;border:1px solid #2a4a5c}
.interview-box{background:#0F2230;border:1px solid rgba(1,249,198,.25);border-radius:14px;padding:14px;margin-top:12px}
.label{font-size:11px;color:#8DB0BF;font-weight:700;margin-top:10px;display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;z-index:50}
.modal.open{display:flex}
.modal-card{background:#11283A;width:100%;max-width:500px;margin:0 auto;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow:auto}
</style>
</head>
<body>
<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay • Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='post-job.html'">+ Post Job</button>
<button class="btn btn-dark" onclick="location.href='jobs.html'">View jobs</button>
<button class="btn btn-dark" onclick="logout()">Log out</button>
</div>
</div>
<div class="container">
<h3 style="font-family:'Space Grotesk';font-size:18px;margin:10px 0">Dashboard <span id="count" style="color:#01F9C6;font-size:14px"></span></h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px">
<div class="stat"><b id="jobCount">0</b><span>My Jobs</span></div>
<div class="stat"><b id="appCount">0</b><span>Applications</span></div>
</div>
<h4 style="margin:16px 0 10px;font-size:14px">Applicants — People who applied to your jobs</h4>
<div id="list"><p style="color:#8DB0BF;font-size:13px">Loading from Supabase...</p></div>
<div id="empty" style="display:none;text-align:center;padding:30px;color:#8DB0BF">No applications yet. Share your job link to get applicants.</div>
<h4 style="margin:20px 0 10px;font-size:14px">My Posted Jobs</h4>
<div id="jobsList"></div>
</div>
<div class="modal" id="interviewModal">
<div class="modal-card">
<div style="display:flex;justify-content:space-between;align-items:center"><h3>📅 Schedule Interview</h3><button class="btn btn-dark" onclick="closeInterview()">✕</button></div>
<p id="interviewFor" style="color:#8DB0BF;font-size:13px;margin:8px 0"></p>
<label class="label">INTERVIEW DATE</label><input type="date" id="intDate" class="input">
<label class="label">TIME</label><input type="time" id="intTime" class="input" value="09:00">
<label class="label">LOCATION / LINK</label><input id="intLoc" class="input" placeholder="e.g. Thohoyandou Office, Shoprite, or WhatsApp Video" value="Thohoyandou Office">
<label class="label">MESSAGE TO CANDIDATE</label><input id="intMsg" class="input" placeholder="Bring ID, CV...">
<button class="btn btn-green" style="width:100%;padding:14px;margin-top:14px" onclick="confirmInterview()">Confirm & Send WhatsApp →</button>
</div>
</div>
<script>
const SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const STATUSES=["Application Received","Under Review","Shortlisted","Interview Scheduled","Hired","Not Selected"];
let currentInterviewId = null;
let currentApps = [];
let currentJobs = [];
function logout(){ localStorage.removeItem('jobway_logged_in'); localStorage.removeItem('user_role'); localStorage.removeItem('jobway_user'); location.href='index.html'; }
function fmt(d){ try{ if(!d) return ''; return new Date(d).toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}) }catch(e){ return d||'' } }
function formatPhone(p){ if(!p) return ''; let c=p.toString().replace(/[^0-9]/g,''); if(c.startsWith('0')) c='27'+c.slice(1); return c; }
function getCurrentUser(){ try{ return JSON.parse(localStorage.getItem('jobway_user')||localStorage.getItem('user')||'null'); }catch(e){ return null; } }

// SECURE: Private bucket — no getPublicUrl ever
function getCvPath(a){
  let raw = a.cv_path || a.cv_url || a.profiles?.cv_path || a.profiles?.cv_url || '';
  if(!raw) return null;
  if(raw.indexOf('http') !== -1){
    // Old record — extract file name only
    let m = raw.split('/cvs/'); 
    if(m[1]) return decodeURIComponent(m[1].split('?')[0]);
    return raw.split('/').pop().split('?')[0];
  }
  return raw.replace(/^cvs\//,'').trim();
}

async function openSecureCV(cvPath, appId, btn){
  if(!cvPath){ alert('No CV for this candidate'); return; }
  let orig = btn.innerHTML;
  btn.innerHTML = '⏳ Creating 60min secure link...';
  btn.disabled = true;
  try{
    const res = await fetch(SUPABASE_URL + '/functions/v1/get-cv-link', {
      method: 'POST',
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ cv_path: cvPath, application_id: appId, mode: 'employer' })
    });
    const data = await res.json();
    if(data.signedUrl){
      // Log access for POPIA audit trail
      try{ await supabaseClient.from('cv_access_log').insert([{ application_id: appId, cv_path: cvPath, accessed_by: getCurrentUser()?.id }]); }catch(e){}
      window.open(data.signedUrl, '_blank');
      btn.innerHTML = '✅ Opened — expires in 60min';
    } else {
      btn.innerHTML = '❌ Failed — ' + (data.error || 'deploy function');
      alert('Failed to create secure link. Did you deploy get-cv-link Edge Function? Error: ' + (data.error || 'unknown'));
    }
  }catch(e){
    btn.innerHTML = '❌ Network error';
    alert('Error: ' + e.message + ' — Deploy Edge Function get-cv-link first.');
  }
  setTimeout(()=>{ btn.innerHTML = orig; btn.disabled=false; }, 4000);
}

function progressHTML(status){
  let steps=['Application Received','Under Review','Shortlisted','Interview Scheduled','Hired'];
  let idx=steps.indexOf(status); if(idx==-1) idx=0;
  if(status==='Not Selected') return `<div class="progress"><span class="p-badge" style="background:#3a1a1a;color:#ff9a9a">❌ Not Selected</span></div>`;
  return `<div class="progress">${steps.map((s,i)=>{
    let cls = i<idx?'p-done':i==idx?'p-active':'p-pending';
    let icon = i<idx?'✅':i==idx?'👁️':'';
    return `<span class="p-badge ${cls}">${icon} ${s}</span>`;
  }).join('')}</div>`;
}
async function sendWhatsApp(app, newStatus){
  let phone=formatPhone(app.profiles?.phone || app.phone || '');
  if(!phone){ alert(`Status saved as ${newStatus} but no WhatsApp number for candidate.`); return; }
  let jobTitle = app.jobs?.title || 'Job';
  let comp = app.jobs?.company || 'JobWay';
  let name = app.profiles?.full_name || 'Applicant';
  let msg='';
  if(newStatus==='Shortlisted'){ msg=`Hi ${name} 👋 Great news! You have been SHORTLISTED for ${jobTitle} at ${comp} on JobWay. We will contact you for next steps. Track: https://jobway.co.za/track-applications.html`; }
  else if(newStatus==='Interview Scheduled'){ msg=`Hi ${name} 📅 Interview Scheduled for ${jobTitle} at ${comp} on JobWay.\n\n📅 Date: ${app.interview_date||''}\n🕐 Time: ${app.interview_time||''}\n📍 Location: ${app.interview_location||''}\n📝 Note: ${app.interview_note||'Bring ID & CV'}\n\nPlease reply YES to confirm.`; }
  else if(newStatus==='Hired'){ msg=`Hi ${name} 🎉 Congratulations! You are HIRED for ${jobTitle} at ${comp} on JobWay.`; }
  else if(newStatus==='Under Review'){ msg=`Hi ${name}, update: Your application for ${jobTitle} at ${comp} is now Under Review. We'll update you soon. - JobWay`; }
  else if(newStatus==='Not Selected'){ msg=`Hi ${name}, thank you for applying for ${jobTitle} at ${comp}. Unfortunately you were not selected this time. Keep applying on JobWay.`; }
  else { msg=`Hi ${name}, JobWay update: Your application for ${jobTitle} at ${comp} is now: ${newStatus}. Track: https://jobway.co.za/track-applications.html`; }
  try{ await supabaseClient.from('notifications').insert([{ user_id: app.applicant_id, title: `Status: ${newStatus} - ${jobTitle}`, message: msg }]); }catch(e){}
  window.open(`https://api.whatsapp.com/send?phone=${phone}&text=${encodeURIComponent(msg)}`, '_blank');
}
async function load(){
  let user = getCurrentUser();
  if(!user || !user.id){ document.getElementById('list').innerHTML=`<div class="card">Please login as employer</div>`; return; }
  let { data: jobs, error: jErr } = await supabaseClient.from('jobs').select('*').eq('employer_id', user.id).order('created_at', {ascending:false});
  if(jErr || !jobs || jobs.length===0){
    let { data: jobsByEmail } = await supabaseClient.from('jobs').select('*').eq('employer_email', user.email).order('created_at', {ascending:false});
    if(jobsByEmail && jobsByEmail.length) jobs = jobsByEmail;
  }
  currentJobs = jobs || [];
  let myJobIds = currentJobs.map(j=>j.id);
  let apps = [];
  if(myJobIds.length>0){
    let { data, error } = await supabaseClient.from('applications')
      .select('*, jobs(title, company, location, salary), profiles:applicant_id(full_name, email, phone, cv_url, cv_path)')
      .in('job_id', myJobIds)
      .order('created_at', {ascending:false});
    if(error){ console.log('apps error', error); apps = []; }
    else apps = data || [];
  }
  currentApps = apps;
  document.getElementById('appCount').innerText=currentApps.length;
  document.getElementById('jobCount').innerText=currentJobs.length;
  document.getElementById('count').innerText=`(${currentApps.length} applicants)`;
  if(!currentApps.length){ document.getElementById('empty').style.display='block'; document.getElementById('list').innerHTML=''; }
  else{
    document.getElementById('empty').style.display='none';
    document.getElementById('list').innerHTML=currentApps.map((a)=>{
      let name = a.profiles?.full_name || 'Applicant';
      let email = a.profiles?.email || '';
      let phone = a.profiles?.phone || '';
      let title = a.jobs?.title || 'Job';
      let comp = a.jobs?.company || '';
      let cvPath = getCvPath(a);
      let cvName = cvPath ? decodeURIComponent(cvPath.split('/').pop().slice(0,25)) : 'CV';
      let cvHTML = cvPath ? `<button class="btn-cv" onclick="openSecureCV('${cvPath.replace(/'/g,"\\'")}','${a.id}', this)">🔒 View CV — ${cvName} (60min link)</button>` : `<span style="color:#FF8A9D;font-size:12px">No CV — Ask via WhatsApp</span>`;
      let interviewBox=a.interview_date?`<div class="interview-box">📅 <b>Interview:</b> ${a.interview_date} at ${a.interview_time} • ${a.interview_location}<br><span style="font-size:11px;color:#8DB0BF">${a.interview_note||''}</span></div>`:'';
      let badgeClass = a.status=='Shortlisted'?'b-green':a.status=='Hired'?'b-orange':a.status=='Not Selected'?'b-red':a.status=='Interview Scheduled'?'b-green':'b-grey';
      return `<div class="card">
        <div style="display:flex;justify-content:space-between"><b>${name}</b><span class="badge ${badgeClass}">${a.status||'Application Received'}</span></div>
        <div class="meta">Applied for: <b style="color:#fff">${title} — ${comp}</b><br>Date: ${fmt(a.created_at)} • ${email} • WhatsApp: ${phone||'No number'}</div>
        ${progressHTML(a.status||'Application Received')}
        ${interviewBox}
        <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
          <button class="btn btn-green" onclick="updateStatus('${a.id}','Shortlisted',true)">✓ Shortlist + WhatsApp</button>
          <button class="btn btn-green" style="background:#FFB020" onclick="openInterview('${a.id}')">📅 Schedule Interview</button>
          <button class="btn btn-dark" style="background:#1a3a2a;color:#01F9C6" onclick="updateStatus('${a.id}','Hired',true)">🎉 Hire + WhatsApp</button>
          <button class="btn btn-dark" style="background:#3a1a1a;color:#ff9a9a" onclick="updateStatus('${a.id}','Not Selected',true)">Reject</button>
        </div>
        <div style="margin-top:10px;display:flex;gap:6px;flex-wrap:wrap;align-items:center">${cvHTML}<button class="btn btn-whats" style="padding:10px 14px;font-size:12px" onclick="manualWhatsApp('${a.id}')">💬 WhatsApp Candidate</button></div>
        <div style="margin-top:8px;font-size:10px;color:#5a7a8a">🔒 POPIA: Link expires in 60min & is logged</div>
        <label style="font-size:11px;color:#8DB0BF;margin-top:12px;display:block">CHANGE STATUS</label>
        <select class="select" onchange="changeStatusOnly('${a.id}',this.value)">${STATUSES.map(s=>`<option ${a.status==s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`;
    }).join('');
  }
  document.getElementById('jobsList').innerHTML=currentJobs.length?currentJobs.map(j=>`<div class="card"><b>${j.title} • ${j.company}</b><br><span style="color:#8DB0BF;font-size:12px">${j.location||''} • ${j.salary||''} • ${currentApps.filter(a=>a.job_id===j.id).length} applicants</span></div>`).join(''):`<div class="card" style="text-align:center;color:#8DB0BF;font-size:13px">No jobs yet. <a href="post-job.html" style="color:#01F9C6">Post a job →</a></div>`;
}
async function updateStatus(id,newStatus, sendWA){
  let { error } = await supabaseClient.from('applications').update({status:newStatus}).eq('id', id);
  if(error){ alert('Update failed: '+error.message); return; }
  let app = currentApps.find(x=>x.id==id); if(app) app.status=newStatus;
  if(sendWA && app) sendWhatsApp(app, newStatus);
  load();
}
async function changeStatusOnly(id,newStatus){
  await supabaseClient.from('applications').update({status:newStatus}).eq('id', id);
  if(confirm(`Status changed to ${newStatus}. Send WhatsApp to candidate?`)){ let app = currentApps.find(x=>x.id==id); if(app) sendWhatsApp({...app, status:newStatus}, newStatus); }
  load();
}
function manualWhatsApp(id){ let app=currentApps.find(x=>x.id==id); if(app) sendWhatsApp(app, app.status||'Application Received'); }
function openInterview(id){
  currentInterviewId=id;
  let app=currentApps.find(x=>x.id==id);
  let title = app.jobs?.title || '';
  document.getElementById('interviewFor').innerText=`For: ${app.profiles?.full_name || 'Applicant'} — ${title}`;
  let tomorrow=new Date(); tomorrow.setDate(tomorrow.getDate()+1);
  document.getElementById('intDate').value=tomorrow.toISOString().split('T')[0];
  document.getElementById('interviewModal').classList.add('open');
}
function closeInterview(){ document.getElementById('interviewModal').classList.remove('open'); }
async function confirmInterview(){
  let date=document.getElementById('intDate').value;
  let time=document.getElementById('intTime').value;
  let loc=document.getElementById('intLoc').value;
  let note=document.getElementById('intMsg').value;
  if(!date){ alert('Please choose a date'); return; }
  let updates={status:'Interview Scheduled', interview_date:date, interview_time:time, interview_location:loc, interview_note:note};
  let { error } = await supabaseClient.from('applications').update(updates).eq('id', currentInterviewId);
  if(error){ alert('Interview save failed: '+error.message+' — run SQL to add columns'); console.log(error); return; }
  let app = currentApps.find(x=>x.id==currentInterviewId);
  if(app) Object.assign(app, updates);
  closeInterview();
  if(app) sendWhatsApp(app, 'Interview Scheduled');
  load();
}
load();
let _u = getCurrentUser();
if(_u?.id){
  supabaseClient.channel('emp-apps-'+_u.id).on('postgres_changes', {event:'*', schema:'public', table:'applications'}, ()=>load()).subscribe();
}
</script>
</body>
</html>
