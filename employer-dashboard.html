<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#11283a;color:#fff;font-family:Arial}.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}.logo{color:#01F9C6;font-weight:900;font-size:20px}.btn{background:#01F9C6;color:#11283a;border:none;padding:9px 16px;border-radius:10px;font-weight:800}.container{max-width:700px;margin:0 auto;padding:16px}.welcome{background:#1a3446;padding:18px;border-radius:16px;margin-bottom:16px}.card{background:#1a3446;border-radius:18px;padding:18px;margin-bottom:14px}</style></head><body>
<div class="header"><div class="logo">JobWay</div><div><button class="btn" onclick="location.href='post-job.html'">+ Post Job</button><button class="btn" style="background:#fff;margin-left:8px" onclick="localStorage.clear();location.href='login.html'">Logout</button></div></div>
<div class="container"><div class="welcome"><h2>Welcome, mapaya1 👋</h2><p style="color:#9cc2d0">employer.jobway@gmail.com</p><p id="status" style="color:#01F9C6">Loading live jobs...</p></div><div id="jobsList"></div></div>
<script>
const SUPABASE_URL="https://dmxumcjeetphwzvggzzuk.supabase.co";const SUPABASE_KEY="sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const LOCAL_JOBS=[{id:"4eccb0e6-ae3b-4718-a354-fd4fbef0b0b",title:"Cashier",company:"Shoprite",location:"Pretoria",salary:"4500",description:"Cashier position"},{id:"500e9107-790f-4eb0-bfae-ddfc785d67d",title:"Driver",company:"Logistics Co",location:"Pretoria",salary:"6500",description:"Code 10 Driver"},{id:"ccd1dcf4-6641-456e-865b-600538a90c",title:"Waiter",company:"Restaurant",location:"Johannesburg",salary:"3800",description:"Waiter needed"}];
function show(jobs, msg){document.getElementById('status').innerText=msg;document.getElementById('jobsList').innerHTML=jobs.map(j=>`<div class="card"><h3>${j.title}</h3><div>${j.company} • ${j.location}</div><div style="color:#01F9C6;font-weight:700;margin:6px 0">R${j.salary}</div><div>${j.description||''}</div><button class="btn" style="margin-top:8px" onclick="location.href='applications.html?job=${j.id}'">Manage Applications</button></div>`).join('');}
show(LOCAL_JOBS,"✅ Showing your 3 jobs - connecting to live...");
(async()=>{try{const {data,error}=await supabaseClient.from('jobs').select('*').order('created_at',{ascending:false});if(error)throw error;if(data&&data.length>0){show(data,"✅ Live from Supabase ("+data.length+" jobs)");}}catch(e){show(LOCAL_JOBS,"⚠️ Offline mode - showing saved jobs (Supabase is waking up, refresh in 10sec)")}})();
</script></body></html>
