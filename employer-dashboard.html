<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Employer Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#11283a;font-family:Inter,Arial,sans-serif;color:white}
.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px;color:#01F9C6}
.btn{background:#01F9C6;color:#11283a;border:none;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer}
.btn2{background:#fff;color:#11283a;border:none;padding:9px 16px;border-radius:10px;font-weight:800;cursor:pointer;margin-left:8px}
.container{max-width:700px;margin:0 auto;padding:16px}
.welcome{background:#1a3446;padding:18px;border-radius:16px;margin-bottom:16px}
.card{background:#1a3446;border-radius:18px;padding:18px;margin-bottom:14px}
.meta{color:#9cc2d0;font-size:13px;margin-bottom:8px}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.tag{padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700}
.tag-green{background:rgba(1,249,198,0.15);color:#01F9C6}
.tag-red{background:rgba(255,107,107,0.15);color:#ff8a8a}
.salary{color:#7fb5c0;font-weight:700;margin-bottom:6px}
.desc{margin-bottom:12px;font-size:14px;line-height:1.4}
.apply{background:#4ef2d1;color:#0a2231;border:none;padding:10px 18px;border-radius:10px;font-weight:800;cursor:pointer;margin-right:8px}
</style>
</head>
<body>
<div class="header">
<div class="logo">JobWay</div>
<div><button class="btn" onclick="location.href='post-job.html'">+ Post Job</button><button class="btn2" onclick="localStorage.clear();location.href='login.html'">Logout</button></div>
</div>
<div class="container">
<div class="welcome"><h2>Welcome, mapaya1 👋</h2><p id="welcomeEmail" style="color:#9cc2d0">employer.jobway@gmail.com</p></div>
<div id="jobsList">Loading jobs...</div>
</div>
<script>
const SUPABASE_URL="https://dmxumcjeetphwzvggzzuk.supabase.co";
const SUPABASE_KEY="sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
function timeAgo(d){const s=Math.floor((new Date()-new Date(d))/1000);if(s<60)return"Posted just now";if(s<3600)return`Posted ${Math.floor(s/60)}m ago`;if(s<86400)return`Posted ${Math.floor(s/3600)}h ago`;return`Posted ${Math.floor(s/86400)}d ago`;}
async function loadJobs(){
 try{
  const {data:jobs,error}=await supabaseClient.from('jobs').select('*').order('created_at',{ascending:false});
  if(error) throw error;
  let html="";
  for(let job of jobs){
    let count=0; try{const r=await supabaseClient.from('applications').select('*',{count:'exact',head:true}).eq('job_id',job.id); count=r.count||0;}catch(e){}
    const closes = job.closes_at ? new Date(job.closes_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}) : "13 Sept 2026";
    html+=`<div class="card"><h3>${job.title}</h3><div class="meta">${job.company||'Company'} • ${job.location||'Location'} • ${job.type||'Full-time'}</div><div class="tags"><span class="tag tag-green">${timeAgo(job.created_at)}</span><span class="tag tag-red">Closes: ${closes}</span></div><div class="salary">R${job.salary||'4500'}</div><div class="desc">${job.description||''}</div><button class="apply" onclick="location.href='applications.html?job=${job.id}'">Manage (${count})</button><button class="apply" style="background:#1f4a5a;color:#9cc2d0" onclick="location.href='job-details.html?id=${job.id}'">View</button></div>`;
  }
  document.getElementById('jobsList').innerHTML=html||"No jobs yet - Click + Post Job";
 }catch(err){
  document.getElementById('jobsList').innerHTML="<div style='background:#3a1a1a;padding:16px;border-radius:12px'>Error: "+err.message+"<br><br>1. Did you run the SQL? You did! ✅<br>2. If still error, Supabase project may be paused. Go to Supabase Table Editor → Restore project</div>";
 }
}
(async()=>{
  try{
    const {data:{session}} = await supabaseClient.auth.getSession();
    document.getElementById('welcomeEmail').textContent=session?.user?.email||localStorage.getItem('jobway_email')||'employer.jobway@gmail.com';
  }catch(e){document.getElementById('welcomeEmail').textContent=localStorage.getItem('jobway_email')||'employer.jobway@gmail.com';}
  loadJobs();
})();
</script>
</body>
</html>
