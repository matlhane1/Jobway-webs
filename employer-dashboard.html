<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employer Dashboard - JobWay</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bright:#01F9C6;
    --navy:#20576E;
    --dark:#0F2835;
    --bg:#0F2230;
    --top:#0A1F2E;
    --card:#1A3341;
    --input:#0C2532;
    --muted:#8FB3C1;
    --white:#FFFFFF;
    --danger:#FF6B6B;
    --warning:#FFD166;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Plus Jakarta Sans',sans-serif;
    background:var(--bg);
    color:#fff;
    min-height:100vh;
}

/* =========================
   TOP BAR
========================= */

.top{
    background:var(--top);
    border-bottom:1px solid rgba(1,249,198,.15);
    padding:14px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    position:sticky;
    top:0;
    z-index:100;
}

.logo{
    font-family:'Space Grotesk',sans-serif;
    font-size:21px;
    font-weight:800;
}

.logo span{
    color:var(--bright);
}

.top-right{
    display:flex;
    align-items:center;
    gap:12px;
}

.email{
    color:var(--muted);
    font-size:11px;
    max-width:260px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.btn{
    border:0;
    border-radius:999px;
    padding:10px 17px;
    font-weight:800;
    cursor:pointer;
    font-family:inherit;
}

.btn-white{
    background:#fff;
    color:var(--navy);
}

.btn-bright{
    background:var(--bright);
    color:#08231C;
}

.btn:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* =========================
   PAGE
========================= */

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:28px 20px 50px;
}

.welcome{
    margin-bottom:22px;
}

.welcome h1{
    font-family:'Space Grotesk',sans-serif;
    font-size:30px;
    font-weight:800;
}

.welcome p{
    color:var(--muted);
    font-size:13px;
    margin-top:7px;
}

/* =========================
   STATUS
========================= */

.status{
    display:none;
    border-radius:12px;
    padding:13px 15px;
    margin-bottom:18px;
    font-size:12px;
    font-weight:700;
}

.status.success{
    display:block;
    background:rgba(1,249,198,.08);
    border:1px solid rgba(1,249,198,.25);
    color:var(--bright);
}

.status.error{
    display:block;
    background:rgba(255,107,107,.08);
    border:1px solid rgba(255,107,107,.25);
    color:#FF9A9A;
}

/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:55px 20px;
    color:var(--muted);
    font-size:13px;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid rgba(255,255,255,.1);
    border-top-color:var(--bright);
    border-radius:50%;
    margin:0 auto 15px;
    animation:spin .8s linear infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================
   STATS
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:14px;
    margin-bottom:20px;
}

.stat{
    background:var(--card);
    border:1px solid rgba(255,255,255,.07);
    border-radius:17px;
    padding:19px;
}

.stat-label{
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
}

.stat-value{
    font-family:'Space Grotesk',sans-serif;
    font-size:29px;
    font-weight:800;
    margin-top:8px;
}

.green{
    color:var(--bright);
}

/* =========================
   GRID
========================= */

.grid{
    display:grid;
    grid-template-columns:minmax(0,1.4fr) minmax(280px,.6fr);
    gap:18px;
}

.card{
    background:var(--card);
    border:1px solid rgba(255,255,255,.08);
    border-radius:18px;
    padding:20px;
    margin-bottom:18px;
}

.card-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:18px;
    font-weight:800;
}

.card-subtitle{
    color:var(--muted);
    font-size:11px;
    margin-top:5px;
}

/* =========================
   FORM
========================= */

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

label{
    display:block;
    color:var(--muted);
    font-size:10px;
    font-weight:800;
    letter-spacing:.08em;
    margin-top:13px;
    margin-bottom:6px;
    text-transform:uppercase;
}

input,
textarea{
    width:100%;
    background:var(--input);
    border:1px solid rgba(255,255,255,.11);
    border-radius:10px;
    padding:12px;
    color:#fff;
    outline:none;
    font-family:inherit;
    font-size:13px;
}

input:focus,
textarea:focus{
    border-color:var(--bright);
}

textarea{
    resize:vertical;
    min-height:120px;
}

    width:100%;
    margin-top:15p
