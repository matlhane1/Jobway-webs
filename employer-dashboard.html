<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#11283a;color:#fff;font-family:Arial}.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.logo{color:#01F9C6;font-weight:900;font-size:24px}.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a;margin-left:8px}.container{max-width:600px;margin:0 auto;padding:16px}.welcome{background:#1a3446;padding:20px;border-radius:20px;margin-bottom:16px}.welcome h2{font-size:22px}.welcome p{color:#8fb3c1;font-size:14px;margin-top:4px}.card{background:#1a3446;border-radius:22px;padding:18px;margin-bottom:14px}.meta{color:#8fb3c1;font-size:13px;margin:6px 0}.tags{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.tag{padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}.tag-green{background:rgba(1,249,198,.15);color:#01F9C6}.tag-red{background:rgba(255,107,107,.15);color:#ff9a9a}.salary{color:#8ec8d6;font-weight:800;margin:6px 0}.desc{margin:8px 0;color:#d0e3ea;font-size:14px}.btn-manage{background:#01F9C6;color:#0d1f2d;border:none;padding:10px 18px;border-radius:12px;font-weight:800;margin-top:8px}</style></head><body>
<div class="header"><div class="logo">JobWay</div><div><button class="btn btn-green" onclick="location.href='post-job.html'">+ Post Job</button><button class="btn btn-white" onclick="localStorage.clear();location.href='login.html'">Logout</button></div></div>
<div class="container"><div class="welcome"><h2>Welcome, mapaya1 👋</h2><p>employer.jobway@gmail.com</p></div><div id="jobsList"></div></div>
<script>
const supa=supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
const FALLBACK=[
{title:"Cashier",company:"Shoprite",loc:"Thohoyandou",type:"Full-time",salary:"R4500",posted:"Posted 4h ago",closes:"Closes: 13 Sept 2026",desc:"Looking for cashier with matric",id:"1"},
{title:"Waiter",company:"Mugg & Bean",loc:"Makhado",type:"Part-time",salary:"R3500 + tips",posted:"Posted 4h ago",closes:"Closes: 13 Sept 2026",desc:"Weekend waiter needed",id:"2"},
{title:"Driver",company:"Spar",loc:"Louis Trichardt",type:"Full-time",salary:"R6000",posted:"Posted 4h ago",closes:"Closes: 13 Sept 2026",desc:"Code 10 driver with PDP needed",id:"3"}
];
function draw(jobs){
 document.getElementById('jobsList').innerHTML=jobs.map(j=>`<div class="card"><h3>${j.title}</h3><div class="meta">${j.company} • ${j.loc||j.location} • ${j.type||'Full-time'}</div><div class="tags"><span class="tag tag-green">${j.posted||'Posted just now'}</span><span class="tag tag-red">${j.closes||'Closes: 13 Sept 2026'}</span></div><div class="salary">${j.salary}</div><div class="desc">${j.description||j.desc}</div><button class="btn-manage" onclick="location.href='applications.html?job=${j.id}'">Manage Applications</button></div>`).join('');
}
draw(FALLBACK);
(async()=>{try{const {data}=await supa.from('jobs').select('*').order('created_at',{ascending:false});if(data&&data.length){draw(data.map(d=>({title:d.title,company:d.company,loc:d.location,type:d.job_type||'Full-time',salary:d.salary?'R'+d.salary:'R4500',posted:'Posted just now',closes:'Closes: 13 Sept 2026',desc:d.description,id:d.id})));}}catch(e){}})();
</script></body></html>
