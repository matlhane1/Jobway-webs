<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Applications - JobWay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#11283a;color:#fff;font-family:Arial}.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#01F9C6;font-weight:900;font-size:22px;cursor:pointer}.btn{border:none;border-radius:10px;padding:9px 14px;font-weight:800;cursor:pointer;font-size:12px;margin:3px}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a}.btn-dark{background:#223f54;color:#fff}.btn-red{background:rgba(255,107,107,.15);color:#ff9a9a;border:1px solid #ff6b6b}.container{max-width:650px;margin:0 auto;padding:16px}.card{background:#1a3446;border-radius:20px;padding:18px;margin-bottom:14px}.meta{color:#8fb3c1;font-size:12px;margin:5px 0}.badge{padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.badge-review{background:rgba(255,193,7,.2);color:#ffc107}.badge-approved{background:#01F9C6;color:#11283a}.badge-reject{background:rgba(255,107,107,.2);color:#ff9a9a}.badge-short{background:rgba(1,249,198,.2);color:#01F9C6}.interview-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);display:none;justify-content:center;align-items:center;z-index:999;padding:16px}.modal-box{background:#1a3446;border-radius:22px;padding:22px;width:100%;max-width:400px;border:1px solid rgba(1,249,198,.3)}.input{width:100%;background:#11283a;border:1px solid #2a4a5c;color:#fff;padding:12px;border-radius:10px;margin:6px 0;box-sizing:border-box}.premium-btn{background:linear-gradient(135deg,#01F9C6,#00d4a8);color:#11283a;padding:14px;border-radius:14px;font-weight:900;width:100%;border:none;cursor:pointer;margin-top:10px}</style></head><body>
<div class="header"><div class="logo" onclick="location.href='employer-dashboard.html'">JobWay</div><button class="btn btn-white" onclick="location.href='employer-dashboard.html'">← Back</button></div>
<div class="container"><h2 id="jobTitle">Manage Applications</h2><p class="meta" id="jobSub"></p><div id="list"></div></div>
<div class="interview-modal" id="interviewModal"><div class="modal-box"><h3 style="color:#01F9C6;margin:0">✅ Candidate Approved</h3><p style="color:#8fb3c1;font-size:13px">This candidate has been approved for an interview. Please select a date and time to schedule the interview.</p><label class="meta">Interview Date</label><input type="date" id="intDate" class="input"><label class="meta">Time</label><input type="time" id="intTime" class="input" value="10:00"><label class="meta">Location / Meet Link</label><input type="text" id="intLoc" class="input" placeholder="Thohoyandou Office"><button class="premium-btn" onclick="confirmInterview()">📅 Schedule Interview → Send Email + WhatsApp</button><button class="btn btn-dark" style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button></div></div>
<script>
const supa=supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
const params=new URLSearchParams(location.search); const title=params.get('title')||'Cashier';
document.getElementById('jobTitle').innerText=title+' - Applications';
let applicants=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');
if(applicants.length==0){applicants=[{id:'demo1',name:'Thabo M.',email:'thabo@email.com',whatsapp:'0721234567',match:95,job_title:title,status:'Applied',created_at:new Date().toISOString()},{id:'demo2',name:'Sarah K.',email:'sarah@email.com',whatsapp:'0829876543',match:88,job_title:title,status:'Applied',created_at:new Date().toISOString()}];}
let currentId=null;
function sendNotif(type,a,extra={}){let notifs=JSON.parse(localStorage.getItem('jobway_notifications')||'[]'); let msgs={application_received:`✅ Application for ${title} received`,under_review:`👀 Under Review - ${title}`,approved:`🎉 Approved for ${title}!`,shortlisted:`⭐ Shortlisted for ${title}`,rejected:`Update: ${title}`,interview_scheduled:`📅 Interview Scheduled: ${title} on ${extra.date} at ${extra.time}`,interview_reminder:`⏰ Reminder: Interview tomorrow for ${title}`}; notifs.unshift({type,title:msgs[type],message:msgs[type]+' - Email + WhatsApp sent',date:new Date().toISOString()}); localStorage.setItem('jobway_notifications',JSON.stringify(notifs)); let applied=JSON.parse(localStorage.getItem('jobway_applied')||'[]'); applied=applied.map(j=>{if(j.title==title||j.job_title==title){j.status=extra.status||a.status; if(extra.date){j.interview_date=extra.date;j.interview_time=extra.time;j.interview_location=extra.location;}}return j}); localStorage.setItem('jobway_applied',JSON.stringify(applied));}
function render(){document.getElementById('jobSub').innerText=applicants.length+' applicants'; document.getElementById('list').innerHTML=applicants.map(a=>{let isApproved=a.status=='Approved'||a.status=='Shortlisted'; return `<div class="card"><div style="display:flex;justify-content:space-between"><h3 style="margin:0">${a.name} • ${a.match}%</h3><span class="badge ${a.status=='Approved'?'badge-approved':a.status=='Rejected'?'badge-reject':a.status=='Shortlisted'?'badge-short':'badge-review'}">${a.status}</span></div><div class="meta">${a.email} • ${a.whatsapp}</div>${a.interview_date?`<div style="background:rgba(1,249,198,.1);border:1px solid #01F9C6;border-radius:12px;padding:10px;margin-top:10px;font-size:13px"><b>📅 ${a.interview_date} at ${a.interview_time}</b><br>${a.interview_location}</div>`:''}<div style="margin-top:12px"><button class="btn btn-dark" onclick="updateStatus('${a.id}','Under Review')">Under Review</button><button class="btn btn-white" onclick="updateStatus('${a.id}','Approved')">✓ Approve</button><button class="btn btn-red" onclick="updateStatus('${a.id}','Rejected')">✕ Reject</button>${isApproved?`<button class="btn btn-green" onclick="openSchedule('${a.id}')">📅 Schedule Interview</button>`:''}</div></div>`}).join('');}
function updateStatus(id,status){let idx=applicants.findIndex(x=>x.id==id); applicants[idx].status=status; localStorage.setItem('jobway_all_applications',JSON.stringify(applicants)); if(status=='Under Review')sendNotif('under_review',applicants[idx],{status}); if(status=='Approved')sendNotif('approved',applicants[idx],{status}); if(status=='Rejected')sendNotif('rejected',applicants[idx],{status}); if(status=='Approved'){openSchedule(id);}else{render(); alert(`✅ ${status} - Email + WhatsApp sent!`);} }
function openSchedule(id){currentId=id; document.getElementById('interviewModal').style.display='flex';}
function closeModal(){document.getElementById('interviewModal').style.display='none';}
function confirmInterview(){let date=document.getElementById('intDate').value; let time=document.getElementById('intTime').value; let loc=document.getElementById('intLoc').value||'Thohoyandou Office'; if(!date){alert('Select date');return;} let idx=applicants.findIndex(x=>x.id==currentId); applicants[idx].interview_date=date; applicants[idx].interview_time=time; applicants[idx].interview_location=loc; applicants[idx].status='Shortlisted'; localStorage.setItem('jobway_all_applications',JSON.stringify(applicants)); sendNotif('interview_scheduled',applicants[idx],{date,time,location:loc,status:'Shortlisted'}); closeModal(); render(); alert(`✅ Interview Scheduled!\n📧 Email sent\n💬 WhatsApp sent\n⏰ Reminder will be sent automatically 24h before`); setTimeout(()=>{sendNotif('interview_reminder',applicants[idx],{date,time})},3000);}
render();
</script></body></html>
