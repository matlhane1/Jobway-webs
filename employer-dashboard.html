<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employer Dashboard - JobWay</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#11283a;color:#fff;font-family:Inter,Arial,sans-serif}
.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;border-bottom:1px solid rgba(255,255,255,.06)}
.logo{color:#01F9C6;font-weight:900;font-size:22px;cursor:pointer;letter-spacing:-0.5px}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;transition:.2s}
.btn-green{background:#01F9C6;color:#11283a}
.btn-white{background:#fff;color:#11283a}
.btn-red{background:#ff5a5a;color:#fff}
.btn:hover{transform:translateY(-1px);opacity:.9}
.container{max-width:720px;margin:0 auto;padding:18px}
.card{background:#1a3446;border-radius:20px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,.05)}
.input{width:100%;background:#11283a;border:1px solid #2a4a5c;color:#fff;padding:12px 14px;border-radius:12px;margin:6px 0;outline:none;font-size:14px}
.input:focus{border-color:#01F9C6}
.row{display:flex;gap:8px}
.row.input{flex:1}
.stat{display:flex;gap:10px;margin:14px 0}
.stat div{flex:1;background:#1a3446;border-radius:16px;padding:14px;text-align:center;border:1px solid rgba(255,255,255,.05)}
.stat h2{margin:0;color:#01F9C6}
.stat small{color:#8fb3c1}
.logo-box{background:rgba(1,249,198,.07);border:1.5px dashed #01F9C6;border-radius:16px;padding:16px;text-align:center;margin-bottom:12px}
.logo-preview{width:84px;height:84px;background:#11283a;border-radius:16px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden;border:1px solid #2a4a5c}
.job-logo{width:52px;height:52px;background:#11283a;border-radius:12px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;border:1px solid rgba(255,255,255,.06);font-size:22px}
.job-head{display:flex;gap:12px;align-items:center}
.meta{color:#8fb3c1;font-size:13px;margin:6px 0;line-height:1.4}
.badge{background:#01F9C6;color:#11283a;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800}
.error{color:#ff6b6b;font-size:12px;margin-top:6px;display:none;background:rgba(255,90,90,.1);padding:8px;border-radius:8px}
</style>
</head>
<body>

<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay Employer</div>
<div style="display:flex;gap:8px">
<button class="btn btn-white" onclick="location.href='index.html'">← Jobs</button>
<button class="btn btn-green" onclick="openPost()">+ Post Job</button>
</div>
</div>

<div class="container">

<div class="stat">
<div><h2 id="totalJobs">0</h2><small>Total Jobs</small></div>
<div><h2 id="totalApps">0</h2><small>Applications</small></div>
<div><h2 id="shortlisted">0</h2><small>Shortlisted</small></div>
</div>

<!-- POST FORM -->
<div id="postForm" class="card" style="display:none">
<h3 style="margin:0 0 12px">📝 Post New Job</h3>

<div class="logo-box">
<div id="logoPreview" class="logo-preview">🏢</div>
<input type="file" id="p_logoFile" accept="image/png,image/jpeg,image/jpg,image/webp" style="display:none" onchange="handleLogo(this)">
<button type="button" class="btn btn-white" onclick="document.getElementById('p_logoFile').click()">📷 Upload Company Logo *</button>
<div style="color:#8fb3c1;font-size:11px;margin-top:8px">Required • PNG/JPG/WEBP • Max 2MB • Shows on job card</div>
<div id="logoError" class="error">❌ Please upload company logo to continue</div>
<div id="logoOk" style="color:#01F9C6;font-size:12px;margin-top:6px;display:none">✅ Logo uploaded</div>
</div>

<input class="input" id="p_title" placeholder="Job Title * e.g. Cashier">
<input class="input" id="p_company" placeholder="Company Name * e.g. Shoprite">
<div class="row">
<select class="input" id="p_location"><option>Thohoyandou</option><option>Makhado</option><option>Polokwane</option><option>Johannesburg</option><option>Pretoria</option></select>
<select class="input" id="p_type"><option>Full-time</option><option>Part-time</option><option>Contract</option></select>
</div>
<div class="row">
<input class="input" id="p_salary" placeholder="Salary e.g. R4500">
<select class="input" id="p_level"><option>Entry Level</option><option>Mid Level</option><option>Senior</option></select>
</div>
<textarea class="input" id="p_desc" rows="3" placeholder="Job Description * What will candidate do?"></textarea>
<div class="row" style="margin-top:8px">
<button class="btn btn-green" style="flex:1" onclick="saveJob()">✅ Publish Job</button>
<button class="btn btn-white" style="flex:1" onclick="closePost()">Cancel</button>
</div>
</div>

<h3 style="margin:18px 0 10px">📋 My Posted Jobs</h3>
<div id="jobsList"></div>

</div>

<script>
let uploadedLogo = null;

function getJobs(){return JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]');}
function saveJobs(j){localStorage.setItem('jobway_employer_jobs',JSON.stringify(j));}
function getAllApps(){return JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');}

function openPost(){
  document.getElementById('postForm').style.display='block';
  document.getElementById('postForm').scrollIntoView({behavior:'smooth'});
}
function closePost(){
  document.getElementById('postForm').style.display='none';
  delete document.getElementById('postForm').dataset.editId;
  clearForm();
}
function clearForm(){
  document.getElementById('p_title').value='';
  document.getElementById('p_company').value='';
  document.getElementById('p_salary').value='';
  document.getElementById('p_desc').value='';
  uploadedLogo=null;
  document.getElementById('logoPreview').innerHTML='🏢';
  document.getElementById('logoError').style.display='none';
  document.getElementById('logoOk').style.display='none';
  document.getElementById('p_logoFile').value='';
}

function handleLogo(input){
  let file = input.files[0];
  if(!file) return;
  if(file.size > 2*1024*1024){ alert('Logo too big! Max 2MB please'); return; }
  let reader = new FileReader();
  reader.onload = function(e){
    uploadedLogo = e.target.result;
    document.getElementById('logoPreview').innerHTML = `<img src="${uploadedLogo}" style="width:100%;height:100%;object-fit:cover">`;
    document.getElementById('logoError').style.display='none';
    document.getElementById('logoOk').style.display='block';
  };
  reader.readAsDataURL(file);
}

function saveJob(){
  let title = document.getElementById('p_title').value.trim();
  let company = document.getElementById('p_company').value.trim();
  let desc = document.getElementById('p_desc').value.trim();
  let editId = document.getElementById('postForm').dataset.editId;

  if(!title){ alert('Enter Job Title'); return; }
  if(!company){ alert('Enter Company Name'); return; }
  if(!desc){ alert('Enter Job Description'); return; }

  let existingJobs = getJobs();
  let existingLogo = editId? existingJobs.find(j=>j.id==editId)?.logo : null;
  let finalLogo = uploadedLogo || existingLogo;

  if(!finalLogo){
    document.getElementById('logoError').style.display='block';
    alert('❌ Company Logo is REQUIRED!\nPlease click "Upload Company Logo" first');
    return;
  }

  let newJob={
    id: editId? parseInt(editId) : Date.now(),
    title: title,
    company: company,
    location: document.getElementById('p_location').value,
    type: document.getElementById('p_type').value,
    level: document.getElementById('p_level').value,
    salary: document.getElementById('p_salary').value||'R4000',
    desc: desc,
    logo: finalLogo,
    missing:'None',
    match:95,
    tip:'New job posted!'
  };

  if(editId){
    existingJobs = existingJobs.map(j=> j.id==editId? newJob : j);
  } else {
    existingJobs.unshift(newJob);
  }
  saveJobs(existingJobs);
  closePost();
  render();
  alert('✅ Job Published with Logo!');
}

function editJob(id){
  let job=getJobs().find(j=>j.id==id);
  if(!job) return;
  document.getElementById('p_title').value=job.title;
  document.getElementById('p_company').value=job.company;
  document.getElementById('p_location').value=job.location;
  document.getElementById('p_type').value=job.type;
  document.getElementById('p_salary').value=job.salary;
  document.getElementById('p_level').value=job.level;
  document.getElementById('p_desc').value=job.desc;
  uploadedLogo = job.logo;
  if(job.logo){
    document.getElementById('logoPreview').innerHTML = `<img src="${job.logo}" style="width:100%;height:100%;object-fit:cover">`;
    document.getElementById('logoOk').style.display='block';
  }
  document.getElementById('postForm').dataset.editId=id;
  openPost();
}
function deleteJob(id){
  if(!confirm('Delete this job? This cannot be undone.')) return;
  saveJobs(getJobs().filter(j=>j.id!=id));
  render();
}

function render(){
  let jobs=getJobs();
  let apps=getAllApps();
  document.getElementById('totalJobs').innerText=jobs.length;
  document.getElementById('totalApps').innerText=apps.length;
  document.getElementById('shortlisted').innerText=apps.filter(a=>a.status=='Shortlisted'||a.status=='Approved').length;

  if(jobs.length==0){
    document.getElementById('jobsList').innerHTML=`<div class="card" style="text-align:center;color:#8fb3c1">No jobs posted yet.<br>Click <b style="color:#01F9C6">+ Post Job</b> to start</div>`;
    return;
  }
  document.getElementById('jobsList').innerHTML=jobs.map(j=>{
    let count=apps.filter(a=>a.job_title==j.title).length;
    return `<div class="card">
      <div class="job-head">
        <div class="job-logo">${j.logo?`<img src="${j.logo}" style="width:100%;height:100%;object-fit:cover">`:'🏢'}</div>
        <div style="flex:1">
          <h3 style="margin:0;font-size:16px">${j.title}</h3>
          <div style="font-size:13px;color:#01F9C6;font-weight:700">${j.company}</div>
          <div class="meta">${j.location} • ${j.type} • ${j.salary} • <span class="badge">${count} Apps</span></div>
        </div>
      </div>
      <div class="meta" style="margin-top:10px">${j.desc}</div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-green" style="flex:1.5" onclick="location.href='employer-applications.html?title=${encodeURIComponent(j.title)}'">👁️ View Applications (${count})</button>
        <button class="btn btn-white" onclick="editJob(${j.id})">✏️</button>
        <button class="btn btn-red" onclick="deleteJob(${j.id})">🗑️</button>
      </div>
    </div>`;
  }).join('');
}
render();
</script>
</body>
</html>
