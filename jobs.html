<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Jobs in SA | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(1,249,198,0.15);position:sticky;top:0;z-index:10}
.logo-text{font-weight:900;color:#01F9C6;font-size:20px;font-family:'Space Grotesk',sans-serif}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.nav-cta{display:flex;gap:8px;align-items:center}
.container{max-width:700px;margin:0 auto;padding:14px}
.trust-bar{background:rgba(1,249,198,0.08);border:1px solid rgba(1,249,198,0.18);border-radius:12px;padding:10px 14px;font-size:11.5px;color:#A8C8D0;text-align:center;margin:12px 0}
.trust-bar b{color:#01F9C6}
.filters{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.select{background:#0F2230;border:1px solid #25475A;color:#fff;padding:12px;border-radius:10px;width:100%;font-size:13px}
.btn-filter{padding:11px;border-radius:999px;font-weight:800;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px}
.btn-wa{background:#1A3E52;color:#fff;border:1px solid rgba(1,249,198,0.2)}
.btn-track{background:#01F9C6;color:#0A1F2E}
.card{background:#11283A;border:1px solid rgba(255,255,255,0.08);border-radius:18px;padding:16px;margin-bottom:12px;position:relative}
.company-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo-img{width:46px;height:46px;object-fit:contain;background:white;border-radius:10px;padding:6px}
.logo-fallback{width:46px;height:46px;background:#0F2230;border:1px solid rgba(255,255,255,0.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#01F9C6}
.job-title{font-size:17px;font-weight:800;line-height:1.2}
.job-meta{color:#8DB0BF;font-size:12px;margin:4px 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);color:#A8C8D0;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge-green{background:rgba(1,249,198,0.12);color:#01F9C6;border-color:rgba(1,249,198,0.2)}
.desc{color:#C8DDE3;font-size:13px;margin:8px 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-apply{background:#01F9C6;color:#08231C;border:none;border-radius:999px;padding:11px 18px;font-weight:900;cursor:pointer;flex:1;font-size:13px}
.btn-detail{background:#1A3E52;color:#fff;border:1px solid rgba(255,255,255,0.1);border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;flex:1;font-size:13px}
.applied-badge{position:absolute;top:12px;right:12px;background:#30BA8F;color:#fff;padding:4px 10px;border-radius:999px;font-size:10px;font-weight:800}
</style>
</head>
<body>
<div class="header">
<div class="logo-text" onclick="location.href='index.html'" style="cursor:pointer">JobWay</div>
<div class="nav-cta">
<button class="btn btn-dark" onclick="location.href='index.html'">Home</button>
<button class="btn btn-dark" onclick="location.href='profile.html'">My CV</button>
<button class="btn btn-green" onclick="location.href='employer-dashboard.html'">Post a Job</button>
</div>
</div>

<div class="container">
<div class="trust-bar">All jobs verified manually • <b>Never pay to apply</b> • Questions? WhatsApp <b>079 060 8952</b> (Mon-Fri 8am-6pm)</div>

<div class="filters">
<select class="select" id="loc" onchange="render()"><option value="">All Provinces</option><option>Gauteng</option><option>Western Cape</option><option>KZN</option><option>Eastern Cape</option><option>Free State</option></select>
<select class="select" id="type" onchange="render()"><option value="">All Types</option><option>Full-time</option><option>Part-time</option><option>Contract</option></select>
<select class="select" id="exp" onchange="render()"><option value="">Any Experience</option><option>No experience</option><option>1+ years</option><option>Matric only</option></select>
<select class="select" id="salary" onchange="render()"><option value="">Any Salary</option><option>R3500</option><option>R5000</option><option>R8000</option></select>
<button class="btn-filter btn-wa" onclick="subscribeWA()">Get jobs on WhatsApp</button>
<button class="btn-filter btn-track" onclick="location.href='seeker-dashboard.html'">Track my applications</button>
</div>
<div id="count" style="font-size:12px;color:#8DB0BF;margin:14px 2px"></div>
<div id="list" style="margin-top:8px"></div>
</div>

<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
function getEmployerJobs(){return JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]')}
function getDefaults(){return [
{title:'Cashier',company:'Shoprite',location:'Pretoria North, Gauteng',city:'Gauteng',type:'Full-time',salaryText:'R5,500 - R6,800',desc:'Till operation, customer service, stock. Matric required. No experience needed, training provided.',duration:'Permanent',postedAt:Date.now()-4*3600000,closingDate:'13 Sept 2026',logo:null},
{title:'Retail Assistant',company:'Boxer Superstores',location:'Umlazi, KZN',city:'KZN',type:'Part-time',salaryText:'R4,600 + benefits',desc:'Assist customers, pack shelves, keep store clean. Must be able to work weekends.',duration:'3 Months',postedAt:Date.now()-6*3600000,closingDate:'15 Sept 2026',logo:null},
{title:'General Worker',company:'Takealot Warehouse',location:'Cape Town, Western Cape',city:'Western Cape',type:'Full-time',salaryText:'R5,000',desc:'Picking, packing, loading. Must be fit and reliable. Immediate start.',duration:'Permanent',postedAt:Date.now()-2*3600000,closingDate:'20 Sept 2026',logo:null}
]}

function timeAgo(ts){let h=Math.floor((Date.now()-ts)/3600000);if(h<1)return'Posted today';if(h<24)return`Posted ${h}h ago`;return`Posted ${Math.floor(h/24)} days ago`;}
function initials(name){return name.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}

let allJobs = [];
async function fetchSupabaseJobs(){
  try{
    const { data } = await supabaseClient.from('jobs').select('*').order('created_at',{ascending:false}).limit(100);
    if(!data) return [];
    return data.map(j=>({
      title:j.title,company:j.company,location:j.location,city:j.location||'Gauteng',type:j.type||'Full-time',
      salaryText:j.salary||'Market related',desc:j.description||'',duration:'Permanent',
      postedAt:j.created_at? new Date(j.created_at).getTime():Date.now(),
      closingDate:j.closing_date? new Date(j.closing_date).toLocaleDateString('en-ZA',{day:'2-digit',month:'short'}):'30 Sept',
      logo:j.logo||j.logo_url||null,id:j.id
    }));
  }catch(e){return []}
}

async function render(){
 let qCity=document.getElementById('loc').value;
 let qType=document.getElementById('type').value;
 let supaJobs = await fetchSupabaseJobs();
 let localJobs = getEmployerJobs();
 let jobs=[...supaJobs,...localJobs,...getDefaults()];
 let seen=new Set(); jobs=jobs.filter(j=>{const k=j.title+'|'+j.company; if(seen.has(k)) return false; seen.add(k); return true;});
 if(qCity)jobs=jobs.filter(j=>(j.location||'').includes(qCity));
 if(qType)jobs=jobs.filter(j=>j.type===qType);

 document.getElementById('count').innerText = `${jobs.length} jobs found${qCity?' in '+qCity:''} • Updated today`;
 let apps=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');

 document.getElementById('list').innerHTML=jobs.map(j=>{
  let posted=timeAgo(j.postedAt);
  let isApplied = apps.some(a=>a.job_title==j.title && a.company==j.company);
  let logoHtml = j.logo? `<img class="logo-img" src="${j.logo}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="logo-fallback" style="display:none">${initials(j.company)}</div>` : `<div class="logo-fallback">${initials(j.company)}</div>`;
  return `<div class="card">
    ${isApplied?'<div class="applied-badge">APPLIED</div>':''}
    <div class="company-row">
      ${logoHtml}
      <div style="flex:1"><div style="font-weight:800;font-size:13px">${j.company}</div><div class="job-meta">${j.location} • ${j.type}</div></div>
    </div>
    <div class="job-title">${j.title}</div>
    <div class="badges"><span class="badge badge-green">${posted}</span><span class="badge">Closes: ${j.closingDate}</span><span class="badge">${j.salaryText}</span></div>
    <div class="desc">${j.desc}</div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn-apply" ${isApplied?'disabled style="opacity:0.6"':''} onclick="applyJob('${j.title.replace(/'/g,"\\'")}','${j.company.replace(/'/g,"\\'")}')">${isApplied?'Applied ✓':'Apply now'}</button>
      <button class="btn-detail" onclick="alert('${j.title}\\n${j.company}\\n\\n${j.desc.replace(/'/g,"")}')">View details</button>
    </div>
  </div>`
 }).join('');
}

function applyJob(title,company){
 let profile=JSON.parse(localStorage.getItem('jobway_profile')||'{}');
 if(!profile.cvName ||!profile.fullName){
   if(confirm('You need a CV to apply. Upload CV in My Profile?')){
     localStorage.setItem('jobway_pending_job',JSON.stringify({title,company}));
     location.href='profile.html';
   }
   return;
 }
 let apps=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');
 if(apps.some(a=>a.job_title==title && a.company==company)){
   location.href='seeker-dashboard.html'; return;
 }
 apps.unshift({id:Date.now().toString(),job_title:title,company:company,name:profile.fullName,email:profile.email,whatsapp:profile.whatsapp,date:new Date().toISOString(),status:'Application Received',cvName:profile.cvName,hasCV:true});
 localStorage.setItem('jobway_all_applications',JSON.stringify(apps));
 alert(`Applied for ${title} at ${company}. Track in My Applications.`);
 location.href='seeker-dashboard.html';
}
function subscribeWA(){let wa=prompt('Your WhatsApp number for alerts (e.g. 0791234567):');if(!wa)return;localStorage.setItem('jobway_wa_alerts',wa);alert('You will get jobs on WhatsApp from 079 060 8952. We will not spam.');}
render();
</script>
</body>
</html>
