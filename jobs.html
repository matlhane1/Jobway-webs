<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Jobs in SA | JobWay.co.za</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0F2835;color:#fff}
.header{background:#0A1F2E;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1a3a4a;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:20px;cursor:pointer}
.btn{border:0;border-radius:20px;padding:10px 14px;font-weight:800;font-size:12px;cursor:pointer}
.btn-dark{background:#1A3E52;color:#A8C8D0}
.btn-green{background:#01F9C6;color:#0A1F2E}
.container{max-width:480px;margin:0 auto;padding:12px}
.trust{background:#11283A;border:1px solid #1e4a5e;border-radius:10px;padding:10px;font-size:11px;color:#A8C8D0;text-align:center;margin:10px 0}
.trust b{color:#01F9C6}
.filters{background:#11283A;border:1px solid #1e3a4a;border-radius:12px;padding:10px}
select{width:100%;background:#0F2230;border:1px solid #25475A;color:#fff;padding:11px;border-radius:8px;margin:4px 0;font-size:13px}
.btn-filter{width:100%;padding:11px;border-radius:20px;font-weight:800;margin:4px 0;font-size:13px;border:0;cursor:pointer}
.btn-wa{background:#1A3E52;color:#fff}
.btn-track{background:#01F9C6;color:#0A1F2E}
.card{background:#11283A;border:1px solid #1e3a4a;border-radius:14px;padding:14px;margin:10px 0}
.company{font-weight:800;font-size:13px}
.meta{color:#8DB0BF;font-size:12px;margin:2px 0}
.job-title{font-size:16px;font-weight:800;line-height:1.2;margin:6px 0}
.badge{display:inline-block;background:#0F2230;color:#A8C8D0;padding:4px 8px;border-radius:20px;font-size:11px;margin:3px 2px 3px 0}
.badge-green{color:#01F9C6}
.desc{color:#C8DDE3;font-size:13px;line-height:1.5;margin:8px 0}
.btn-apply{background:#01F9C6;color:#08231C;border:0;border-radius:20px;padding:11px;font-weight:900;width:100%;font-size:13px;margin-top:8px;display:block;text-align:center;cursor:pointer}
.btn-apply:disabled{background:#2a4a4a;color:#8DB0BF}
.btn-detail{background:#1A3E52;color:#fff;border:1px solid #2a4a5e;border-radius:20px;padding:11px;font-weight:700;width:100%;font-size:13px;margin-top:6px;cursor:pointer}
.need-cv{background:#2a2a1a;border:1px solid #5a4a2a;border-radius:10px;padding:10px;font-size:12px;color:#FFD166;margin-top:8px;text-align:center}
</style>
</head>
<body>
<div class="header">
<div class="logo" onclick="location.href='index.html'">JobWay</div>
<div id="headerBtns">
<button class="btn btn-dark" onclick="location.href='index.html'">Home</button>
<button class="btn btn-dark" id="profileBtn" onclick="location.href='profile.html'" style="display:none">Profile</button>
<button class="btn btn-green" onclick="location.href='track-applications.html'">Track</button>
</div>
</div>

<div class="container">
<div class="trust">All jobs verified • <b>Never pay to apply</b> • WhatsApp <b>079 060 8952</b></div>

<div id="cvAlert" style="display:none" class="need-cv">⚠️ Upload CV in Profile to Apply — 1 click apply everywhere</div>

<div class="filters">
<select id="loc" onchange="render()"><option value="">All Provinces</option><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>KZN</option><option>Eastern Cape</option><option>Free State</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select>
<select id="type" onchange="render()"><option value="">All Types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option></select>
<select id="exp" onchange="render()"><option value="">Any Experience</option><option>No experience</option><option>Matric only</option></select>
<button class="btn-filter btn-wa" onclick="location.href='join.html'">Get jobs on WhatsApp</button>
<button class="btn-filter btn-track" onclick="location.href='track-applications.html'">Track my applications</button>
</div>

<div id="count" style="font-size:12px;color:#8DB0BF;margin:12px 2px">Loading jobs...</div>
<div id="list"></div>
<div id="netMsg" style="text-align:center;font-size:12px;color:#FFD166;padding:15px;display:none">Slow network - showing saved jobs.</div>
</div>

<script>
var SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';
var allJobs = [];
var cached = [];
try{ cached = JSON.parse(localStorage.getItem('jobway_cached_jobs') || '[]'); }catch(e){}

(function(){
  var logged = localStorage.getItem('jobway_logged_in');
  if(logged){
    document.getElementById('profileBtn').style.display='inline-block';
    try{
      var p=JSON.parse(localStorage.getItem('jobway_profile')||'{}');
      if(!p.cv_url) document.getElementById('cvAlert').style.display='block';
    }catch(e){}
  } else {
    document.getElementById('headerBtns').innerHTML = '<button class="btn btn-dark" onclick="location.href=\'index.html\'">Home</button><button class="btn btn-green" onclick="location.href=\'login.html\'">Login</button><button class="btn btn-dark" onclick="location.href=\'track-applications.html\'">Track</button>';
  }
})();

function timeAgo(ts){
  var h=Math.floor((Date.now()-ts)/3600000);
  if(h<1) return 'Posted today';
  if(h<24) return 'Posted '+h+'h ago';
  return 'Posted '+Math.floor(h/24)+' days ago';
}
function initials(n){
  var parts=(n||'J').split(' '); var s=''; for(var i=0;i<parts.length&&s.length<2;i++){ if(parts[i].length>0) s+=parts[i][0]; } return s.toUpperCase();
}
function extractUrl(text, url){
  if(url && url.indexOf('http')===0) return url;
  if(!text) return 'https://www.careers24.com';
  var m=text.match(/https?:\/\/[^\s\)]+/); if(m) return m[0].replace(/[.,]$/,'');
  return 'https://www.careers24.com';
}
function hasCV(){
  try{ var p=JSON.parse(localStorage.getItem('jobway_profile')||'{}'); return !!p.cv_url; }catch(e){ return false; }
}
function handleApply(jobId, applyUrl, title){
  var logged = localStorage.getItem('jobway_logged_in');
  if(!logged){ localStorage.setItem('jobway_wanted_job', jobId); window.location.href='login.html'; return; }
  if(!hasCV()){ if(confirm('⚠️ You need to upload CV first. Go to Profile now?')) window.location.href='profile.html'; return; }
  // Save application locally for Track page + employer
  try{
    var apps=JSON.parse(localStorage.getItem('jobway_applications')||'[]');
    apps.unshift({jobId:jobId, title:title, url:applyUrl, date:new Date().toISOString(), cv_url: JSON.parse(localStorage.getItem('jobway_profile')||'{}').cv_url||''});
    localStorage.setItem('jobway_applications', JSON.stringify(apps));
  }catch(e){}
  // Log to Supabase for employer dashboard (non-blocking)
  try{
    var p=JSON.parse(localStorage.getItem('jobway_profile')||'{}');
    var xhr=new XMLHttpRequest(); xhr.open('POST', SUPABASE_URL+'/rest/v1/applications', true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY); xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY); xhr.setRequestHeader('Content-Type','application/json');
    xhr.send(JSON.stringify({job_id:jobId, phone:p.phoneClean||p.whatsapp||'', full_name:p.fullName||'', cv_url:p.cv_url||''}));
  }catch(e){}
  window.open(applyUrl, '_blank');
}
function fetchJobs(cb){
  var xhr=new XMLHttpRequest();
  xhr.open('GET', SUPABASE_URL+'/rest/v1/jobs?select=*&order=created_at.desc&limit=100', true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY); xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
  xhr.timeout=8000;
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4){
      if(xhr.status===200){
        try{
          var rows=JSON.parse(xhr.responseText); var mapped=[]; var today=new Date(); today.setHours(0,0,0,0);
          for(var i=0;i<rows.length;i++){
            var j=rows[i];
            var closing=j.closing_date ? new Date(j.closing_date) : new Date(new Date(j.created_at).getTime()+14*24*3600*1000);
            if(closing < today) continue;
            var salaryText='Salary: Employer to disclose';
            if(j.salary_min && j.salary_max) salaryText='R'+j.salary_min+' - R'+j.salary_max;
            else if(j.salary_min) salaryText='R'+j.salary_min+'+';
            else if(j.salary) salaryText=j.salary;
            mapped.push({title:j.title, company:j.company_name||j.company||'Company', location:j.location||j.province||'South Africa', province:j.province||j.location||'', type:j.type||j.job_type||'Full-time', salaryText:salaryText, desc:j.description||'', postedAt:j.created_at ? new Date(j.created_at).getTime() : Date.now(), id:j.id, applyUrl:extractUrl(j.description||'', j.apply_url||j.application_url||j.url||'')});
          }
          if(mapped.length>0){ try{ localStorage.setItem('jobway_cached_jobs', JSON.stringify(mapped)); }catch(e){} cb(mapped); return; }
        }catch(e){}
      }
      document.getElementById('netMsg').style.display='block'; cb(cached);
    }
  };
  xhr.onerror=function(){ document.getElementById('netMsg').style.display='block'; cb(cached); };
  xhr.ontimeout=function(){ document.getElementById('netMsg').style.display='block'; cb(cached); };
  try{ xhr.send(); }catch(e){ cb(cached); }
}
function render(){
  var qLoc=document.getElementById('loc').value;
  var qType=document.getElementById('type').value;
  var qExp=document.getElementById('exp').value;
  fetchJobs(function(jobs){
    var filtered=[];
    for(var i=0;i<jobs.length;i++){
      var j=jobs[i];
      if(qLoc){
        var locLow=(j.location||'').toLowerCase(); var provLow=(j.province||'').toLowerCase();
        if(locLow.indexOf(qLoc.toLowerCase())===-1 && provLow.indexOf(qLoc.toLowerCase())===-1){ if(!(qLoc==='KZN' && provLow.indexOf('kwazulu')!==-1)) continue; }
      }
      if(qType && (j.type||'')!==qType) continue;
      if(qExp==='No experience' && (j.desc||'').toLowerCase().indexOf('no experience')===-1) continue;
      if(qExp==='Matric only' && (j.desc||'').toLowerCase().indexOf('matric')===-1) continue;
      filtered.push(j);
    }
    document.getElementById('count').innerHTML=filtered.length+' jobs found'+(qLoc?' in '+qLoc:'')+' • Updated today';
    var listEl=document.getElementById('list');
    if(filtered.length===0){ listEl.innerHTML='<div class="card" style="text-align:center;color:#8DB0BF">No active jobs found.<br>New jobs added daily - check WhatsApp.<br><button class="btn btn-green" style="margin-top:10px" onclick="clearF()">Clear filters</button></div>'; return; }
    var html='';
    for(var k=0;k<filtered.length;k++){
      var job=filtered[k]; var safeTitle=job.title.replace(/'/g,'').replace(/"/g,'');
      var needCV = !hasCV();
      html+='<div class="card"><div class="company">'+initials(job.company)+' '+job.company+'</div><div class="meta">'+job.location+' • '+job.type+'</div><div class="job-title">'+job.title+'</div><div><span class="badge badge-green">'+timeAgo(job.postedAt)+'</span><span class="badge">'+job.salaryText+'</span></div><div class="desc">'+(job.desc||'').substring(0,200)+'</div>'+(needCV?'<div class="need-cv">Upload CV in Profile to Apply</div>':'')+'<button class="btn-apply" onclick="handleApply(\''+job.id+'\', \''+job.applyUrl+'\', \''+safeTitle+'\')">'+(needCV?'Upload CV to Apply':'Apply now ↗')+'</button><button class="btn-detail" onclick="alert(\''+safeTitle+'\\n'+job.company+'\\n'+job.location+'\')">View details</button></div>';
    }
    listEl.innerHTML=html;
  });
}
function clearF(){ document.getElementById('loc').value=''; document.getElementById('type').value=''; document.getElementById('exp').value=''; render(); }
render();
</script>
</body>
</html>
