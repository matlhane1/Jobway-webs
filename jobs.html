<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Real Jobs in SA | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2835;color:white;min-height:100vh}
.header{background:#0A1F2E;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(1,249,198,.15);position:sticky;top:0;z-index:10}
.logo-text{font-weight:900;color:#01F9C6;font-size:20px;cursor:pointer}
.btn{border:none;border-radius:999px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px;white-space:nowrap}
.btn-dark{background:#1A3E52;color:#A8C8D0}.btn-green{background:#01F9C6;color:#0A1F2E}.btn-red{background:#FF4D4D;color:#fff}
.container{max-width:700px;margin:0 auto;padding:14px}
.trust-bar{background:rgba(1,249,198,.08);border:1px solid rgba(1,249,198,.18);border-radius:12px;padding:10px 14px;font-size:11.5px;color:#A8C8D0;text-align:center;margin:12px 0}
.trust-bar b{color:#01F9C6}
.filters{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.select{background:#0F2230;border:1px solid #25475A;color:#fff;padding:12px;border-radius:10px;width:100%;font-size:13px}
.btn-filter{padding:11px;border-radius:999px;font-weight:800;border:none;cursor:pointer;font-size:12.5px}
.btn-wa{background:#1A3E52;color:#fff;border:1px solid rgba(1,249,198,.2)}.btn-track{background:#01F9C6;color:#0A1F2E}
.card{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:16px;margin-bottom:12px;position:relative}
.company-row{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.logo-fallback{width:46px;height:46px;background:#0F2230;border:1px solid rgba(255,255,255,.1);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#01F9C6}
.job-title{font-size:17px;font-weight:800;line-height:1.2}
.job-meta{color:#8DB0BF;font-size:12px;margin:4px 0}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.badge{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);color:#A8C8D0;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600}
.badge-green{background:rgba(1,249,198,.12);color:#01F9C6;border-color:rgba(1,249,198,.2)}
.badge-red{background:rgba(255,77,77,.15);color:#FF8A9D;border-color:rgba(255,77,77,.3)}
.badge-yellow{background:rgba(255,209,102,.15);color:#FFD166;border-color:rgba(255,209,102,.3)}
.desc{color:#C8DDE3;font-size:13px;margin:8px 0;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn-apply{background:#01F9C6;color:#08231C;border:none;border-radius:999px;padding:11px 18px;font-weight:900;cursor:pointer;flex:1;font-size:13px;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn-detail{background:#1A3E52;color:#fff;border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:11px 18px;font-weight:700;cursor:pointer;flex:1;font-size:13px}
</style>
</head>
<body>
<div class="header">
<div class="logo-text" onclick="location.href='index.html'">JobWay</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='index.html'">Home</button>
<button class="btn btn-dark" onclick="location.href='profile.html'">My CV</button>
<button class="btn btn-green" onclick="location.href='track-applications.html'">Track my applications</button>
</div>
</div>
<div class="container">
<div class="trust-bar">All jobs verified manually • <b>Never pay to apply</b> • Questions? WhatsApp <b>079 060 8952</b> (Mon-Fri 8am-6pm)</div>

<div id="adminBar" style="display:none;background:#3A2025;border:1px solid #7A3540;border-radius:12px;padding:12px;text-align:center;margin-bottom:10px">
<b>ADMIN MODE</b><br><span style="font-size:12px;color:#FFB4BE">This will delete ALL jobs from database</span><br>
<button class="btn btn-red" style="margin-top:8px" onclick="deleteAllJobs()">🗑️ DELETE ALL JOBS</button>
<button class="btn btn-dark" onclick="location.href='jobs.html'">Exit admin</button>
<div id="delStatus" style="font-size:12px;margin-top:8px"></div>
</div>

<div class="filters">
<select class="select" id="loc" onchange="render()"><option value="">All Provinces</option><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>KZN</option><option>Eastern Cape</option><option>Free State</option><option>Limpopo</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select>
<select class="select" id="type" onchange="render()"><option value="">All Types</option><option>Full-time</option><option>Part-time</option><option>Contract</option><option>Temporary</option></select>
<select class="select" id="exp" onchange="render()"><option value="">Any Experience</option><option>No experience</option><option>1+ years</option><option>Matric only</option></select>
<select class="select" id="salary" onchange="render()"><option value="">Any Salary</option><option value="3500">R3500+</option><option value="5000">R5000+</option><option value="8000">R8000+</option></select>
<button class="btn-filter btn-wa" onclick="location.href='join.html'">Get jobs on WhatsApp</button>
<button class="btn-filter btn-track" onclick="location.href='track-applications.html'">Track my applications</button>
</div>
<div id="count" style="font-size:12px;color:#8DB0BF;margin:14px 2px"></div>
<div id="list" style="margin-top:8px"></div>
</div>

<script>
const supabaseClient = window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
if(new URLSearchParams(location.search).get('admin')==='1'){
  document.getElementById('adminBar').style.display='block';
}
async function deleteAllJobs(){
  if(!confirm('DELETE ALL JOBS? This cannot be undone!')) return;
  document.getElementById('delStatus').textContent = 'Deleting...';
  const {error} = await supabaseClient.from('jobs').delete().neq('id', '00000000-0000-0000-0000-000000000000');
  if(error){
    document.getElementById('delStatus').textContent = 'Error: ' + error.message;
    alert('RLS blocked delete. Run in Supabase SQL: DELETE FROM jobs;');
  } else {
    document.getElementById('delStatus').textContent = 'All jobs deleted!';
    setTimeout(()=>location.reload(), 800);
  }
}
function timeAgo(ts){let h=Math.floor((Date.now()-ts)/3600000);if(h<1)return'Posted today';if(h<24)return`Posted ${h}h ago`;return`Posted ${Math.floor(h/24)} days ago`;}
function initials(n){return (n||'J').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function extractUrl(text, url){
  if(url && url.startsWith('http')) return url;
  if(!text) return 'https://www.careers24.com';
  let m = text.match(/https?:\/\/[^\s\)]+/);
  return m ? m[0].replace(/[.,]$/,'') : 'https://www.careers24.com';
}
function getClosingInfo(j){
  let closingRaw = j.closing_date || j.closingDate;
  let closingDate;
  if(closingRaw){ closingDate = new Date(closingRaw); } else {
    const base = j.created_at ? new Date(j.created_at) : new Date();
    closingDate = new Date(base.getTime() + 14*24*60*60*1000);
  }
  const today = new Date(); today.setHours(0,0,0,0);
  const closeMidnight = new Date(closingDate); closeMidnight.setHours(0,0,0,0);
  const diffDays = Math.ceil((closeMidnight - today)/(1000*60*60*24));
  return {date: closingDate, diffDays, isExpired: diffDays < 0};
}
function closingBadge(info){
  if(info.diffDays < 0) return '';
  const dateStr = info.date.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'});
  if(info.diffDays === 0) return `<span class="badge badge-red">Closes today!</span>`;
  if(info.diffDays <= 3) return `<span class="badge badge-red">Closing Soon • ${info.diffDays}d left • ${dateStr}</span>`;
  if(info.diffDays <= 7) return `<span class="badge badge-yellow">Closes in ${info.diffDays} days • ${dateStr}</span>`;
  return `<span class="badge">Closes: ${dateStr} • ${info.diffDays} days left</span>`;
}
// NEW: 1-click WhatsApp gate - this is the fix for your 0 signups
function handleApply(jobId, applyUrl, title){
  const joined = localStorage.getItem('jobway_joined_phone');
  if(!joined){
    // Save which job they wanted, then send to join
    localStorage.setItem('jobway_wanted_job', jobId);
    localStorage.setItem('jobway_wanted_url', applyUrl);
    localStorage.setItem('jobway_wanted_title', title);
    window.location.href = 'join.html?job=' + encodeURIComponent(jobId);
    return;
  }
  // Already joined - track and open
  try{
    supabaseClient.from('applications').insert([{ job_id: jobId, phone: joined, status: 'clicked_apply' }]);
  }catch(e){}
  window.open(applyUrl, '_blank');
}

let allJobsCache=[];
async function fetchJobs(){
  try{
    const todayStr = new Date().toISOString().split('T')[0];
    const {data, error} = await supabaseClient.from('jobs').select('*').gte('closing_date', todayStr).eq('is_active', true).order('created_at',{ascending:false}).limit(300);
    let rows = data || [];
    if(error || rows.length===0){
      const res2 = await supabaseClient.from('jobs').select('*').order('created_at',{ascending:false}).limit(300);
      rows = res2.data || [];
    }
    const today = new Date(); today.setHours(0,0,0,0);
    return rows.map(j=>{
      let loc = j.location || j.province || j.city || 'South Africa';
      let prov = j.province || j.location || '';
      let company = j.company_name || j.company || 'Company';
      let salaryText='Market related';
      if(j.salary_min && j.salary_max) salaryText=`R${j.salary_min} - R${j.salary_max}`;
      else if(j.salary_min) salaryText=`R${j.salary_min}+`;
      else if(j.salary) salaryText=j.salary;
      const closingInfo = getClosingInfo(j);
      if(closingInfo.isExpired) return null;
      return {title:j.title,company:company,location:loc,province:prov,type:j.type||j.job_type||'Full-time',salaryText:salaryText,salaryMin:j.salary_min||0,desc:j.description||'',postedAt:j.created_at?new Date(j.created_at).getTime():Date.now(),closingInfo:closingInfo,closingDate:closingInfo.date.toLocaleDateString('en-ZA',{day:'numeric',month:'short',year:'numeric'}),id:j.id,applyUrl:extractUrl(j.description||'', j.apply_url||j.application_url||j.url||'')};
    }).filter(Boolean);
  }catch(e){ console.log(e); return []; }
}

async function render(){
  let qLoc=document.getElementById('loc').value;
  let qType=document.getElementById('type').value;
  let qExp=document.getElementById('exp').value;
  let qSal=document.getElementById('salary').value;
  let jobs = await fetchJobs();
  allJobsCache = jobs;
  let filtered = jobs.filter(j=>{
    if(qLoc && !( (j.location||'').toLowerCase().includes(qLoc.toLowerCase()) || (j.province||'').toLowerCase().includes(qLoc.toLowerCase()) || (qLoc==='KZN' && (j.province||'').includes('KwaZulu')) )) return false;
    if(qType && (j.type||'').trim() !== qType) return false;
    if(qExp==='No experience' && !(j.desc||'').toLowerCase().includes('no experience')) return false;
    if(qExp==='Matric only' && !(j.desc||'').toLowerCase().includes('matric')) return false;
    if(qSal && (j.salaryMin||0) < parseInt(qSal) && !(j.salaryText||'').includes('Market')) return false;
    return true;
  });
  document.getElementById('count').innerText = `${filtered.length} jobs found${qLoc?' in '+qLoc:''} • Updated today • Closing dates are realtime`;
  if(filtered.length===0){
    document.getElementById('list').innerHTML = `<div class="card" style="text-align:center;color:#8DB0BF">No active jobs found.<br><span style="font-size:11px">All jobs may be expired or filtered.<br>New jobs are added daily - check WhatsApp.</span><br><button class="btn btn-green" style="margin-top:12px" onclick="clearF()">Clear filters</button></div>`;
    return;
  }
  document.getElementById('list').innerHTML = filtered.map((j)=>{
    return `<div class="card"><div class="company-row"><div class="logo-fallback">${initials(j.company)}</div><div style="flex:1"><div style="font-weight:800;font-size:13px">${j.company}</div><div class="job-meta">${j.location} • ${j.type}</div></div></div><div class="job-title">${j.title}</div><div class="badges"><span class="badge badge-green">${timeAgo(j.postedAt)}</span>${closingBadge(j.closingInfo)}<span class="badge">${j.salaryText}</span></div><div class="desc">${j.desc}</div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn-apply" onclick="handleApply('${j.id}', '${j.applyUrl}', '${j.title.replace(/'/g,"")}')">Apply now ↗</button><button class="btn-detail" onclick="alert('${j.title}\\n${j.company}\\n${j.location} • ${j.type}\\nCloses: ${j.closingDate}\\n${j.salaryText}\\n\\n${j.desc.replace(/'/g,"")}')">View details</button></div></div>`
  }).join('');
}
function clearF(){document.getElementById('loc').value='';document.getElementById('type').value='';document.getElementById('exp').value='';document.getElementById('salary').value='';render();}
render();
</script>
</body>
</html>
