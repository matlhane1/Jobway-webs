<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Jobs in South Africa | JobWay.co.za</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh}
.header{background:#11283A;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E3A4A;position:sticky;top:0;z-index:10}
.logo-text{font-weight:900;color:#01F9C6;font-size:18px}
.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer;font-size:13px}
.btn-dark{background:#1A3446;color:white}
.btn-green{background:#01F9C6;color:#08231C}
.container{max-width:600px;margin:0 auto;padding:16px}
.title{font-weight:900;font-size:24px;margin:12px 0}
.search{width:100%;background:#1A3341;border:1px solid #25475A;padding:14px;border-radius:14px;color:white;outline:none}
.search::placeholder{color:#8DB0BF}
.card{background:#1A3341;border:1px solid #25475A;border-radius:20px;padding:18px;margin-bottom:14px}
.job-title{font-size:20px;font-weight:800;margin-bottom:4px}
.job-meta{color:#8DB0BF;font-size:13px;margin-bottom:10px}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.badge-teal{background:#143E4A;color:#01F9C6;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.badge-red{background:#4A1E2A;color:#FF8A9D;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.salary{color:#A8C8D0;font-weight:700;font-size:14px;margin-bottom:8px}
.desc{color:#E6F2F5;font-size:14px;margin-bottom:14px;line-height:1.4}
.btn-apply{background:#01F9C6;color:#08231C;border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}
.logo-box{width:44px;height:44px;border-radius:12px;background:#11283A;color:#01F9C6;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;overflow:hidden}
</style>
</head>
<body>
<div class="header">
<div class="logo-text">● JobWay</div>
<div style="display:flex;gap:8px">
<button class="btn btn-dark" onclick="location.href='index.html'">🏠 Home</button>
<button class="btn btn-green" onclick="location.href='employer-dashboard.html'">🏢 Employer</button>
</div>
</div>

<div class="container">
<h2 class="title">Find Jobs in South Africa</h2>
<input id="search" class="search" placeholder="Search job title, company, city..." oninput="render(this.value)">
<div id="list" style="margin-top:16px"></div>
</div>

<script>
function getEmployerJobs(){return JSON.parse(localStorage.getItem('jobway_employer_jobs')||'[]')}

function getDefaults(){
return [
{title:'Cashier',company:'Shoprite',location:'Johannesburg, Gauteng',type:'Full-time',salary:'R5,500 - R6,800',desc:'Handle POS and customers with matric. Good communication.',logo:null,duration:'Permanent',postedAt:Date.now()-4*3600000,closingDate:'13 Sept 2026'},
{title:'Retail Assistant',company:'Boxer',location:'Cape Town, Western Cape',type:'Part-time',salary:'R4,600 - R5,600',desc:'Assist shoppers and stock shelves. Retail experience advantage.',logo:null,duration:'3 Months Contract',postedAt:Date.now()-6*3600000,closingDate:'15 Sept 2026'},
{title:'Waiter',company:'Mugg & Bean',location:'Durban, KZN',type:'Full-time',salary:'R4,200 + Tips',desc:'Serve customers, must have experience and be available weekends.',logo:null,duration:'Permanent',postedAt:Date.now()-2*3600000,closingDate:'13 Sept 2026'}
]
}

function timeAgo(ts){
 let diff = Date.now() - ts;
 let h = Math.floor(diff/3600000);
 if(h<1) return 'Just now';
 if(h==1) return 'Posted 1h ago';
 if(h<24) return `Posted ${h}h ago`;
 let d = Math.floor(h/24);
 return `Posted ${d}d ago`;
}

function render(q=''){
let jobs=[...getEmployerJobs(),...getDefaults()];
if(q) jobs=jobs.filter(j=>(j.title+j.company+j.location+j.type).toLowerCase().includes(q.toLowerCase()));
document.getElementById('list').innerHTML=jobs.map(j=>{
let posted = j.postedAt ? timeAgo(j.postedAt) : 'Posted 4h ago';
let closes = j.closingDate || '13 Sept 2026';
let duration = j.duration || j.type;
return `<div class="card" style="display:flex;gap:14px">
<div class="logo-box">${j.logo?`<img src="${j.logo}" style="width:100%;height:100%;object-fit:cover">`:j.company[0]}</div>
<div style="flex:1">
<div class="job-title">${j.title}</div>
<div class="job-meta">${j.company} • ${j.location} • ${j.type}</div>
<div class="badges">
<span class="badge-teal">${posted}</span>
<span class="badge-red">Closes: ${closes}</span>
<span class="badge-teal">Duration: ${duration}</span>
</div>
<div class="salary">${j.salary}</div>
<div class="desc">${j.desc}</div>
<button class="btn-apply" onclick="applyJob('${j.title.replace(/'/g,'')}')">Apply Now</button>
</div>
</div>`}).join('');
}

function applyJob(t){
let n=prompt('Full name?');if(!n)return;
let e=prompt('Email?');let w=prompt('WhatsApp?');
let a=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');
a.unshift({id:Date.now().toString(),job_title:t,name:n,email:e,whatsapp:w,date:new Date().toISOString(),status:'Applied'});
localStorage.setItem('jobway_all_applications',JSON.stringify(a));
alert('✅ Applied to '+t);
location.href='track.html';
}
render();
</script>
</body>
</html>
