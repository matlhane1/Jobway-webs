<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#0A1F2E;color:white;font-family:sans-serif;display:grid;place-items:center;min-height:100vh;padding:20px}
.card{max-width:400px;width:100%;background:#1A3341;border-radius:22px;padding:26px;border:1px solid rgba(1,249,198,0.3)}
input,select{width:100%;padding:13px;border-radius:12px;border:1px solid rgba(255,255,255,0.2);background:#0f2332;color:white;margin:8px 0}
button{width:100%;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;margin-top:12px;cursor:pointer;font-size:16px}
button:disabled{opacity:0.6}
</style></head><body>
<div class="card">
<h2 style="text-align:center;margin:0 0 16px">Create Account</h2>
<input id="fn" placeholder="Full Name">
<input id="em" type="email" placeholder="Email">
<input id="pw" type="password" placeholder="Password 6+ chars">
<select id="role"><option value="seeker">Job Seeker</option><option value="employer">Employer</option></select>
<button id="btn">Create Account →</button>
<p id="msg" style="text-align:center;font-size:12px;color:#FF9B9B;margin-top:10px"></p>
</div>
<script>
const supabaseClient = window.supabase.createClient("https://bzbsqouohsylnhrsjhhy.supabase.co","sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2");
document.getElementById('btn').addEventListener('click', function(){
  const full_name = document.getElementById('fn').value.trim();
  const email = document.getElementById('em').value.trim().toLowerCase();
  const password = document.getElementById('pw').value;
  const role = document.getElementById('role').value;
  const msg = document.getElementById('msg');
  
  if(!full_name || !email || !password){ msg.innerText='Fill all fields'; return; }
  if(password.length<6){ msg.innerText='Password 6+ chars'; return; }
  
  const otp = Math.floor(100000+Math.random()*900000).toString();
  localStorage.setItem('jobway_pending_signup', JSON.stringify({full_name,email,password,role}));
  localStorage.setItem('jobway_otp_email', email);
  localStorage.setItem('jobway_otp_code', otp);
  
  alert('YOUR OTP CODE: '+otp+'\n\nClick OK to verify');
  window.location.href = 'verify-email.html?email='+encodeURIComponent(email)+'&code='+otp;
});
</script></body></html>
