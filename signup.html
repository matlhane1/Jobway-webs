<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Create Account | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0F2835;color:#fff;font-family:'Plus Jakarta Sans',sans-serif}
.header{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-weight:800;color:#01F9C6;font-size:20px}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 32px}
.card{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;margin-top:16px}
.label{font-size:11px;color:#A8C8D0;font-weight:700;margin:14px 0 6px;display:block}
.input,select{width:100%;background:#0F2230;border:1px solid #25475A;color:#fff;padding:15px 12px;border-radius:10px;font-size:16px}
.btn{width:100%;padding:15px;border-radius:999px;border:0;font-weight:800;cursor:pointer;margin-top:16px;font-size:15px;background:#01F9C6;color:#0A1F2E}
.role-wrap{display:flex;gap:10px;margin:12px 0}
.role-opt{flex:1;text-align:center;padding:14px;border-radius:12px;border:2px solid #25475A;background:#0F2230;cursor:pointer;font-weight:700;font-size:14px}
.role-opt.selected{border-color:#01F9C6;background:rgba(1,249,198,.12);color:#01F9C6}
.status{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;display:none}.status.show{display:block}.status.error{background:rgba(255,138,157,.12);border:1px solid #ff8a9d;color:#FF8A9D}.status.ok{background:rgba(1,249,198,.1);border:1px solid #01F9C6;color:#01F9C6}
</style>
</head>
<body>
<div class="header"><div class="logo" onclick="location.href='index.html'">JobWay</div><button onclick="location.href='login.html'" style="background:#1A3E52;color:#fff;border:0;padding:10px 18px;border-radius:999px;font-weight:700">Log in</button></div>
<div class="wrap">
<h1 style="text-align:center;font-size:26px;margin:16px 0">Join with WhatsApp</h1>
<p style="text-align:center;color:#A8C8D0;font-size:13px">No email, no password. Just WhatsApp.</p>
<div class="card">
<label class="label">I AM A...</label>
<!-- FIXED: Uses DIVs not BUTTONs, works even if JS libs fail -->
<div class="role-wrap">
  <div id="opt-seeker" class="role-opt selected" onclick="selectRole('seeker')">Jobseeker<br><span style="font-size:11px;font-weight:400;opacity:.7">Find work</span></div>
  <div id="opt-employer" class="role-opt" onclick="selectRole('employer')">Employer<br><span style="font-size:11px;font-weight:400;opacity:.7">Hire staff</span></div>
</div>
<input type="hidden" id="role" value="seeker">

<form id="form">
<label class="label">FULL NAME *</label><input class="input" id="fn" required placeholder="Thandi Nkosi">
<label class="label">WHATSAPP NUMBER *</label><input class="input" id="waNumber" type="tel" placeholder="e.g. 081 263 3193" required>
<div id="seeker-fields">
<label class="label">PROVINCE *</label><select id="province"><option value="">Select Province</option><option>Gauteng</option><option>Limpopo</option><option>KwaZulu-Natal</option><option>Western Cape</option><option>Eastern Cape</option><option>Free State</option><option>Mpumalanga</option><option>North West</option><option>Northern Cape</option></select>
<label class="label">EXPERIENCE LEVEL *</label><select id="experience"><option value="">Select Experience</option><option>No Matric</option><option>No Experience Required</option><option>Entry-Level</option><option>Junior</option><option>Mid-Level</option><option>Senior</option><option>Graduate</option></select>
</div>
<div id="employer-info" style="display:none;background:rgba(1,249,198,.1);padding:12px;border-radius:10px;margin-top:14px;font-size:13px">Employer mode: You will post jobs for R299. No province filter needed.</div>
<label style="display:flex;gap:10px;margin-top:14px;font-size:13px;color:#C9E6EC"><input type="checkbox" id="popia" required style="width:18px;height:18px;accent-color:#01F9C6"><span>I agree to Privacy & POPIA</span></label>
<button class="btn" id="submitBtn" type="submit">Get Jobs on WhatsApp →</button>
</form>
<div id="status" class="status"></div>
</div></div>

<script>
// THIS RUNS FIRST - NO SUPABASE NEEDED, SO BUTTON ALWAYS WORKS
function selectRole(r){
  document.getElementById('role').value = r;
  document.getElementById('opt-seeker').classList.toggle('selected', r==='seeker');
  document.getElementById('opt-employer').classList.toggle('selected', r==='employer');
  document.getElementById('seeker-fields').style.display = r==='seeker' ? 'block' : 'none';
  document.getElementById('employer-info').style.display = r==='employer' ? 'block' : 'none';
  document.getElementById('submitBtn').textContent = r==='employer' ? 'Continue as Employer →' : 'Get Jobs on WhatsApp →';
}
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://dmxumcjeetphwzvgzzuk.supabase.co";
const SUPABASE_KEY = "sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";
let supabase = null;
try{ supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); }catch(e){}
function showStatus(m,t){const s=document.getElementById("status");s.textContent=m;s.className="status show "+t;}
document.getElementById("form").addEventListener("submit", async(e)=>{
 e.preventDefault();
 const name=document.getElementById("fn").value.trim();
 let wa=document.getElementById("waNumber").value.trim().replace(/\s/g,'');
 const role=document.getElementById("role").value;
 const prov=document.getElementById("province").value;
 const exp=document.getElementById("experience").value;
 if(!name || wa.length<9){showStatus("Enter name and WhatsApp","error");return;}
 if(role==="seeker" && (!prov || !exp)){showStatus("Select Province + Experience","error");return;}
 let clean=wa.replace(/^\+/,''); if(clean.startsWith('0')) clean='27'+clean.slice(1); if(!clean.startsWith('27')) clean='27'+clean;
 const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="Creating...";
 try{
   if(supabase){
     let {data:ex}=await supabase.from('whatsapp_subscribers').select('id').eq('whatsapp_number',clean).maybeSingle();
     if(ex){ await supabase.from('whatsapp_subscribers').update({full_name:name,province:prov||null,experience_level:exp||null,subscribed:true}).eq('whatsapp_number',clean); }
     else{ await supabase.from('whatsapp_subscribers').insert({full_name:name,whatsapp_number:clean,phone:clean,province:prov||null,experience_level:exp||null,subscribed:true,is_active:true,email:clean+'@whatsapp.jobway.co.za'}); }
   }
   localStorage.setItem('userPhone',clean); localStorage.setItem('userName',name); localStorage.setItem('userProvince',prov); localStorage.setItem('userExperience',exp); localStorage.setItem('user_role',role);
   showStatus("Welcome "+name+"! Redirecting...","ok");
   setTimeout(()=>{location.href= role==="employer" ? "employer-dashboard.html" : "index.html";},800);
 }catch(err){ showStatus(err.message,"error"); btn.disabled=false; }
});
</script>
</body>
</html>
