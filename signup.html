<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0F2835">
<title>Create Account | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#0F2835;color:#fff;font-family:'Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;min-height:100dvh}
.header{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:'Space Grotesk';font-weight:800;color:#01F9C6;font-size:20px;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:20px 16px 32px}.card{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;margin-top:16px}
.label{font-size:11px;color:#A8C8D0;font-weight:700;margin:14px 0 6px;display:block;letter-spacing:.05em}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:#fff;padding:14px 12px;border-radius:10px;font-size:16px;font-family:inherit}
.input:focus{border-color:#01F9C6;outline:none}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.role-btn{padding:14px;min-height:48px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0F2230;color:#fff;cursor:pointer;text-align:left;font-family:inherit}.role-btn.active{border-color:#01F9C6;background:rgba(1,249,198,.08)}
.btn{width:100%;padding:14px;min-height:48px;border-radius:999px;border:0;font-weight:800;cursor:pointer;margin-top:16px;font-family:inherit;font-size:15px}.btn-green{background:#01F9C6;color:#0A1F2E}.btn:disabled{opacity:.6}
.status{margin-top:12px;padding:12px;border-radius:10px;font-size:13px;line-height:1.4;display:none;word-break:break-word}.status.show{display:block}.status.error{background:rgba(255,138,157,.12);border:1px solid rgba(255,138,157,.3);color:#FF8A9D}.status.ok{background:rgba(1,249,198,.08);border:1px solid rgba(1,249,198,.2);color:#01F9C6}
.pw-wrap{position:relative}.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:#A8C8D0;cursor:pointer;font-size:16px;padding:10px;min-width:44px;min-height:44px}
.check-row{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:#C9E6EC;margin-top:12px;line-height:1.4}.check-row input{margin-top:2px;width:18px;height:18px;accent-color:#01F9C6;flex-shrink:0}
</style>
</head>
<body>
<div class="header"><div class="logo" onclick="location.href='index.html'">JobWay</div><button onclick="location.href='login.html'" style="background:#1A3E52;color:#fff;border:0;padding:10px 18px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer">Log in</button></div>
<div class="wrap">
<h1 style="font-family:'Space Grotesk';text-align:center;font-size:26px;margin:16px 0">Create your account</h1>
<div class="card">
<label class="label">I AM A...</label>
<div class="role"><button type="button" class="role-btn active" id="btn-seeker" onclick="setRole('seeker')"><b>Jobseeker</b><br><span style="font-size:12px;color:#A8C8D0">Find work</span></button><button type="button" class="role-btn" id="btn-employer" onclick="setRole('employer')"><b>Employer</b><br><span style="font-size:12px;color:#A8C8D0">Hire staff</span></button></div>
<form id="form">
<label class="label">FULL NAME</label><input class="input" id="fn" required placeholder="Thandi Nkosi" autocomplete="name">
<label class="label">EMAIL</label><input class="input" id="em" type="email" required placeholder="you@mail.com" autocomplete="email">
<label class="label">PASSWORD</label>
<div class="pw-wrap"><input class="input" id="pw" type="password" required placeholder="6+ characters" minlength="6" style="padding-right:48px" autocomplete="new-password"><button type="button" class="pw-toggle" onclick="togglePw()">👁️</button></div>
<div id="wa-wrap" class="check-row"><input type="checkbox" id="wa" checked><label for="wa">Get WhatsApp job alerts</label></div>
<div id="wa-phone-wrap"><label class="label">WHATSAPP NUMBER</label><input class="input" id="waNumber" type="tel" placeholder="e.g. 0812633193" inputmode="tel" required></div>
<label class="check-row"><input type="checkbox" id="popia" required><span>I agree to Privacy & POPIA</span></label>
<input type="hidden" id="role" value="seeker">
<button class="btn btn-green" id="submitBtn" type="submit">Create account →</button>
</form>
<div id="status" class="status"></div>
</div></div>
<script>
const SUPABASE_URL = "https://dmxumcjeetphwzvgzzuk.supabase.co";
const SUPABASE_KEY = "sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-";
function setRole(r){document.getElementById("role").value=r;document.getElementById("btn-seeker").classList.toggle("active",r==="seeker");document.getElementById("btn-employer").classList.toggle("active",r==="employer");const s=r==="seeker";const w=document.getElementById("wa").checked;document.getElementById("wa-wrap").style.display=s?"flex":"none";document.getElementById("wa-phone-wrap").style.display=(s&&w)?"block":"none";document.getElementById("waNumber").required=(s&&w);}
function togglePw(){const p=document.getElementById("pw");p.type=p.type==="password"?"text":"password";}
function showStatus(m,t){const s=document.getElementById("status");s.textContent=m;s.className="status show "+t;}
document.getElementById("wa").addEventListener("change",function(){const s=document.getElementById("role").value==="seeker";document.getElementById("wa-phone-wrap").style.display=(s&&this.checked)?"block":"none";document.getElementById("waNumber").required=(s&&this.checked);});
document.getElementById("form").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const name=document.getElementById("fn").value.trim();
 const email=document.getElementById("em").value.trim().toLowerCase();
 const password=document.getElementById("pw").value;
 const role=document.getElementById("role").value;
 const waChecked=document.getElementById("wa").checked;
 const waNum=document.getElementById("waNumber").value.trim();
 if(!name||!email.includes("@")||password.length<6){showStatus("Please fill name, valid email and 6+ char password","error");return;}
 if(role==="seeker"&&waChecked&&!waNum){showStatus("Enter WhatsApp number","error");return;}
 if(!document.getElementById("popia").checked){showStatus("Accept POPIA","error");return;}
 const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="Creating account...";
 try{
  // Direct fetch - NO library, works on ALL 4G networks
  const res = await fetch(SUPABASE_URL + "/auth/v1/signup", {
    method:"POST",
    headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({email,password,data:{full_name:name,[STRIPPED] window.location.origin + "/login.html"}})
  });
  const json = await res.json();
  if(!res.ok){
    if(json.msg && json.msg.toLowerCase().includes("already")) throw new Error("Account already exists, please login");
    throw new Error(json.msg || json.message || "Signup failed");
  }
  // Now try login to get session
  let userId = json.user?.id;
  let loginOk = false;
  try{
    const loginRes = await fetch(SUPABASE_URL + "/auth/v1/token?grant_type=password",{
      method:"POST",
      headers:{"apikey":SUPABASE_KEY,"Content-Type":"application/json"},
      body: JSON.stringify({email,password})
    });
    const loginJson = await loginRes.json();
    if(loginRes.ok && loginJson.user){ userId = loginJson.user.id; loginOk=true; localStorage.setItem("jobway_token", loginJson.access_token); }
  }catch(_){ }
  // Save profile with direct REST call - no library needed
  if(userId){
    try{
      let clean = waNum.replace(/\s/g,'').replace(/^0/,'27');
      await fetch(SUPABASE_URL + "/rest/v1/profiles",{
        method:"POST",
        headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
        body: JSON.stringify({id:userId,email:email,full_name:name,role:role,whatsapp_number:waNum,phone:waNum})
      });
      if(role==="seeker" && waChecked && waNum){
        await fetch(SUPABASE_URL + "/rest/v1/whatsapp_subscribers",{
          method:"POST",
          headers:{"apikey":SUPABASE_KEY,"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"},
          body: JSON.stringify({email:email,full_name:name,whatsapp_number:clean,subscribed:true})
        });
      }
    }catch(_){ console.log("profile save skipped"); }
  }
  localStorage.setItem("jobway_user_email",email);
  localStorage.setItem("user_role",role);
  if(loginOk){ showStatus("Account created! Redirecting...","ok"); setTimeout(()=>{location.href = role==="employer" ? "employer-dashboard.html" : "candidate-dashboard.html";},900); }
  else{ showStatus("Account created! Check email to confirm, then login.","ok"); setTimeout(()=>location.href='login.html',1800); }
 }catch(err){
  console.error(err);
  showStatus(err.message,"error");
  btn.disabled=false;btn.textContent="Create account →";
 }
});
</script>
</body>
</html>
