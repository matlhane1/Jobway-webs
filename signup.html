<script>
const SUPABASE_URL="https://bzbsqouohsylnhrsjhhy.supabase.co";
const SUPABASE_KEY="sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2";
const HYPER_WORKER_URL="https://dmxumcjeetphwzvgzzuk.supabase.co/functions/v1/hyper-worker";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

const form=document.getElementById("signupForm");
const fullName=document.getElementById("fn");
const email=document.getElementById("em");
const password=document.getElementById("pw");
const roleSelect=document.getElementById("role");
const waOptIn=document.getElementById("waOptIn");
const waField=document.getElementById("waField");
const waNumber=document.getElementById("waNumber");
const submitButton=document.getElementById("btn");
const statusBox=document.getElementById("status");
const eyeButton=document.getElementById("eyeBtn");

function setRole(r){
  roleSelect.value=r;
  document.getElementById("card-seeker").classList.toggle("active",r==="seeker");
  document.getElementById("card-employer").classList.toggle("active",r==="employer");
}
roleSelect.addEventListener("change",e=>setRole(e.target.value));
eyeButton.addEventListener("click",()=>{password.type=password.type==="password"?"text":"password";eyeButton.textContent=password.type==="password"?"SHOW":"HIDE";});
waOptIn.addEventListener("change",()=>{waField.style.display=waOptIn.checked?"block":"none";if(!waOptIn.checked)waNumber.value="";});
function showStatus(m,t){statusBox.textContent=m;statusBox.className="status show "+t;}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);}
function normalizePhone(v){let p=v.replace(/\D/g,"");if(p.startsWith("0"))p="27"+p.slice(1);return p.length===11&&p.startsWith("27")? "+"+p : null;}

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  submitButton.disabled=true;
  submitButton.textContent="Creating account...";
  statusBox.className="status";
  try{
    const name=fullName.value.trim();
    const userEmail=email.value.trim().toLowerCase();
    const userPassword=password.value;
    const selectedRole=roleSelect.value;
    let whatsapp=null;
    if(name.length<2) throw new Error("Enter your full name.");
    if(!validEmail(userEmail)) throw new Error("Enter a valid email.");
    if(userPassword.length<6) throw new Error("Password must be 6+ chars.");
    if(waOptIn.checked){
      if(!waNumber.value.trim()) throw new Error("Enter WhatsApp number.");
      whatsapp=normalizePhone(waNumber.value);
      if(!whatsapp) throw new Error("Enter valid SA WhatsApp number (071...).");
    }
    const otp=Math.floor(100000+Math.random()*900000).toString();
    const pending={full_name:name,email:userEmail,password:userPassword,role:selectedRole,whatsapp_opt_in:waOptIn.checked,whatsapp_number:whatsapp};
    
    localStorage.setItem("jobway_pending_signup",JSON.stringify(pending));
    localStorage.setItem("jobway_otp_email",userEmail);
    localStorage.setItem("jobway_otp_code",otp);
    sessionStorage.setItem("jobway_signup_email",userEmail);

    // CREATE USER IN SUPABASE (email confirm OFF)
    supabaseClient.auth.signUp({
      email:userEmail,password:userPassword,
      options:{data:{full_name:name,role:selectedRole}}
    });

    // === NOW SEND EMAIL VIA HYPER-WORKER ===
    showStatus("📧 Sending verification code to "+userEmail+"...","success");
    const res = await fetch(HYPER_WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "signup_otp", email: userEmail, code: otp, name: name })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error || "Email failed to send");

    showStatus("✅ Code sent to "+userEmail+" — redirecting...","success");
    submitButton.textContent="Account Created ✓";

    setTimeout(()=>{
      location.href="verify-email.html?email="+encodeURIComponent(userEmail);
    },800);

  }catch(err){
    showStatus(err.message,"error");
    submitButton.disabled=false;
    submitButton.textContent="Create Account →";
  }
});
setRole("seeker");
</script>
