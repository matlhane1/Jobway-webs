<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0F2835;color:#fff;font-family:'Plus Jakarta Sans',sans-serif;min-height:100vh}
.header{max-width:1100px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{font-family:'Space Grotesk';font-weight:800;color:#01F9C6;font-size:20px;cursor:pointer}
.wrap{max-width:480px;margin:0 auto;padding:24px 20px}.card{background:#11283A;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px;margin-top:16px}
.label{font-size:11px;color:#A8C8D0;font-weight:700;margin:12px 0 6px;display:block}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:#fff;padding:12px;border-radius:10px;font-size:13px;font-family:inherit}
.input:focus{border-color:#01F9C6;outline:none}
.role{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.role-btn{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:#0F2230;color:#fff;cursor:pointer;text-align:left;font-family:inherit}.role-btn.active{border-color:#01F9C6;background:rgba(1,249,198,.08)}
.btn{width:100%;padding:13px;border-radius:999px;border:0;font-weight:800;cursor:pointer;margin-top:16px;font-family:inherit}.btn-green{background:#01F9C6;color:#0A1F2E}.btn:disabled{opacity:.6}
.status{margin-top:12px;padding:10px;border-radius:10px;font-size:12px;display:none}.status.show{display:block}.status.error{background:rgba(255,138,157,.12);border:1px solid rgba(255,138,157,.3);color:#FF8A9D}.status.ok{background:rgba(1,249,198,.08);border:1px solid rgba(1,249,198,.2);color:#01F9C6}
</style>
</head>
<body>
<div class="header"><div class="logo" onclick="location.href='index.html'">JobWay</div><button onclick="location.href='login.html'" style="background:#1A3E52;color:#fff;border:0;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px;cursor:pointer">Log in</button></div>
<div class="wrap">
<h1 style="font-family:'Space Grotesk';text-align:center;font-size:26px;margin:16px 0">Create your account</h1>
<div class="card">
<label class="label">I AM A...</label>
<div class="role"><button type="button" class="role-btn active" id="btn-seeker" onclick="setRole('seeker')"><b>Jobseeker</b></button><button type="button" class="role-btn" id="btn-employer" onclick="setRole('employer')"><b>Employer</b></button></div>
<form id="form">
<label class="label">FULL NAME</label><input class="input" id="fn" required placeholder="Thandi Nkosi">
<label class="label">EMAIL</label><input class="input" id="em" type="email" required placeholder="you@mail.com">
<label class="label">PASSWORD</label><input class="input" id="pw" type="password" required placeholder="6+ chars" minlength="6">
<label class="label" style="margin-top:12px"><input type="checkbox" id="popia" required> I agree to Privacy & POPIA</label>
<input type="hidden" id="role" value="seeker">
<button class="btn btn-green" id="submitBtn" type="submit">Create account →</button>
</form>
<div id="status" class="status"></div>
</div></div>
<script>
const supabaseClient = supabase.createClient("https://bzbsqouohsylnhrsjhhy.supabase.co","sb_publishable_4Pu9nggIN-RbVxfHhRpIUg_fR4hfba2");
function setRole(r){document.getElementById("role").value=r;document.getElementById("btn-seeker").classList.toggle("active",r==="seeker");document.getElementById("btn-employer").classList.toggle("active",r==="employer");}
function showStatus(m,t){const s=document.getElementById("status");s.textContent=m;s.className="status show "+t;}

document.getElementById("form").addEventListener("submit",async(e)=>{
 e.preventDefault();
 const name=document.getElementById("fn").value.trim();
 const email=document.getElementById("em").value.trim().toLowerCase();
 const password=document.getElementById("pw").value;
 const role=document.getElementById("role").value;
 if(!document.getElementById("popia").checked){showStatus("Accept POPIA","error");return;}
 const btn=document.getElementById("submitBtn");btn.disabled=true;btn.textContent="Creating account...";
 try{
  // 1. Create account
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{full_name:name,role:role}}});
  if(error && !error.message.toLowerCase().includes("already")) throw error;
  if(error && error.message.toLowerCase().includes("already")) throw new Error("Account already exists, please login");

  // 2. Login immediately - NO CODE NEEDED
  const {error:loginError}=await supabaseClient.auth.signInWithPassword({email,password});
  if(loginError) throw loginError;

  localStorage.setItem("jobway_user_email",email);
  localStorage.setItem("user_role",role);
  showStatus("Account created! Redirecting...","ok");
  
  setTimeout(()=>{
    if(role==="employer") location.href="employer-dashboard.html";
    else location.href="candidate-dashboard.html";
  },800);

 }catch(err){
  showStatus(err.message,"error");
  btn.disabled=false;btn.textContent="Create account →";
 }
});
</script>
</body>
</html>
