<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;min-height:100vh;display:flex;flex-direction:column}
.header{background:#11283A;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1E3A4A}
.logo{font-weight:900;color:#01F9C6;font-size:22px;letter-spacing:-0.5px}
.tag{font-size:11px;color:#8DB0BF;font-weight:700}
.container{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:28px 20px;width:100%;max-width:400px;box-shadow:0 10px 30px rgba(0,0,0,0.3)}
.h1{font-size:28px;font-weight:900;text-align:center;margin-bottom:6px}
.sub{font-size:13px;color:#8DB0BF;text-align:center;margin-bottom:22px;font-weight:600}
.label{font-size:11px;color:#8DB0BF;font-weight:800;letter-spacing:0.5px;margin:14px 0 6px;display:block;text-transform:uppercase}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:14px 14px;border-radius:12px;font-size:14px;font-family:inherit;outline:none;transition:0.2s}
.input:focus{border-color:#01F9C6}
.btn{width:100%;border:none;border-radius:14px;padding:14px;font-weight:900;cursor:pointer;font-size:14px;margin-top:20px;font-family:inherit;transition:0.2s}
.btn-green{background:#01F9C6;color:#08231C}
.btn-green:active{transform:scale(0.98)}
.btn-dark{background:#2A3F4E;color:white;margin-top:10px}
.badge{display:inline-flex;background:linear-gradient(135deg,#01F9C6,#30BA8F);color:#08231C;font-weight:900;font-size:10px;padding:5px 10px;border-radius:20px;margin-bottom:14px}
.footer{padding:16px;text-align:center;color:#5A7D8C;font-size:11px;font-weight:700}
.sep{display:flex;align-items:center;gap:10px;margin:16px 0;color:#5A7D8C;font-size:11px;font-weight:800}
.sep div{flex:1;height:1px;background:#25475A}
</style>
</head>
<body>
<div class="header">
<div><div class="logo">JobWay</div><div class="tag">Jobs via 079 060 8952</div></div>
<div style="background:#1A3341;border:1px solid #25475A;padding:8px 12px;border-radius:20px;font-size:11px;font-weight:800;color:#01F9C6">SA #1 1-Click Jobs</div>
</div>

<div class="container">
<div class="card">
<div style="text-align:center">
<div class="badge">⚡ 1-CLICK APPLY ACTIVE</div>
<div class="h1">Welcome Back</div>
<div class="sub">Login to track your applications & CV</div>
</div>

<label class="label">Email Address</label>
<input class="input" id="email" type="email" value="employer.jobway@gmail.com" placeholder="you@gmail.com">

<label class="label">Password</label>
<input class="input" id="pass" type="password" value="123456" placeholder="••••••">

<button class="btn btn-green" onclick="login()">Login → Dashboard</button>

<div class="sep"><div></div> OR <div></div></div>

<button class="btn btn-dark" onclick="location.href='jobs.html'">🔍 Browse Jobs as Guest</button>

<div style="margin-top:18px;text-align:center;color:#8DB0BF;font-size:12px;line-height:1.5">
📄 Your CV: <b style="color:white">Saved</b><br>
💬 Alerts from <b style="color:#01F9C6">079 060 8952</b> • No spam
</div>
</div>
</div>

<div class="footer">© 2026 JobWay • Built in Pretoria • 1-Click Apply™</div>

<script>
function login(){
 let e=document.getElementById('email').value;
 if(!e){alert('Enter email');return;}
 localStorage.setItem('jobway_user_email',e);
 localStorage.setItem('jobway_logged_in','true');
 location.href='jobs.html';
}
</script>
</body>
</html>
