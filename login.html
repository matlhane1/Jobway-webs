<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800;900&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#20576E;--mid:#30BA8F;--bright:#01F9C6;--dark:#0F2835;--deep:#11283A;--deep2:#0A1F2E;--muted:#A8C8D0}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--deep);color:#fff;min-height:100vh;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:50;background:var(--deep2);border-bottom:1px solid rgba(1,249,198,0.15)}
.top-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column}
.header-main{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-logo svg{height:38px;width:auto;display:block}
.btn{border-radius:999px;height:42px;padding:0 22px;font-size:13.5px;font-weight:800;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btn-login{background:var(--navy);color:#fff}.btn-signup{background:var(--bright);color:var(--navy);font-weight:900}
.container{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 20px}
.card{background:linear-gradient(135deg,#12344A,#20576E);border:1px solid rgba(1,249,198,0.2);border-radius:24px;padding:28px 22px;width:100%;max-width:420px;box-shadow:0 18px 40px rgba(0,0,0,0.3)}
.badge{display:inline-flex;background:var(--bright);color:var(--navy);font-weight:900;font-size:10px;padding:6px 12px;border-radius:20px;margin-bottom:14px;letter-spacing:0.06em}
.h1{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:800;text-align:center}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:6px 0 20px;font-weight:600}
.label{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:0.5px;margin:14px 0 6px;display:block;text-transform:uppercase}
.input{width:100%;background:rgba(10,31,46,0.8);border:1px solid rgba(255,255,255,0.1);color:white;padding:14px 16px;border-radius:999px;font-size:14px;outline:none}
.input:focus{border-color:var(--bright)}
.btn-green{width:100%;background:var(--bright);color:var(--navy);font-weight:900;border-radius:999px;padding:14px;border:0;cursor:pointer;margin-top:20px;font-size:14px}
.btn-dark{width:100%;background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.08);border-radius:999px;padding:14px;cursor:pointer;margin-top:10px;font-weight:800}
.footer{text-align:center;padding:16px;color:#6EA3AF;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="top"><div class="top-inner"><div class="header-main">
<a href="index.html" class="brand-logo"><svg viewBox="0 0 280 70" xmlns="http://www.w3.org/2000/svg"><g><path d="M 8 36 C 24 14 42 24 58 32 C 72 40 96 10 124 4 L 114 4 L 133 1 L 136 27 L 125 16 C 104 23 84 45 62 44 C 48 43 30 22 8 36 Z" fill="#01F9C6"/><circle cx="82" cy="12" r="7" fill="#01F9C6"/><path d="M 72 21 Q 76 15 82 18 T 78 28 L 88 32 L 84 36 L 72 30 L 70 38 L 66 36 Z" fill="white"/></g><g transform="translate(0,56)"><text x="4" y="0" font-family="Space Grotesk, sans-serif" font-weight="800" font-size="34" fill="white">JobWay</text><text x="5" y="13" font-family="Plus Jakarta Sans, sans-serif" font-weight="600" font-size="9.2" fill="#8FB3C1">your job, your way</text></g></svg></a>
<div><span style="font-size:11px;color:var(--muted);font-weight:700">Jobs via 079 060 8952</span></div>
</div></div></div>

<div class="container">
<div class="card">
<div style="text-align:center">
<div class="badge">⚡ 1-CLICK APPLY ACTIVE</div>
<div class="h1">Welcome Back</div>
<div class="sub">Login to track your applications & CV</div>
</div>
<label class="label">Email Address</label>
<input class="input" id="email" type="email" value="employer.jobway@gmail.com" placeholder="you@gmail.com">
<label class="label">Password</label>
<input class="input" id="pass" type="password" value="123456" placeholder="••••••">
<button class="btn-green" onclick="login()">Login → Dashboard</button>
<button class="btn-dark" onclick="location.href='jobs.html'">🔍 Browse Jobs as Guest</button>
<div style="margin-top:18px;text-align:center;color:var(--muted);font-size:12px;line-height:1.5">
📄 Your CV: <b style="color:white">Saved</b> • 💬 Alerts from <b style="color:var(--bright)">079 060 8952</b>
</div>
</div>
</div>
<div class="footer">© 2026 JobWay.co.za • Your Job, Your Way • Built in Pretoria</div>
<script>
function login(){
 let e=document.getElementById('email').value;
 if(!e){alert('Enter email');return;}
 localStorage.setItem('jobway_user_email',e);
 localStorage.setItem('jobway_logged_in','true');
 localStorage.setItem('user_role','employer');
 localStorage.setItem('employer_email',e);
 location.href='jobs.html';
}
</script>
</body>
</html>
