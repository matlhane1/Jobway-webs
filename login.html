<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:24px;width:100%;max-width:380px}
.logo{font-weight:900;color:#01F9C6;font-size:26px;text-align:center;margin-bottom:16px}
.label{font-size:12px;color:#8DB0BF;margin-top:12px;display:block;font-weight:700}
.input{width:100%;background:#0F2230!important;border:1px solid #25475A;color:white!important;padding:14px 46px 14px 14px;border-radius:12px;margin-top:8px;outline:none;font-size:14px;color-scheme:dark}
.btn{width:100%;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;margin-top:16px;cursor:pointer;font-size:15px}
.btn:disabled{opacity:.6}
.pass-wrap{position:relative}
.eye{position:absolute;right:10px;top:50%;transform:translateY(-8%);cursor:pointer;background:#11283A;border:1px solid #25475A;border-radius:8px;padding:6px 8px;font-size:11px;color:#01F9C6;font-weight:800}
.small{font-size:11px;color:#8DB0BF;text-align:center;margin-top:12px;line-height:1.4}
.link{color:#01F9C6;font-size:12px;text-decoration:none;font-weight:700;cursor:pointer}
.message{display:none;margin-top:12px;padding:10px;border-radius:10px;font-size:12px;text-align:center}
.message.error{display:block;background:#3A2025;border:1px solid #7A3540;color:#FFB4BE}
.message.success{display:block;background:#123A31;border:1px solid #1D705D;color:#9CFFE9}
</style>
</head>
<body>
<div class="card">
<div class="logo">JobWay</div>
<h3 style="text-align:center;margin-bottom:12px;">Login to Continue</h3>
<label class="label">Email</label>
<input class="input" id="email" type="email" placeholder="you@gmail.com" autocomplete="email">
<label class="label">Password</label>
<div class="pass-wrap">
<input class="input" id="pass" type="password" placeholder="••••••••" autocomplete="current-password">
<span class="eye" id="eyeButton">👁️ Show</span>
</div>
<button class="btn" id="loginButton" type="button">Log In</button>
<div style="display:flex;justify-content:space-between;margin-top:12px;">
<a class="link" id="forgotLink">Forgot Password?</a>
<a class="link" href="signup.html">Create account</a>
</div>
<div id="message" class="message"></div>
<p class="small">🔒 Secure login<br>No account = No access</p>
</div>
<script>
const SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
function showMessage(t,type='error'){
  const m=document.getElementById('message');
  m.textContent=t; m.className='message '+type;
}
document.getElementById('eyeButton').onclick = function(){
  const p=document.getElementById('pass');
  const e=document.getElementById('eyeButton');
  if(p.type==='password'){p.type='text';e.textContent='🙈 Hide';}else{p.type='password';e.textContent='👁️ Show';}
};
async function login(){
  const email=document.getElementById('email').value.trim().toLowerCase();
  const password=document.getElementById('pass').value;
  const btn=document.getElementById('loginButton');
  document.getElementById('message').className='message';
  if(!email||!password){showMessage('Please enter your email and password.');return;}
  btn.disabled=true; btn.textContent='Logging in...';
  try{
    const {data, error} = await supabaseClient.auth.signInWithPassword({email, password});
    if(error){ showMessage(error.message); btn.disabled=false; btn.textContent='Log In'; return; }
    const userId=data.user.id;
    let role = data.user.user_metadata?.role || 'seeker';
    let fullName = data.user.user_metadata?.full_name || '';
    let cvUrl = null;
    try{
      const {data:profile} = await supabaseClient.from('profiles').select('role, full_name, cv_url, phone').eq('id', userId).single();
      if(profile){
        if(profile.role) role = profile.role;
        if(profile.full_name) fullName = profile.full_name;
        if(profile.cv_url) cvUrl = profile.cv_url;
      }
    }catch(e){}

    // Also check candidate_cvs if profiles has no CV
    if(!cvUrl){
      try{
        const {data: cvRow} = await supabaseClient.from('candidate_cvs').select('cv_url, full_name').eq('user_id', userId).single();
        if(cvRow?.cv_url) cvUrl = cvRow.cv_url;
        if(cvRow?.full_name && !fullName) fullName = cvRow.full_name;
      }catch(e){}
    }

    role = String(role).toLowerCase().trim();
    if(role === 'candidate') role = 'seeker';
    if(role !== 'employer') role = 'seeker';

    // === FIX: ISOLATE USERS — wipe previous user's cached data if email changed ===
    const lastEmail = localStorage.getItem('jobway_last_email');
    if(lastEmail && lastEmail !== email){
      console.log('New user login, clearing old cache:', lastEmail, '->', email);
      localStorage.removeItem('jobway_applied');
      localStorage.removeItem('jobway_all_applications');
      localStorage.removeItem('jobway_profile');
      localStorage.removeItem('jobway_cv_url');
      localStorage.removeItem('jobway_pending_job');
    }
    localStorage.setItem('jobway_last_email', email);

    // === FIX: Save full jobway_user object (track page needs this!) ===
    const jobwayUser = {
      id: userId,
      email: email,
      full_name: fullName,
      fullName: fullName,
      role: role,
      cv_url: cvUrl,
      phone: data.user.phone || ''
    };
    localStorage.setItem('jobway_user', JSON.stringify(jobwayUser));
    localStorage.setItem('user', JSON.stringify(jobwayUser)); // fallback key
    localStorage.setItem('jobway_current_user', JSON.stringify(jobwayUser));
    localStorage.setItem('jobway_user_email', email);
    localStorage.setItem('jobway_logged_in','true');
    localStorage.setItem('user_role', role);
    localStorage.setItem('jobway_user_id', userId);
    if(cvUrl) localStorage.setItem('jobway_cv_url', cvUrl);

    // Also cache profile for profile.html
    localStorage.setItem('jobway_profile', JSON.stringify({
      fullName: fullName, email: email, cv_url: cvUrl, cvUrl: cvUrl
    }));

    showMessage('Login successful! Redirecting...','success');
    if(role === 'employer'){
      window.location.replace('employer-dashboard.html');
    } else {
      window.location.replace('applications.html');
    }
  }catch(err){ showMessage('Error: '+err.message); btn.disabled=false; btn.textContent='Log In'; }
}
document.getElementById('loginButton').addEventListener('click', login);
document.getElementById('forgotLink').addEventListener('click', async ()=>{
  const email=document.getElementById('email').value.trim().toLowerCase();
  if(!email){showMessage('Enter your email address first.');return;}
  const {error}=await supabaseClient.auth.resetPasswordForEmail(email);
  if(error) showMessage(error.message); else showMessage('Password reset link sent.','success');
});
document.getElementById('pass').addEventListener('keydown',e=>{if(e.key==='Enter') login();});
</script>
</body>
</html>
