<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | JobWay</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',sans-serif;background:#0F2230;color:white;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:24px;padding:24px;width:100%;max-width:380px}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:white;padding:14px;border-radius:12px;margin-top:10px}
.btn{width:100%;background:#01F9C6;color:#08231C;border:none;padding:14px;border-radius:999px;font-weight:900;margin-top:16px;cursor:pointer}
.logo{font-weight:900;color:#01F9C6;font-size:24px;text-align:center;margin-bottom:16px}
.label{font-size:12px;color:#8DB0BF;margin-top:12px;display:block;font-weight:700}
</style>
</head>
<body>
<div class="card">
<div class="logo">JobWay</div>
<h3 style="text-align:center;margin-bottom:12px">Login to Continue</h3>

<label class="label">Email</label>
<input class="input" id="email" type="email" placeholder="you@gmail.com">

<label class="label">Password</label>
<input class="input" id="pass" type="password" placeholder="••••••••">

<button class="btn" onclick="login()">Log In</button>

<p style="font-size:11px;color:#8DB0BF;text-align:center;margin-top:12px">
Employer emails: employer.jobway@gmail.com, @jobway.co.za, employer.*<br>
All others = Candidate
</p>
</div>

<script>
function getRoleFromEmail(email){
  const e = email.toLowerCase();
  const employerEmails = ['employer.jobway@gmail.com','admin@jobway.co.za','invoices@jobway.co.za'];
  if(employerEmails.includes(e)) return 'employer';
  if(e.endsWith('@jobway.co.za')) return 'employer';
  if(e.startsWith('employer.')) return 'employer';
  return 'candidate';
}

function login(){
  let e = document.getElementById('email').value.trim().toLowerCase();
  let pw = document.getElementById('pass').value;
  if(!e){ alert('Enter email'); return; }
  if(!pw){ alert('Enter password'); return; }
  
  let role = getRoleFromEmail(e);
  
  localStorage.removeItem('employer_email');
  localStorage.removeItem('candidate_email');
  localStorage.setItem('jobway_user_email', e);
  localStorage.setItem('jobway_logged_in','true');
  localStorage.setItem('user_role', role);
  
  if(role === 'employer'){
    localStorage.setItem('employer_email', e);
    location.href='employer-dashboard.html';
  } else {
    localStorage.setItem('candidate_email', e);
    location.href='seeker-dashboard.html';
  }
}
</script>
</body>
</html>
