<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - JobWay</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;background:#11283a;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:Arial;color:white}
.box{background:#1a3446;padding:28px;border-radius:20px;width:90%;max-width:360px}
h1{text-align:center;margin:0 0 6px} p{text-align:center;color:#9cc2d0;font-size:13px;margin-top:0}
input{width:100%;padding:12px;margin:10px 0;border-radius:10px;border:1px solid #284a5a;background:#0d1f2d;color:white;box-sizing:border-box}
button{width:100%;padding:12px;background:white;color:#11283a;border:none;border-radius:12px;font-weight:800;cursor:pointer;margin-top:10px}
a{color:#01F9C6;text-decoration:none;font-weight:700}
.showBtn{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:#1a3446;border:none;color:#9cc2d0;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12px}
</style>
</head>
<body>
<div class="box">
<h1>Welcome Back</h1><p>Login to JobWay</p>
<input id="email" type="email" placeholder="you@email.com">
<div style="position:relative"><input id="password" type="password" placeholder="Your password"><button class="showBtn" onclick="let p=document.getElementById('password');p.type=p.type==='password'?'text':'password'">SHOW</button></div>
<button id="loginBtn">Login</button>
<p style="margin-top:14px">No account? <a href="signup.html">Create one</a></p>
<p id="msg" style="color:#ff8a8a;text-align:center;font-size:13px"></p>
</div>
<script>
const SUPABASE_URL="https://dmxumcjeetphwzvggzzuk.supabase.co";
const SUPABASE_KEY="sb_publishable_AU4KIOG0eHhSNLK7hv1iEg_oYIr1M3";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

document.getElementById('loginBtn').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const password=document.getElementById('password').value.trim();
 const msg=document.getElementById('msg');
 if(!email||!password){msg.textContent="Fill email and password";return;}
 msg.textContent="Logging in...";
 const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
 if(error){msg.textContent=error.message;return;}
 msg.textContent="Login success!";
 setTimeout(()=>{location.href='employer-dashboard.html?v=202';},500);
};
</script>
</body>
</html>
