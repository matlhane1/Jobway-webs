<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#11283a;font-family:Inter,Arial,sans-serif;padding:20px}
.card{background:linear-gradient(180deg,#1e3a4f,#152c3f);border:1px solid rgba(255,255,255,0.08);border-radius:22px;padding:28px 24px;width:100%;max-width:400px}
h1{color:white;text-align:center;font-size:28px;font-weight:900;margin:0 0 20px}
label{color:#9cc2d0;font-size:14px;margin:14px 0 6px;display:block}
input{width:100%;padding:14px 16px;border-radius:14px;border:1px solid rgba(255,255,255,0.12);background:#0f2332;color:white;font-size:15px;outline:none;box-sizing:border-box}
input:focus{border-color:#01F9C6;box-shadow:0 0 0 3px rgba(1,249,198,0.15)}
.pw-wrap{position:relative} .eye{position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;background:rgba(255,255,255,0.1);border:none;border-radius:8px;padding:6px 9px;color:#9cc2d0;font-size:12px;font-weight:700}
.log-btn{width:100%;margin-top:22px;background:white;color:#11283a;border:none;padding:14px;border-radius:14px;font-weight:900;font-size:16px;cursor:pointer}
.log-btn:hover{background:#01F9C6} .foot{text-align:center;margin-top:16px;color:#7f9aab;font-size:14px} .foot a{color:#01F9C6;text-decoration:none;font-weight:700}
</style></head><body>
<div class="card"><h1>Portal Login</h1>
<label>Email</label><input id="email" type="email" placeholder="you@example.com">
<label>Password</label>
<div class="pw-wrap"><input id="password" type="password" placeholder="Your password">
<button class="eye" type="button" onclick="togglePw('password',this)">SHOW</button></div>
<button class="log-btn" id="loginBtn">Login</button>
<div class="foot">Don't have account? <a href="register.html?v=33">Register</a></div></div>
<script>
const supabaseClient=window.supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0eHhSNLK7hv1iEg_oYIr1M3");
function togglePw(id,btn){const i=document.getElementById(id);if(i.type==="password"){i.type="text";btn.textContent="HIDE";}else{i.type="password";btn.textContent="SHOW";}}
document.getElementById('loginBtn').addEventListener('click',async()=>{
const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;
if(!email||!password){alert("Fill all");return;}
const btn=document.getElementById('loginBtn');btn.textContent="Logging in...";btn.disabled=true;
const {error}=await supabaseClient.auth.signInWithPassword({email,password});
if(error){alert(error.message);btn.textContent="Login";btn.disabled=false;return;}
location.href="dashboard.html?v=33";
});
</script></body></html>
