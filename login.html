<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay - Login</title>
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,sans-serif}
body{margin:0;background:#11283a;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:#1c3445;width:100%;max-width:380px;border-radius:24px;padding:32px 24px;text-align:center}
h1{color:white;margin:0 0 6px;font-size:30px;font-weight:800}
.sub{color:#8fb0bf;font-size:14px;margin-bottom:20px}
label{color:#9cc2d0;text-align:left;display:block;font-size:13px;margin:14px 0 6px 4px}
.input{width:100%;background:#0f2533;border:1px solid #234355;color:#cde6f0;padding:14px 16px;border-radius:12px;outline:none;font-size:15px}
.pass-wrap{position:relative}
.pass-wrap .input{padding-right:85px}
.show{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:#1a3446;color:#9cc2d0;border:none;padding:8px 14px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer}
.btn{width:100%;background:white;color:#11283a;border:none;padding:14px;border-radius:14px;font-weight:800;font-size:15px;cursor:pointer;margin-top:20px}
.link{color:#8fb0bf;font-size:14px;margin-top:14px}
.link a{color:#01F9C6;text-decoration:none;font-weight:700}
.err{color:#ff8a8a;font-size:13px;margin-top:12px;min-height:18px}
.ok{color:#01F9C6;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<div class="card">
<h1>Welcome Back</h1><div class="sub">Login to JobWay</div>
<label>Email</label><input id="email" class="input" value="employer.jobway@gmail.com">
<label>Password</label>
<div class="pass-wrap"><input id="password" class="input" type="password" placeholder="Your password"><button class="show" onclick="const p=document.getElementById('password');p.type=p.type==='password'?'text':'password';this.textContent=p.type==='password'?'SHOW':'HIDE'" type="button">SHOW</button></div>
<button class="btn" id="loginBtn">Login</button>
<div class="link">No account? <a href="signup.html">Create one</a></div>
<div id="msg" class="err"></div>
</div>
<script>
const URL="https://dmxumcjeetphwzvggzzuk.supabase.co";
const KEY="sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-"; // your key - I fixed typo HhSNLK7 -> oHh5NLK7

document.getElementById('loginBtn').onclick=async()=>{
 const email=document.getElementById('email').value.trim();
 const pass=document.getElementById('password').value.trim();
 const msg=document.getElementById('msg');
 if(!email||!pass){msg.textContent="Enter email and password";return;}
 msg.textContent="Logging in..."; msg.className="ok";
 try{
  const res=await fetch(`${URL}/auth/v1/token?grant_type=password`,{
   method:"POST",
   headers:{"Content-Type":"application/json","apikey":KEY,"Authorization":"Bearer "+KEY},
   body:JSON.stringify({email,password:pass})
  });
  const data=await res.json();
  if(!res.ok) throw new Error(data.error_description||data.msg||"Login failed");
  // Save session for supabase-js to read
  localStorage.setItem('sb-dmxumcjeetphwzvggzzuk-auth-token', JSON.stringify({access_token:data.access_token,refresh_token:data.refresh_token,expires_at:Math.floor(Date.now()/1000)+data.expires_in,user:data.user}));
  msg.textContent="Login success! Redirecting...";
  setTimeout(()=>location.href='employer-dashboard.html?v=204',700);
 }catch(e){
  msg.className="err";
  msg.textContent=e.message;
 }
};
</script>
</body>
</html>
