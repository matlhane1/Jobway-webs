<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Check Domain DNS</title>
<style>body{font-family:Arial;background:#0F2230;color:white;padding:20px}input{width:100%;padding:12px;border-radius:8px;border:1px solid #25475A;background:#1A3341;color:white;margin:8px 0}.btn{background:#01F9C6;color:#08231C;border:none;padding:12px 20px;border-radius:999px;font-weight:900;cursor:pointer;width:100%}pre{background:#1A3341;padding:12px;border-radius:8px;overflow:auto;font-size:12px;border:1px solid #25475A;white-space:pre-wrap}</style></head>
<body>
<h2 style="color:#01F9C6">🔍 Get DNS for jobway.co.za</h2>
<p style="font-size:12px;color:#8DB0BF">Paste Resend API Key to fetch DNS records</p>
<input id="key" placeholder="re_xxxxxxxx">
<button class="btn" onclick="check()">Get DNS Records</button>
<pre id="out">Waiting for API key...</pre>
<script>
async function check(){
  const key = document.getElementById('key').value.trim();
  const out = document.getElementById('out');
  out.textContent='Loading domains...';
  try{
    const d = await fetch('https://api.resend.com/domains',{
      headers:{'Authorization':'Bearer '+key}
    });
    const data = await d.json();
    out.textContent = JSON.stringify(data,null,2);
    if(data.data && data.data.length>0){
      const domain = data.data.find(x=>x.name.includes('jobway')) || data.data[0];
      out.textContent += '\n\n--- Checking details for '+domain.name+' ---\n';
      const det = await fetch('https://api.resend.com/domains/'+domain.id,{
        headers:{'Authorization':'Bearer '+key}
      });
      const detData = await det.json();
      out.textContent += JSON.stringify(detData,null,2);
      if(detData.records){
        let txt='\n\n✅ ADD THESE IN YOUR DOMAIN DNS:\n\n';
        detData.records.forEach(r=>{
          txt+=`Type: ${r.record} | Name: ${r.name} | Value: ${r.value}\n\n`;
        });
        out.textContent += txt;
      }
    }
  }catch(e){ out.textContent='Error: '+e.message; }
}
</script>
</body></html>
