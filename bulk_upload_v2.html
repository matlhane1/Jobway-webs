<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bulk Upload - JobWay FIXED 2</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{margin:0;background:#11283a;color:#fff;font-family:Arial;padding:16px} .card{max-width:700px;margin:0 auto;background:#1e3a4f;border-radius:18px;padding:20px} textarea{width:100%;height:250px;background:#0f2332;color:#fff;border:1px solid #2dd4bf;border-radius:12px;padding:12px} .btn{background:#01F9C6;color:#11283a;border:none;padding:14px;border-radius:999px;width:100%;font-weight:900;cursor:pointer;margin-top:12px}</style>
</head><body><div class="card">
<h2>📥 Bulk Upload - Insert One By One (No Fail)</h2>
<p style="font-size:12px">Paste 100 lines: Title | Company | Location | Type | Link</p>
<textarea id="data"></textarea>
<button class="btn" id="uploadBtn">Upload All →</button>
<div id="msg" style="margin-top:12px;font-size:13px"></div>
</div>
<script>
const supabaseClient = window.supabase.createClient("https://dmxumcjeetphwzvgzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
document.getElementById('uploadBtn').onclick = async()=>{
  let raw = document.getElementById('data').value.trim();
  let lines = raw.split('\n').filter(l=>l.trim());
  let ok=0, fail=0; let failedLines=[];
  document.getElementById('msg').innerHTML = 'Uploading '+lines.length+' jobs one by one...';
  for(let i=0;i<lines.length;i++){
    let p = lines[i].split('|').map(s=>s.trim());
    if(p.length<3){ fail++; failedLines.push('Line '+(i+1)+' too short: '+lines[i]); continue; }
    let job = {
      title: p[0].slice(0,100),
      company_name: p[1].slice(0,100),
      location: p[2].slice(0,100),
      job_type: (p[3]||'Full-time').slice(0,50),
      type: (p[3]||'Full-time').slice(0,50),
      description: `VERIFIED JOB - Company: ${p[1]} Location: ${p[2]} Source: ${p[4]||''} Official Link: ${p[4]||''}`,
      salary_min: 5000,
      salary_max: 7000,
      employer_email: 'admin@jobway.co.za'
    };
    let { error } = await supabaseClient.from('jobs').insert(job);
    if(error){ fail++; failedLines.push('Line '+(i+1)+': '+error.message+' | '+lines[i]); }
    else ok++;
    document.getElementById('msg').innerHTML = `Uploaded ${ok} / ${lines.length} - Failed: ${fail}`;
  }
  document.getElementById('msg').innerHTML = `✅ Done! Success: ${ok} Failed: ${fail}<br><br>${failedLines.slice(0,10).join('<br>')}<br><br><a href="jobs.html" style="color:#01F9C6">View Jobs →</a>`;
  alert(`Done! ${ok} jobs live. Failed: ${fail}`);
};
</script></body></html>
