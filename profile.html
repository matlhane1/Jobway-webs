<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Profile | JobWay</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0F2230;color:#fff}
.header{background:#11283A;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e3a4a;position:sticky;top:0;z-index:10}
.logo{font-weight:900;color:#01F9C6;font-size:18px}
.btn{border:0;border-radius:20px;padding:9px 14px;font-weight:800;font-size:12px;cursor:pointer}
.btn-dark{background:#2A3F4E;color:#fff}
.btn-green{background:#01F9C6;color:#08231C;width:100%;padding:13px;margin-top:12px;font-size:14px;border-radius:50px;font-weight:900}
.btn-red{background:#2a1a1a;color:#ff6b6b;border:1px solid #5a2a2a;width:100%;padding:12px;margin-top:12px;border-radius:50px}
.container{max-width:480px;margin:0 auto;padding:14px}
.card{background:#1A3341;border:1px solid #25475A;border-radius:16px;padding:16px;margin-bottom:12px}
.input{width:100%;background:#0F2230;border:1px solid #25475A;color:#fff;padding:12px;border-radius:10px;margin-top:7px;font-size:14px}
.label{font-size:11px;color:#8DB0BF;margin-top:12px;display:block;font-weight:700}
.upload-box{border:2px dashed #01F9C6;border-radius:12px;padding:16px;text-align:center;margin-top:10px;background:#0f2a2a;cursor:pointer}
.file-name{color:#01F9C6;font-size:12px;margin-top:8px;font-weight:800}
.banner{background:#01F9C6;color:#08231C;border-radius:12px;padding:11px;font-weight:900;font-size:12px;text-align:center;margin-bottom:12px}
</style>
</head>
<body>
<div class="header">
<div class="logo">JobWay</div>
<div style="display:flex;gap:6px">
<button class="btn btn-dark" onclick="location.href='jobs.html'">Jobs</button>
<button class="btn btn-dark" onclick="location.href='track-applications.html'">Track</button>
<button class="btn btn-dark" onclick="logout()" style="background:#01F9C6;color:#08231C">Log Out</button>
</div>
</div>

<div class="container">
<div class="banner">🔒 CV is PRIVATE — only employers you applied to can download</div>

<div class="card">
<h3>👤 My Profile</h3>
<p style="font-size:11px;color:#8DB0BF;margin-top:4px">Upload CV once — 1-Click Apply everywhere</p>

<label class="label">Full Name *</label>
<input class="input" id="fullName" placeholder="e.g. Thabo Molefe">

<label class="label">WhatsApp Number * (0 format)</label>
<input class="input" id="whatsapp" placeholder="e.g. 072 123 4567">

<label class="label">Location</label>
<select class="input" id="location"><option>Gauteng</option><option>Western Cape</option><option>KwaZulu-Natal</option><option>Limpopo</option><option>Eastern Cape</option><option>North West</option><option>Mpumalanga</option><option>Free State</option><option>Northern Cape</option><option>Remote</option></select>

<label class="label">Skills (comma separated)</label>
<input class="input" id="skills" placeholder="e.g. Driving, Code 10, Forklift">
<div id="skillsPreview" style="margin-top:8px"></div>

<label class="label">📄 Upload CV (PDF, DOC - max 5MB) *</label>
<div class="upload-box" onclick="document.getElementById('cvFile').click()">
<div style="font-size:28px">🔒</div>
<div style="font-weight:800;margin-top:4px;font-size:13px">Click to upload CV</div>
<div style="color:#8DB0BF;font-size:11px;margin-top:3px">Stored privately — not public, not Google searchable</div>
<div class="file-name" id="fileName"></div>
<input type="file" id="cvFile" hidden accept=".pdf,.doc,.docx" onchange="handleFile(this.files[0])">
</div>
<div id="cvLink" style="text-align:center;margin-top:10px"></div>

<button class="btn btn-green" id="saveBtn" onclick="saveProfile()">💾 Save Profile + CV</button>
<div id="savedMsg" style="text-align:center;color:#01F9C6;font-size:13px;margin-top:10px;display:none;font-weight:800"></div>
<div id="debugBox" style="background:#000;color:#01F9C6;font-size:11px;padding:10px;border-radius:10px;margin-top:10px;white-space:pre-wrap;display:none"></div>

<hr style="margin:16px 0;border:0;border-top:1px solid #25475A">
<button class="btn btn-red" onclick="deleteEverything()">🗑️ Delete My Profile + CV (POPIA)</button>
<p style="font-size:10px;color:#8DB0BF;text-align:center;margin-top:6px">Deletes from phone, database AND storage bucket</p>
</div>
</div>

<script>
var SUPABASE_URL = 'https://dmxumcjeetphwzvgzzuk.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-';
var currentFile = null;

(function(){
  var logged = localStorage.getItem('jobway_logged_in');
  if(!logged){ window.location.href = 'login.html'; return; }
})();

function logout(){ try{ localStorage.clear(); }catch(e){} window.location.href = 'index.html'; }
function getUser(){ try{ return JSON.parse(localStorage.getItem('jobway_user') || 'null'); }catch(e){ return null; } }
function showDebug(t){ var d=document.getElementById('debugBox'); d.style.display='block'; d.textContent=t; }
function getSavedCvPath(){
  try{
    var p = JSON.parse(localStorage.getItem('jobway_profile')||'{}');
    return p.cv_path || p.cv_url || localStorage.getItem('jobway_cv_url') || localStorage.getItem('jobway_cv_path') || localStorage.getItem('jobway_cv') || '';
  }catch(e){ return localStorage.getItem('jobway_cv_url') || ''; }
}

function loadProfile(){
  var p={}; try{ p=JSON.parse(localStorage.getItem('jobway_profile')||'{}'); }catch(e){}
  var u=getUser();
  document.getElementById('fullName').value = p.fullName || (u&&u.full_name) || '';
  document.getElementById('whatsapp').value = p.whatsapp || (u&&u.phone) || (u&&u.whatsapp_number) || '';
  document.getElementById('skills').value = (p.skills||[]).join(', ');
  document.getElementById('location').value = p.location || 'Gauteng';
  var savedPath = getSavedCvPath();
  var savedName = p.cvName || '';
  if(savedName) document.getElementById('fileName').innerHTML = '✅ ' + savedName + ' (Private)';
  else if(savedPath) document.getElementById('fileName').innerHTML = '✅ CV on file (Private)';
  if(savedPath) document.getElementById('cvLink').innerHTML = '<div style="color:#8DB0BF;font-size:11px">🔒 Stored privately — employers you apply to get access</div>';
  renderSkills();
  // DEBUG: Show what ID we have - this is the #1 reason profiles stays NULL
  if(u) showDebug('DEBUG on load:\njobway_user = ' + JSON.stringify(u).slice(0,300) + '\nSaved CV path = ' + savedPath);
}
function renderSkills(){
  var val=document.getElementById('skills').value.split(',');
  var html=''; for(var i=0;i<val.length;i++){ var s=val[i].trim(); if(s) html+='<span style="background:#143E4A;color:#01F9C6;padding:5px 9px;border-radius:20px;font-size:11px;margin:3px;display:inline-block;font-weight:700">'+s+'</span>'; }
  document.getElementById('skillsPreview').innerHTML=html;
}
document.getElementById('skills').addEventListener('input', renderSkills);

function handleFile(file){
  if(!file) return;
  if(file.size > 5*1024*1024){ alert('File too big! Max 5MB'); return; }
  if(!['application/pdf','application/msword','application/vnd.openxmlformats-officedocument.wordprocessingml.document'].includes(file.type) && !file.name.match(/\.(pdf|doc|docx)$/i)){ alert('Only PDF/DOC/DOCX'); return; }
  currentFile=file;
  document.getElementById('fileName').innerHTML='✅ '+file.name+' ('+Math.round(file.size/1024)+'KB) - Ready on Save';
}
function uuid(){ return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(c){var r=Math.random()*16|0,v=c=='x'?r:(r&0x3|0x8);return v.toString(16);}); }

function saveProfile(){
  var fullName=document.getElementById('fullName').value.trim();
  var whatsapp=document.getElementById('whatsapp').value.trim();
  if(!fullName || !whatsapp){ alert('Fill Full Name + WhatsApp Number'); return; }
  var clean = whatsapp.replace(/\D/g,''); if(clean.charAt(0)=='0') clean='27'+clean.slice(1);
  if(clean.length<11){ alert('Use correct WhatsApp: 072...'); return; }
  
  var btn=document.getElementById('saveBtn'); btn.innerHTML='Saving...'; btn.disabled=true;
  var skills=document.getElementById('skills').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
  var locationVal=document.getElementById('location').value;
  var existingPath=getSavedCvPath();
  var existingName='';
  try{ var ep=JSON.parse(localStorage.getItem('jobway_profile')||'{}'); existingName=ep.cvName||''; }catch(e){}

  function finish(cvPath, cvName){
    var finalPath = cvPath || existingPath || '';
    var finalName = cvName || existingName || '';
    var user=getUser()||{};

    var profile={fullName:fullName, whatsapp:whatsapp, phoneClean:clean, skills:skills, location:locationVal, province:locationVal, cv_path:finalPath, cv_url:finalPath, cvName: finalName };
    try{
      localStorage.setItem('jobway_profile', JSON.stringify(profile));
      localStorage.setItem('jobway_cv_url', finalPath);
      localStorage.setItem('jobway_cv_path', finalPath);
      localStorage.setItem('jobway_cv', finalPath);
    }catch(e){}
    user.full_name=fullName; user.phone=whatsapp; user.whatsapp_number=clean; user.cv_path=finalPath; user.cv_url=finalPath;
    try{ localStorage.setItem('jobway_user', JSON.stringify(user)); }catch(e){}

    showDebug('Saving...\nuser.id = ' + (user.id || 'MISSING - THIS IS THE PROBLEM') + '\nfull_name = ' + fullName + '\ncv = ' + finalPath + '\nskills = ' + JSON.stringify(skills));

    // STEP 1: Find existing profiles row by full_name (do NOT trust user.id - it may not match profiles.id)
    var findXhr = new XMLHttpRequest();
    findXhr.open('GET', SUPABASE_URL+'/rest/v1/profiles?select=id,full_name&full_name=eq.'+encodeURIComponent(fullName), true);
    findXhr.setRequestHeader('apikey', SUPABASE_KEY);
    findXhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
    findXhr.onreadystatechange=function(){
      if(findXhr.readyState!==4) return;
      var foundId = null;
      if(findXhr.status===200){
        try{ var arr=JSON.parse(findXhr.responseText); if(arr && arr.length>0) foundId=arr[0].id; }catch(e){}
      } else {
        showDebug('FIND profiles FAILED: ' + findXhr.status + ' ' + findXhr.responseText);
      }
      // Use found ID, or user.id, or create new UUID
      var targetId = foundId || user.id || uuid();
      showDebug('Found profiles row? ' + (foundId || 'NO - will create new row') + '\nTarget ID to save to = ' + targetId + '\nNow saving to profiles...');

      // STEP 2: UPSERT to profiles with that ID
      var xhr=new XMLHttpRequest();
      xhr.open('POST', SUPABASE_URL+'/rest/v1/profiles?on_conflict=id', true);
      xhr.setRequestHeader('apikey', SUPABASE_KEY);
      xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
      xhr.setRequestHeader('Content-Type','application/json');
      xhr.setRequestHeader('Prefer','resolution=merge-duplicates,return=representation');
      xhr.onreadystatechange=function(){
        if(xhr.readyState===4){
          if(xhr.status>=200 && xhr.status<300){
            showDebug('✅ PROFILES SAVED!\nID = ' + targetId + '\nResponse: ' + xhr.responseText.slice(0,500));
            document.getElementById('savedMsg').style.display='block';
            document.getElementById('savedMsg').innerHTML='✅ CV Saved to profiles! Now you can apply.';
            btn.innerHTML='✅ Saved!';
            // Also save backup to whatsapp_subscribers
            var x2=new XMLHttpRequest();
            x2.open('POST', SUPABASE_URL+'/rest/v1/whatsapp_subscribers?on_conflict=whatsapp_number', true);
            x2.setRequestHeader('apikey', SUPABASE_KEY); x2.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY); x2.setRequestHeader('Content-Type','application/json'); x2.setRequestHeader('Prefer','resolution=merge-duplicates,return=representation');
            x2.send(JSON.stringify({whatsapp_number:clean, full_name:fullName, province:locationVal, cv_path:finalPath||null, cv_url:finalPath||null}));
            setTimeout(function(){ window.location.href='jobs.html'; }, 2000);
          } else {
            showDebug('❌ PROFILES SAVE FAILED\nStatus: ' + xhr.status + '\nError: ' + xhr.responseText + '\n\nThis is why cv_url is NULL. Copy this error and send it to me.');
            alert('PROFILES SAVE FAILED: ' + xhr.responseText);
            btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false;
          }
        }
      };
      xhr.onerror=function(){ showDebug('Network error saving to profiles'); btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false; };
      xhr.send(JSON.stringify({id:targetId, full_name:fullName, skills:skills, cv_url:finalPath||null, cv_name:finalName||null}));
    };
    findXhr.onerror=function(){ showDebug('Network error finding profile'); btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false; };
    findXhr.send();
  }

  if(currentFile){
    var ext=currentFile.name.split('.').pop().toLowerCase();
    var path = uuid() + '_' + uuid() + '.' + ext;
    var xhr=new XMLHttpRequest();
    xhr.open('POST', SUPABASE_URL+'/storage/v1/object/cvs/'+path, true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY);
    xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
    xhr.setRequestHeader('Content-Type', currentFile.type || 'application/pdf');
    xhr.setRequestHeader('x-upsert','false');
    xhr.onreadystatechange=function(){
      if(xhr.readyState===4){
        if(xhr.status===200 || xhr.status===201){ finish(path, currentFile.name); }
        else { alert('Upload failed: '+xhr.responseText); btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false; }
      }
    };
    xhr.onerror=function(){ alert('Network error uploading CV'); btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false; };
    xhr.send(currentFile);
  } else {
    if(!existingPath){ alert('Please upload CV - employers need it'); btn.innerHTML='💾 Save Profile + CV'; btn.disabled=false; return; }
    finish(existingPath, existingName);
  }
}

function downloadCV(cvPath){
  if(!cvPath){ alert('No CV on file for this applicant'); return; }
  var xhr=new XMLHttpRequest();
  xhr.open('POST', SUPABASE_URL+'/storage/v1/object/sign/cvs/'+cvPath, true);
  xhr.setRequestHeader('apikey', SUPABASE_KEY);
  xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
  xhr.setRequestHeader('Content-Type','application/json');
  xhr.onreadystatechange=function(){
    if(xhr.readyState===4 && xhr.status===200){
      try{ var res=JSON.parse(xhr.responseText); window.open(SUPABASE_URL+'/storage/v1'+res.signedURL, '_blank'); }catch(e){ alert('Could not open CV'); }
    } else if(xhr.readyState===4){ alert('CV download failed - file may have been deleted'); }
  };
  xhr.send(JSON.stringify({expiresIn: 60}));
}

function deleteEverything(){
  if(!confirm('Delete your profile + CV? This deletes from phone, database AND bucket. Cannot be undone.')) return;
  var p={}; try{ p=JSON.parse(localStorage.getItem('jobway_profile')||'{}'); }catch(e){}
  var user=getUser()||{};
  var cvToDelete = p.cv_path || p.cv_url || getSavedCvPath();
  var pending=0;
  function checkDone(){
    pending--;
    if(pending<=0){
      try{ localStorage.removeItem('jobway_profile'); localStorage.removeItem('jobway_cv_url'); localStorage.removeItem('jobway_cv_path'); localStorage.removeItem('jobway_cv'); localStorage.removeItem('jobway_user'); localStorage.removeItem('jobway_logged_in'); }catch(e){}
      alert('✅ Deleted everywhere: phone + DB + storage. CV no longer accessible.');
      window.location.href='index.html';
    }
  }
  pending++;
  if(cvToDelete){
    var xhrDel=new XMLHttpRequest(); 
    xhrDel.open('DELETE', SUPABASE_URL+'/storage/v1/object/cvs/'+cvToDelete, true);
    xhrDel.setRequestHeader('apikey', SUPABASE_KEY); 
    xhrDel.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
    xhrDel.onreadystatechange=function(){ if(xhrDel.readyState===4) checkDone(); };
    xhrDel.onerror=function(){ checkDone(); };
    xhrDel.send();
  } else { checkDone(); }
  pending++;
  if(user.id){
    var xhrP=new XMLHttpRequest();
    xhrP.open('PATCH', SUPABASE_URL+'/rest/v1/profiles?id=eq.'+user.id, true);
    xhrP.setRequestHeader('apikey', SUPABASE_KEY); xhrP.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY); xhrP.setRequestHeader('Content-Type','application/json');
    xhrP.onreadystatechange=function(){ if(xhrP.readyState===4) checkDone(); };
    xhrP.onerror=function(){ checkDone(); };
    xhrP.send(JSON.stringify({cv_url:null, cv_name:null, skills:[]}));
  } else { checkDone(); }
  pending++;
  if(p.phoneClean){
    var xhr=new XMLHttpRequest(); xhr.open('DELETE', SUPABASE_URL+'/rest/v1/whatsapp_subscribers?whatsapp_number=eq.'+p.phoneClean, true);
    xhr.setRequestHeader('apikey', SUPABASE_KEY); xhr.setRequestHeader('Authorization','Bearer '+SUPABASE_KEY);
    xhr.onreadystatechange=function(){ if(xhr.readyState===4) checkDone(); };
    xhr.onerror=function(){ checkDone(); };
    xhr.send();
  } else { checkDone(); }
}
loadProfile();
</script>
</body>
</html>
