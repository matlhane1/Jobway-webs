<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jobway | South Africa's Premium Job Board</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root { --primary: #005B5C; --dark-blue: #0F2942; --bg: #F8FAFC; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); color: #1E293B; text-align: center; }
        nav { background: var(--dark-blue); padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; font-weight: 600; font-size: 22px; }
        .hero { padding: 80px 20px; background: linear-gradient(135deg, #132E4F, var(--dark-blue)); color: white; }
        .hero h1 { font-size: 36px; margin-bottom: 15px; }
        .hero p { color: #94A3B8; font-size: 16px; margin-bottom: 30px; }
        .btn { display: inline-block; background: var(--primary); color: white; padding: 14px 30px; border-radius: 8px; text-decoration: none; font-weight: 600; margin: 10px; transition: 0.2s; }
        .btn:hover { background: #00A896; }
        .btn-sec { background: transparent; border: 2px solid white; }
        .btn-sec:hover { background: rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <nav><a href="#">Jobway</a></nav>
    <div class="hero">
        <h1>Find the job that fits your life</h1>
        <p>Connecting serious South African companies with premium talent securely.</p>
        <a href="register.html" class="btn">Create Account</a>
        <a href="login.html" class="btn btn-sec">Portal Login</a>
    </div>
</body>
</html>
