<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobWay.co.za — Your Job, Your Way</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#20576E;--mid:#30BA8F;--bright:#01F9C6;--dark:#0F2835;--bg:#F5FAF8;--muted:#6E8A95;--line:#E3EEEB}
*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--dark)}
/* PERFECT HEADER - STRAIGHT LINE FIX */
.top{position:sticky;top:0;z-index:50;background:#11283A;border-bottom:1px solid rgba(255,255,255,0.08)}
.top-inner{max-width:1280px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column}
.header-main{height:68px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand-logo{display:flex;align-items:center;flex-shrink:0}
.brand-logo img{height:42px;width:auto;display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,0.15))}
.nav-cta{display:flex;align-items:center;gap:10px;flex-shrink:0}
.btn{border-radius:999px;height:40px;padding:0 20px;min-width:88px;font-size:13.5px;font-weight:800;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;white-space:nowrap}
.btn-login{background:#20576E;color:#fff}.btn-signup{background:#01F9C6;color:#20576E;font-weight:900;box-shadow:0 8px 20px rgba(1,249,198,0.3)}
.header-nav{height:44px;display:flex;align-items:center;gap:24px;border-top:1px solid rgba(255,255,255,0.08)}
.header-nav a{color:#B7CDD5;font-size:13px;font-weight:600;text-decoration:none}.header-nav a.active{color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:28px 20px}
.hero{display:grid;grid-template-columns:1.15fr 0.85fr;gap:28px;align-items:center}
.h1{font-family:'Space Grotesk',sans-serif;font-size:62px;line-height:0.9;letter-spacing:-0.04em;font-weight:800;color:#0C2333}
.sub{color:#6E8A95;font-size:15px;line-height:1.6;margin:14px 0;max-width:520px}
@media(max-width:960px){.hero{grid-template-columns:1fr}.h1{font-size:42px}.header-main{height:62px}.brand-logo img{height:36px}.top-inner{padding:0 16px}}
</style>
</head>
<body>
<div class="top"><div class="top-inner">
<div class="header-main">
<a href="index.html" class="brand-logo"><img src="jobway_clean_white_small.png" alt="JobWay - your job, your way"></a>
<div class="nav-cta"><button class="btn btn-login" onclick="location.href='login.html'">Log In</button><button class="btn btn-signup" onclick="location.href='signup.html'">Sign Up</button></div>
</div>
<div class="header-nav"><a href="index.html" class="active">Find Jobs</a><a href="jobs.html">Jobs</a><a href="pricing.html">Pricing</a><a href="employer-dashboard.html">For Employers</a></div>
</div></div>

<div class="wrap">
<div class="hero"><div>
<div style="font-weight:800;letter-spacing:0.22em;font-size:11px;color:#30BA8F;margin-bottom:10px">YOUR JOB, YOUR WAY.</div>
<div class="h1"><span style="color:#20576E">Jobs.</span><br>Careers.<br><span style="color:#30BA8F">Opportunities.</span></div>
<div class="sub">Discover thousands of job opportunities from top companies across South Africa. Premium hiring tools trusted by employers across South Africa.</div>
<div style="margin-top:18px;display:flex;gap:12px"><button class="btn btn-dark" style="background:#0F2835;color:#fff;height:44px;padding:0 24px" onclick="location.href='jobs.html'">Find Jobs →</button><button class="btn" style="background:#fff;border:1px solid #E3EEEB;height:44px" onclick="location.href='employer-dashboard.html'">Post a Job</button></div>
</div><div style="height:420px;border-radius:28px;background:linear-gradient(180deg,#E9FFFB,#fff);border:1px solid #DFF0EA;display:grid;place-items:center;font-size:80px">🇿🇦</div></div>
</div>
</body>
</html>
