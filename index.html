<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobWay</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#11283a;color:#fff;font-family:Arial}.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}.logo{color:#01F9C6;font-weight:900;font-size:24px}.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a}.container{max-width:650px;margin:0 auto;padding:16px}.search-box{background:#1a3446;border-radius:20px;padding:16px;margin-bottom:16px}.input{width:100%;background:#11283a;border:1px solid #2a4a5c;color:#fff;padding:12px;border-radius:12px;margin:5px 0;box-sizing:border-box}.row{display:flex;gap:8px}.card{background:#1a3446;border-radius:22px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,.05)}.meta{color:#8fb3c1;font-size:13px;margin:6px 0}.badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block}.badge-entry{background:rgba(1,249,198,.15);color:#01F9C6}.badge-salary{background:rgba(255,107,107,.15);color:#ff8a8a}.match{float:right;background:#01F9C6;color:#11283a;padding:6px 12px;border-radius:20px;font-weight:900;font-size:12px}.tip{background:rgba(1,249,198,.08);border-radius:12px;padding:10px;margin:10px 0;color:#01F9C6;font-size:13px}</style></head><body>
<div class="header"><div class="logo">JobWay</div><div><button class="btn btn-white" onclick="location.href='profile.html'">My Profile</button><button class="btn btn-green" onclick="location.href='employer-dashboard.html'" style="margin-left:6px">Employer</button></div></div>
<div class="container"><div class="search-box"><h3 style="margin:0 0 10px">🔍 Search & Filter</h3><input class="input" id="search" placeholder="Search e.g. Cashier" oninput="render()"><div class="row"><select class="input" id="loc" onchange="render()"><option value="">All Locations</option><option>Thohoyandou</option><option>Makhado</option><option>Polokwane</option></select><select class="input" id="type" onchange="render()"><option value="">Remote/Onsite</option><option>Full-time</option><option>Part-time</option></select></div><div class="row"><select class="input" id="exp"><option>Experience</option></select><input class="input" placeholder="Min Salary"></div><div class="row"><button class="btn btn-green" style="flex:1">📱 WhatsApp Job Alerts</button><button class="btn btn-white" style="flex:1" onclick="location.href='applications.html'">📊 Track Applications</button></div></div><div id="jobs"></div></div>
<script>
const supa=supabase.createClient("https://dmxumcjeetphwzvggzzuk.supabase.co","sb_publishable_AU4KIOG0oHh5NLK7hv1iEg_oYIrIM3-");
let JOBS=[{id:1,title:'Cashier',company:'Shoprite',location:'Thohoyandou',type:'Full-time',level:'Entry Level',salary:'R4500',desc:'Looking for cashier with matric',missing:'None',match:95,tip:'Perfect match! Apply now!'},{id:2,title:'Waiter',company:'Mugg & Bean',location:'Makhado',type:'Part-time',level:'Entry Level',salary:'R3500',desc:'Weekend waiter needed',missing:'Serving',match:65,tip:'Add Serving to CV for +10%'},{id:3,title:'Retail Assistant',company:'Boxer',location:'Thohoyandou',type:'Full-time',level:'Entry Level',salary:'R4000',desc:'Retail assistant needed',missing:'None',match:92,tip:'Perfect match! Apply now!'}];
function render(){let q=document.getElementById('search').value.toLowerCase(); let l=document.getElementById('loc').value; let filtered=JOBS.filter(j=>(!q||j.title.toLowerCase().includes(q))&&(!l||j.location==l)); document.getElementById('jobs').innerHTML=filtered.map(j=>`<div class="card"><span class="match">${j.match}% Match</span><h3 style="margin:0 0 8px">${j.title}</h3><div class="meta">${j.company} • ${j.location} • ${j.type}</div><div style="margin:8px 0"><span class="badge badge-entry">${j.level}</span> <span class="badge badge-salary">${j.salary}</span></div><div class="meta">${j.desc}</div><div class="meta" style="color:${j.missing=='None'?'#7ed8a8':'#ff8a8a'}">❌ Missing: ${j.missing}</div><div class="tip">💡 ✅ ${j.tip}</div><div class="row"><button class="btn btn-green" style="flex:1" onclick="applyJob(${j.id})">Apply Now</button><button class="btn btn-white" style="flex:1;background:transparent;color:#01F9C6;border:1px solid #01F9C6" onclick="applyJob(${j.id})">📅 Interview</button></div></div>`).join('');}
function applyJob(id){
  let job=JOBS.find(j=>j.id==id);
  // 1. Save for job seeker track
  let applied=JSON.parse(localStorage.getItem('jobway_applied')||'[]');
  if(!applied.find(x=>x.id==id)){
    applied.unshift({id,title:job.title,company:job.company,location:job.location,salary:job.salary,match:job.match,status:'Applied',date:new Date().toLocaleDateString(),created_at:new Date().toISOString()});
    localStorage.setItem('jobway_applied',JSON.stringify(applied));
  }
  // 2. Save for employer dashboard
  let all=JSON.parse(localStorage.getItem('jobway_all_applications')||'[]');
  if(!all.find(x=>x.job_title==job.title && x.email=='you@email.com')){
    all.unshift({id:'app_'+Date.now(),name:'You (Demo)',email:'you@email.com',whatsapp:'0721234567',match:job.match,job_title:job.title,status:'Applied',created_at:new Date().toISOString()});
    localStorage.setItem('jobway_all_applications',JSON.stringify(all));
  }
  // 3. Notification: Application Received
  let notifs=JSON.parse(localStorage.getItem('jobway_notifications')||'[]');
  notifs.unshift({type:'application_received',title:`✅ Application Received - ${job.title}`,message:`Your application for ${job.title} at ${job.company} was received. Employer will review soon.`,date:new Date().toISOString()});
  localStorage.setItem('jobway_notifications',JSON.stringify(notifs));
  alert(`✅ Applied for ${job.title}!\n📧 Email sent: Application Received\n💬 WhatsApp sent\n👉 Now click Track Applications to see Under Review status`);
  location.href='applications.html';
}
render();
</script></body></html>
