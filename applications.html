<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Applications - JobWay</title><style>body{margin:0;background:#11283a;color:#fff;font-family:Arial}.header{background:#0d1f2d;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.logo{color:#01F9C6;font-weight:900;font-size:22px}.btn{border:none;border-radius:12px;padding:10px 16px;font-weight:800;cursor:pointer}.btn-green{background:#01F9C6;color:#11283a}.btn-white{background:#fff;color:#11283a}.container{max-width:650px;margin:0 auto;padding:16px}.card{background:#1a3446;border-radius:22px;padding:18px;margin-bottom:14px;border:1px solid rgba(255,255,255,.05)}.meta{color:#8fb3c1;font-size:13px;margin:6px 0}.badge{padding:6px 12px;border-radius:20px;font-size:11px;font-weight:800;display:inline-block;margin:2px}.s-active{background:#01F9C6;color:#11283a}.s-pending{background:rgba(255,255,255,.1);color:#8fb3c1;border:1px solid #2a4a5c}.s-done{background:rgba(1,249,198,.15);color:#01F9C6}.progress{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}.interview-box{background:rgba(1,249,198,.08);border:1px solid rgba(1,249,198,.2);border-radius:14px;padding:12px;margin-top:10px}</style></head><body>
<div class="header"><div class="logo" onclick="location.href='index.html'" style="cursor:pointer">JobWay</div><div><button class="btn btn-white" onclick="location.href='index.html'">← Jobs</button><button class="btn btn-green" style="margin-left:6px" onclick="location.href='notifications.html'">🔔 Bell</button></div></div>
<div class="container"><h2>📊 My Applications <span id="count"></span></h2><div id="list"></div></div>
<script>
function load(){
  let applied = JSON.parse(localStorage.getItem('jobway_applied')||'[]');
  document.getElementById('count').innerText=`(${applied.length})`;
  if(applied.length==0){
    document.getElementById('list').innerHTML=`<div class="card" style="text-align:center"><p>No applications yet</p><p class="meta">Go apply for Cashier/Waiter first, then come back</p><button class="btn btn-green" onclick="location.href='index.html'">Go Apply</button></div>`;
    return;
  }
  document.getElementById('list').innerHTML=applied.map(app=>{
    let status = app.status||'Applied';
    let steps=['Applied','Under Review','Shortlisted','Approved'];
    let idx=steps.indexOf(status); if(idx==-1) idx=0;
    let badges=steps.map((s,i)=>{
      let cls=i<idx?'s-done':i==idx?'s-active':'s-pending';
      let icon=i<idx?'✅':i==idx?'👁️':'';
      return `<span class="badge ${cls}">${icon} ${s}</span>`;
    }).join('');
    let interview = app.interview_date?`<div class="interview-box">📅 <b>Interview Scheduled</b><br>Date: ${app.interview_date}<br>Time: ${app.interview_time}<br>Location: ${app.interview_location||'Thohoyandou Office'}</div>`:'';
    let rejected = status=='Rejected'?`<div style="color:#ff8a8a;margin-top:8px">❌ Application Rejected</div>`:'';
    return `<div class="card"><h3 style="margin:0 0 6px">${app.title} - ${app.company}</h3><div class="meta">Applied: ${app.date} • Match: ${app.match}% • ${app.location} • ${app.salary}</div><div class="progress">${badges}</div><div class="meta"><b>Status:</b> ${status}</div>${interview}${rejected}</div>`;
  }).join('');
}
load();
// Listen for employer updates
window.addEventListener('storage', load);
setInterval(load, 1000);
</script></body></html>
